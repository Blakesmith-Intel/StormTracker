name: Validate StormTracker feature branches

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run full frontend regression suite
        run: npm test

      - name: Validate relay worker syntax
        run: node --check relay/worker.js



      - name: Verify genuine-product cyclone GML decoder contracts (offline)
        run: python3 scripts/test-bom-issued-cyclone-decoder.py




      - name: Probe Brewarrina BoM Doppler transport (advisory)
        run: node scripts/probe-brewarrina-wind-source.mjs



  radar-production-package:
    # Run the full pinned-site build only on this scoped radar reliability
    # branch; routine feature validation remains the existing fast job.
    if: github.ref_name == 'fix/radar-auto-refresh-catchup-20261031' || github.head_ref == 'fix/radar-auto-refresh-catchup-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Retain immutable accepted V10 science source
        uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
          persist-credentials: false
      - name: Retain immutable diagnostic source
        uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
          persist-credentials: false
      - name: Retain experimental wind research preview
        uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
          persist-credentials: false
      - name: Build actual delivered radar refresh package and inspect
        run: |
          set -euo pipefail
          bash -x scripts/build-current-site.sh
          python scripts/apply-ftp-aep-release-v10.py
          python scripts/apply-radar-auto-refresh-v1.py
          node --check _site/src/live-loop-refresh-v1.js
          node --check _site/src/live3d-operational-v9.js
          node frontend/tests/run-radar-auto-refresh-v10-2-37-tests.mjs
          grep -Fq 'V10.2.37 RADAR AUTO REFRESH' _site/BUILD.txt
          grep -Fq 'LIVE_LOOP_BUSY_RETRY_MS = 2000' _site/src/live-loop-refresh-v1.js
          grep -Fq 'discoverBoundedBomReflectivityHistory(now,180,region)' _site/src/live3d-operational-v9.js
          ! grep -Fq 'discoverBoundedBomReflectivityHistory(now,5,region)' _site/src/live3d-operational-v9.js
