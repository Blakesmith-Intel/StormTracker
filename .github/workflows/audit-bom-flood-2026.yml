name: Audit BoM May 2026 flood classification station tables
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official PDF text decoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Read original 2026 BoM PDF and inspect station data
        run: node scripts/audit-bom-flood-2026.mjs
