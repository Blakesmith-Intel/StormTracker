name: Validate three-hour radar history

on:
  push:
    branches: ["feature/three-hour-radar-history"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run complete frontend regression suite
        run: npm test
