name: QA rainfall-gauge interaction hotfix V10
on:
  push:
    branches: [fix/rainfall-marker-interaction-v10-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rainfall:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all existing regression suites and new gauge click tests
        run: |
          npm test
          node --check frontend/src/context-layers/significant-rainfall-operational-v1.js
      - uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
      - uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
      - uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
      - name: Build pinned sealed V10.2.0 and validate interactive rainfall layer inclusion
        run: |
          bash scripts/build-current-site.sh
          node --check _site/src/context-layers/significant-rainfall-operational-v1.js
          grep -Fq 'window.addEventListener("pointerdown",pointerDown' _site/src/context-layers/significant-rainfall-operational-v1.js
          grep -Fq 'window.addEventListener("pointerup",pointerUp' _site/src/context-layers/significant-rainfall-operational-v1.js
          grep -Fq 'initialiseOperationalSignificantRainfall({viewer})' _site/src/live3d-operational-v9.js
          ! grep -Fq 'ftp-reflectivity-operational-v1.js' _site/src/bom-wmts-loop-v2.js
