name: V10.2 cyclone production release dry-run

on:
  pull_request:
    paths:
      - 'scripts/build-current-site.sh'
      - '.github/workflows/pages.yml'
      - 'frontend/**'
      - '.github/workflows/v10-2-pages-dryrun.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed release tooling
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retrieve preserved V9.18 diagnostic source
        uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
          persist-credentials: false
      - name: Retrieve immutable V10.2 cyclone candidate source
        uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
          persist-credentials: false
      - name: Checkout immutable V10.3 radar wind-hook QA for separate preview
        uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
          persist-credentials: false
      - name: Build exact production root and all three separate previews
        run: |
          set -euo pipefail
          test "$(git -C checked/production-v10.2.0 rev-parse HEAD)" = 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          npm test
          bash -x scripts/build-current-site.sh
          grep -Fq 'SEALED StormTracker V10.2.0 source 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2' _site/BUILD.txt
          grep -Fq 'RIVER-HISTORY MAINTENANCE HOTFIX 2026-10-18' _site/BUILD.txt
          grep -Fq 'RIVER-HISTORY NO-DATA V2 2026-10-18' _site/BUILD.txt
          grep -Fq 'OPTIONAL RIVER HISTORY 503 MITIGATION 2026-10-18' _site/BUILD.txt
          grep -Fq 'if(explicitlyTidal)return null' _site/src/context-layers/bom-recent-river-history-v1.js
          grep -Fq 'if(!classified && !inland)return null' _site/src/context-layers/bom-recent-river-history-v1.js
          grep -Fq '.slice(0,4)' _site/src/context-layers/river-gauge-layer-v1.js
          grep -Fq 'TERRAIN-SAFE OUTAGE POLYGONS 2026-10-18' _site/BUILD.txt
          grep -Fq 'MANUAL FLOOD GAUGE REFRESH 2026-10-18' _site/BUILD.txt
          grep -Fq 'BOUNDED STREAMING BOM RIVER TABLES 2026-10-18' _site/BUILD.txt
          grep -Fq 'STATEWIDE TIDAL REFERENCE RAPID-RISE THRESHOLD 1.40 M_PER_H 2026-10-18' _site/BUILD.txt
          grep -Fq 'NON_TIDAL_RAPID_RISE_M_PER_H = 0.30' _site/src/context-layers/river-flood-signals-v1.js
          grep -Fq 'COASTAL_UNCERTAIN_RAPID_RISE_M_PER_H = 1.40' _site/src/context-layers/river-flood-signals-v1.js
          grep -Fq 'INLAND_COAST_BUFFER_KM = 125' _site/src/context-layers/river-gauge-coastal-screen-v1.js
          grep -Fq 'INLAND RAPID RISE 0.30 M_PER_H COASTAL 1.40 M_PER_H 125 KM' _site/BUILD.txt
          grep -Fq 'source_response_too_large' _site/src/context-layers/bom-recent-river-history-v1.js
          grep -Fq 'river-large-table-stream-v1-20261018' _site/index.html
          grep -Fq 'id="refreshRiverGaugesButton"' _site/live3d-operational-v9.html
          grep -Fq 'aria-label="Refresh BoM flood-gauge observations"' _site/live3d-operational-v9.html
          grep -Fq 'bindRiverGaugeManualRefresh(' _site/src/context-layers/river-gauges-operational-v1.js
          grep -Fq 'body.simple-ui #controlSidebar #refreshRiverGaugesButton' _site/src/single-interface-v1.css
          grep -Fq 'flood-gauge-refresh-v1-20261018' _site/index.html
          grep -Fq 'styleTerrainClampedPowerOutagePolygon(entity.polygon,unplannedColour)' _site/src/context-layers/power-outages-v1.js
          grep -Fq 'terrain-outline-v1-20261018' _site/src/context-layers/power-outages-operational-v1.js
          grep -Fq 'noData++' _site/src/context-layers/river-gauge-layer-v1.js
          grep -Fq 'inspectBomRecentWaterLevelTable' _site/src/context-layers/bom-recent-river-history-v1.js
          grep -Fq 'river-history-nodata-v2-20261018' _site/index.html
          grep -Fq 'recentNextAttemptAt' _site/src/context-layers/river-gauge-layer-v1.js
          grep -Fq 'recentFloodHistoryGap' _site/src/context-layers/bom-recent-river-history-v1.js
          grep -Fq 'river-history-nodata-v2-20261018' _site/src/context-layers/river-gauges-operational-v1.js
          grep -Fq 'id="openCycloneForecastQa"' _site/live3d-operational-v9.html
          grep -Fq 'Currently no tropical cyclone warnings' _site/src/internal-cyclone-live-qa-v1.js
          grep -Fq 'Unable to verify current tropical cyclone warnings' _site/src/internal-cyclone-live-qa-v1.js
          node --check _site/src/live3d-operational-v9.js
          test -s _site/preview/radar-history-fix/BUILD.txt
          test -s _site/preview/incremental-3d/BUILD.txt
          test -s _site/preview/wind-hook-v10-3/BUILD.txt
          grep -Fq 'f3a07688ca02f5f0234ae6425fc1177722518c53' _site/preview/wind-hook-v10-3/BUILD.txt
          test -s _site/preview/wind-hook-v10-3/assets/v10-tornado.svg
          ! grep -Fq 'isWindHookQaPreview' _site/src/live3d-operational-v9.js
