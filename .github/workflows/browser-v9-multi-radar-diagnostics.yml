name: Browser QA V9.16.15 GPU-blocker diagnostics
on:
  push:
    branches: [feature/v9-multi-radar-display]
    paths:
      - ".github/workflows/browser-v9-multi-radar-diagnostics.yml"
      - "scripts/run-v9-browser-ci-diagnostics.mjs"
      - "scripts/smoke-v9-multi-radar-browser.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-browser-smoke-with-telemetry:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      BROWSER_ENGINE: ${{ matrix.browser }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install existing Playwright browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Validate existing V9 science and source invariants
        run: npm test
      - name: Start branch-only temporary static localhost viewer
        run: |
          python3 -m http.server 8765 --directory frontend > /tmp/stormtracker-v9-preview-ci.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/live3d-operational-v9.html >/dev/null
      - name: Test authentic BoM browser playback and capture host performance
        run: node scripts/run-v9-browser-ci-diagnostics.mjs
      - name: Upload full per-browser evidence on both pass and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-16-15-host-diagnostics-${{ matrix.browser }}
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 10
