name: Deploy StormTracker Relay V9.12

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v9.12-flood-gauges
    paths:
      - "relay/**"
      - "frontend/src/context-layers/river-height-bulletin-v1.js"
      - "frontend/tests/run-river-height-bulletin-v1-tests.mjs"
      - "frontend/tests/run-river-height-relay-v1-tests.mjs"
      - ".github/workflows/deploy-relay-v9-12.yml"

permissions:
  contents: read

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate StormTracker regression suite
        run: |
          npm test
          node --check relay/worker.js

      - name: Deploy stormtracker-bom-relay
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy

      - name: Smoke-test river-height relay
        run: |
          set -euo pipefail
          url="https://stormtracker-bom-relay.stormtracker-bom-relay.workers.dev/river-height-bulletins"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$url" -o /tmp/river-heights.json; then
              if python -c 'import json; p=json.load(open("/tmp/river-heights.json", encoding="utf-8")); products=p.get("products") or []; observations=sum(len(x.get("observations") or []) for x in products); assert p.get("format")=="StormTrackerRiverHeightBulletinsV1"; assert products; assert observations > 0; print(f"River-height relay returned {len(products)} product(s), {observations} observation(s), partial={p.get(chr(112)+chr(97)+chr(114)+chr(116)+chr(105)+chr(97)+chr(108))}.")'; then
                exit 0
              fi
            fi

            sleep 3
          done

          echo "River-height relay smoke test failed."
          head -c 1000 /tmp/river-heights.json 2>/dev/null || true
          exit 1
