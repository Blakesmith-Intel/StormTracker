name: Deploy static StormTracker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write # Required only to create the immutable release tag after verified Pages deployment
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate current development source
        run: npm test
      - name: Checkout sealed V9.17.0 pixel-tracking production source
        uses: actions/checkout@v4
        with:
          # Exact, green-reviewed release merge commit. Never deploy unpinned main.
          ref: 60d6750be2d335858dac485a5312a55693e40c74
          path: sealed-production/v9.17.0
          persist-credentials: false
      - name: Verify and test V9.17.0 release source
        run: |
          set -euo pipefail
          (cd sealed-production/v9.17.0 && npm test)
          node --check sealed-production/v9.17.0/relay/worker.js
          test "$(git -C sealed-production/v9.17.0 rev-parse HEAD)" = "60d6750be2d335858dac485a5312a55693e40c74"
          grep -Fq 'sidebar-hardcut-v14' sealed-production/v9.17.0/frontend/index.html
          ! grep -Fq 'id="dopplerOpacity"' sealed-production/v9.17.0/frontend/live3d-operational-v9.html
          ! grep -Fq 'id="operationalDoppler"' sealed-production/v9.17.0/frontend/live3d-operational-v9.html
          grep -Fq 'pixeltrack-prod-r1' sealed-production/v9.17.0/frontend/index.html
          grep -Fq 'pixeltrack-prod-r1' sealed-production/v9.17.0/frontend/live3d-operational-v9.html
          grep -Fq 'minPixels: 16' sealed-production/v9.17.0/frontend/src/config.js
          ! grep -Fq 'minAreaKm2' sealed-production/v9.17.0/frontend/src/config.js
          test -f sealed-production/v9.17.0/frontend/src/storm-track-presentation-v1.js
          test -f sealed-production/v9.17.0/frontend/src/multi-radar-display-v9.js
          test -f sealed-production/v9.17.0/frontend/src/volumetric-visual-v2.js
          test -f sealed-production/v9.17.0/frontend/src/border-radar-sites-v1.js
          grep -Fq 'source_low_level_dbzh: inputDbz' sealed-production/v9.17.0/frontend/src/measured-track-volume-v1.js
          grep -Fq 'point.source_low_level_dbzh ?? point.dbzh' sealed-production/v9.17.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'btn.appendChild(dishGlyph())' sealed-production/v9.17.0/frontend/src/context-layers/radar-site-name-overlay-v1.js
          grep -Fq 'dopplerIntegrated:false' sealed-production/v9.17.0/frontend/src/border-radar-sites-v1.js
          grep -Fq 'id="reflectivityLegend"' sealed-production/v9.17.0/frontend/live3d-operational-v9.html
          grep -Fq 'id="blobVolume" checked' sealed-production/v9.17.0/frontend/live3d-operational-v9.html
          grep -Fq 'width:18px;height:18px' sealed-production/v9.17.0/frontend/src/operational-dashboard-v9-1.css
          test -f sealed-production/v9.17.0/docs/HANDOVER_V9.17.0.md
          test -f sealed-production/v9.17.0/docs/USER_GUIDE_V9.17.0.md
          grep -Fq 'id="multiRadarSelectButton"' sealed-production/v9.17.0/frontend/live3d-operational-v9.html
          grep -Fq 'id="multiRadarStatus"' sealed-production/v9.17.0/frontend/live3d-operational-v9.html
          grep -Fq 'role="alert" aria-live="assertive" hidden' sealed-production/v9.17.0/frontend/live3d-operational-v9.html
          grep -Fq 'maximum of three additional radars' sealed-production/v9.17.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'MAX_DISPLAY_RADAR_SITES = 4' sealed-production/v9.17.0/frontend/src/multi-radar-display-v9.js
          grep -Fq 'multiradar-v15' sealed-production/v9.17.0/frontend/index.html
          test -f sealed-production/v9.17.0/frontend/src/storm-track-trail-visibility-v1.js
          grep -Fq 'const trackVolumesRequested = true' sealed-production/v9.17.0/frontend/src/live3d-operational-v9.js

      # Preview subpaths share the trusted production github.io Origin,
      # so existing Cloudflare relay CORS policies work unchanged.
      - name: Checkout independent BoM dBZ cloud-volume preview
        uses: actions/checkout@v4
        with:
          # Draft PR #71, pinned; never replace the protected production root.
          ref: 07b8baafd0d1bf3bccd16f6fbb6667e0a0261fbd
          path: preview-builds/volumetric-dbz
          persist-credentials: false
      - name: Checkout V9.14 candidate
        uses: actions/checkout@v4
        with:
          ref: feature/v9.14.0-source-freshness
          path: preview-builds/v9.14.0
          persist-credentials: false
      - name: Checkout V9.15 candidate
        uses: actions/checkout@v4
        with:
          ref: feature/v9.15.0-qfd-technical-rescue
          path: preview-builds/v9.15.0
          persist-credentials: false
      - name: Checkout V9.15.1 storm-label preview
        uses: actions/checkout@v4
        with:
          ref: feature/v9.15.1-storm-label-foreground
          path: preview-builds/v9.15.1
          persist-credentials: false
      - name: Checkout V9.16 severe radar alerts candidate
        uses: actions/checkout@v4
        with:
          ref: feature/severe-storm-radar-alerts-v1
          path: preview-builds/v9.16
          persist-credentials: false
      - name: Checkout V9.16.13 foreground label and fixed Doppler candidate
        uses: actions/checkout@v4
        with:
          ref: 2c3dd61e70cf6d5d7ab313ba310bcb1ad732710e
          path: preview-builds/v9.16.13
          persist-credentials: false
      - name: Checkout V9.16.12 foreground town label candidate
        uses: actions/checkout@v4
        with:
          ref: caa8bd7d6e460a5f5bf2b49edb53dae01690f4ad
          path: preview-builds/v9.16.12
          persist-credentials: false
      - name: Checkout V9.16.11 native Doppler-only candidate
        uses: actions/checkout@v4
        with:
          ref: f7c12b0a7d2942446dc111428b4b7700cee11882
          path: preview-builds/v9.16.11
          persist-credentials: false
      - name: Checkout V9.16.10 playback/cone/trail candidate
        uses: actions/checkout@v4
        with:
          ref: f4927fea810833230bce1af65df80ee2e3b59661
          path: preview-builds/v9.16.10
          persist-credentials: false
      - name: Checkout validated native BoM playback review
        uses: actions/checkout@v4
        with:
          # Pin to the exact 88-suite-tested source; later feature pushes cannot
          # silently change this published review build.
          ref: 651b9aaf6780f4efb6a6fada7462483ca20c4ed1
          path: preview-builds/native-playback
          persist-credentials: false
      - name: Checkout isolated playback/cone repair review
        uses: actions/checkout@v4
        with:
          # Exact, immutable PR #57 candidate. Production root stays protected.
          ref: 202c212cd8dc1558b4b8788d01fa71001bc18fdc
          path: preview-builds/playback-cone-fix
          persist-credentials: false
      # Pinned PR #64: isolated pixel-based >=40 dBZ storm grouping/decluttering.
      # Never alter the sealed production checkout or production site root.
      - name: Checkout pixel-based storm grouping candidate
        uses: actions/checkout@v4
        with:
          ref: a5f2d3658d738c52b209256751315ec00482d246
          path: preview-builds/track-grouping
          persist-credentials: false
      # Pinned PR #63: multi-radar site selection visual preview, not production.
      - name: Checkout V9.17.0 multiple radar display candidate
        uses: actions/checkout@v4
        with:
          ref: ed3ecd3d8189e5e2d4fc7dd5f62d826b30e76903
          path: preview-builds/multi-radar
          persist-credentials: false
      - name: Download authentic Gympie 2025 measured radar research previews
        uses: actions/download-artifact@v4
        with:
          repository: Blakesmith-Intel/StormTracker
          run-id: 37816421560
          github-token: ${{ github.token }}
          name: AURA-Gympie-2025-measured-reflectivity-doppler
          path: preview-builds/gympie-observations
      - name: Download audited real-event two-scan hook candidate report
        uses: actions/download-artifact@v4
        with:
          repository: Blakesmith-Intel/StormTracker
          run-id: 37817144956
          github-token: ${{ github.token }}
          name: AURA-Gympie-2025-experimental-hook-replay
          path: preview-builds/gympie-hook-audit
      - name: Validate BoM dBZ volume preview independently
        shell: bash
        run: |
          set -euo pipefail
          (cd preview-builds/volumetric-dbz && npm test)
          test "$(git -C preview-builds/volumetric-dbz rev-parse HEAD)" = "07b8baafd0d1bf3bccd16f6fbb6667e0a0261fbd"
          test -f preview-builds/volumetric-dbz/frontend/src/volumetric-visual-v2.js
          test -f preview-builds/volumetric-dbz/frontend/tests/run-volumetric-visual-v2-tests.mjs
          test -f preview-builds/volumetric-dbz/frontend/tests/run-nsw-border-radar-site-labels-v1-tests.mjs
          grep -Fq 'id="blobVolume" checked' preview-builds/volumetric-dbz/frontend/live3d-operational-v9.html
          grep -Fq 'id="reflectivityLegend"' preview-builds/volumetric-dbz/frontend/live3d-operational-v9.html
          ! grep -Eqi 'rainRateLegend|estimated mm/h' preview-builds/volumetric-dbz/frontend/live3d-operational-v9.html

      - name: Validate all four candidates independently
        run: |
          (cd preview-builds/v9.14.0 && npm test)
          (cd preview-builds/v9.15.0 && npm test)
          (cd preview-builds/v9.15.1 && npm test)
          (cd preview-builds/v9.16 && npm test)

      - name: Validate V9.16.13 candidate independently
        run: |
          (cd preview-builds/v9.16.13 && npm test)
          test "$(git -C preview-builds/v9.16.13 rev-parse HEAD)" = "2c3dd61e70cf6d5d7ab313ba310bcb1ad732710e"
          node --check preview-builds/v9.16.13/relay/worker.js
      - name: Validate V9.16.12 candidate independently
        run: |
          (cd preview-builds/v9.16.12 && npm test)
          node --check preview-builds/v9.16.12/relay/worker.js
          test "$(git -C preview-builds/v9.16.12 rev-parse HEAD)" = "caa8bd7d6e460a5f5bf2b49edb53dae01690f4ad"
      - name: Validate V9.16.11 candidate independently
        run: |
          (cd preview-builds/v9.16.11 && npm test)
          test "$(git -C preview-builds/v9.16.11 rev-parse HEAD)" = "f7c12b0a7d2942446dc111428b4b7700cee11882"
      - name: Validate V9.16.10 candidate independently
        run: |
          (cd preview-builds/v9.16.10 && npm test)
          test "$(git -C preview-builds/v9.16.10 rev-parse HEAD)" = "f4927fea810833230bce1af65df80ee2e3b59661"
      - name: Validate native BoM playback preview independently
        run: |
          (cd preview-builds/native-playback && npm test)
          node --check preview-builds/native-playback/relay/worker.js
          test "$(git -C preview-builds/native-playback rev-parse HEAD)" = "651b9aaf6780f4efb6a6fada7462483ca20c4ed1"

      - name: Validate playback/cone repair in isolation
        run: |
          (cd preview-builds/playback-cone-fix && npm test)
          test "$(git -C preview-builds/playback-cone-fix rev-parse HEAD)" = "202c212cd8dc1558b4b8788d01fa71001bc18fdc"

      - name: Validate pixel-based storm grouping preview independently
        shell: bash
        run: |
          set -euo pipefail
          (cd preview-builds/track-grouping && npm test)
          node --check preview-builds/track-grouping/relay/worker.js
          test "$(git -C preview-builds/track-grouping rev-parse HEAD)" = "a5f2d3658d738c52b209256751315ec00482d246"
          grep -Fq 'minPixels: 16' preview-builds/track-grouping/frontend/src/config.js
          ! grep -Fq 'minAreaKm2' preview-builds/track-grouping/frontend/src/config.js
          test -f preview-builds/track-grouping/frontend/src/storm-track-presentation-v1.js

      - name: Validate multi-radar preview independently
        shell: bash
        run: |
          set -euo pipefail
          (cd preview-builds/multi-radar && npm test)
          node --check preview-builds/multi-radar/relay/worker.js
          test "$(git -C preview-builds/multi-radar rev-parse HEAD)" = "ed3ecd3d8189e5e2d4fc7dd5f62d826b30e76903"
          test -f preview-builds/multi-radar/frontend/src/multi-radar-display-v9.js
          grep -Fq 'id="multiRadarSelectButton"' preview-builds/multi-radar/frontend/live3d-operational-v9.html
          grep -Fq 'MAX_DISPLAY_RADAR_SITES = 4' preview-builds/multi-radar/frontend/src/multi-radar-display-v9.js

      - name: Stage isolated live previews without changing production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/preview/volume-dbz
          cp -a preview-builds/volumetric-dbz/frontend/. frontend/preview/volume-dbz/
          printf 'BoM dBZ volumetric V2 preview candidate %s\n' '07b8baafd0d1bf3bccd16f6fbb6667e0a0261fbd' > frontend/preview/volume-dbz/BUILD.txt
          test -f frontend/preview/volume-dbz/src/volumetric-visual-v2.js
          mkdir -p frontend/preview/multi-radar
          cp -a preview-builds/multi-radar/frontend/. frontend/preview/multi-radar/
          printf 'V9.17.0 multi-radar preview candidate %s\n' "ed3ecd3d8189e5e2d4fc7dd5f62d826b30e76903" > frontend/preview/multi-radar/BUILD.txt
          test -f frontend/preview/multi-radar/src/multi-radar-display-v9.js
          test -f frontend/preview/multi-radar/v9-multi-radar-hardware-qa.html
          mkdir -p frontend/preview/track-grouping
          cp -a preview-builds/track-grouping/frontend/. frontend/preview/track-grouping/
          printf 'Track grouping PR64 candidate %s\n' "a5f2d3658d738c52b209256751315ec00482d246" > frontend/preview/track-grouping/BUILD.txt
          test -f frontend/preview/track-grouping/src/storm-track-presentation-v1.js
          test -f frontend/preview/track-grouping/tests/run-storm-track-grouping-v1-tests.mjs
          mkdir -p frontend/preview/v9.14.0 frontend/preview/v9.15.0 frontend/preview/v9.15.1 frontend/preview/v9.16
          mkdir -p frontend/preview/native-playback frontend/preview/v9.16.10 frontend/preview/v9.16.11 frontend/preview/v9.16.12 frontend/preview/v9.16.13 frontend/preview/playback-cone-fix
          cp -a preview-builds/playback-cone-fix/frontend/. frontend/preview/playback-cone-fix/
          cp -a preview-builds/v9.14.0/frontend/. frontend/preview/v9.14.0/
          cp -a preview-builds/v9.15.0/frontend/. frontend/preview/v9.15.0/
          cp -a preview-builds/v9.15.1/frontend/. frontend/preview/v9.15.1/
          cp -a preview-builds/v9.16/frontend/. frontend/preview/v9.16/
          cp -a preview-builds/native-playback/frontend/. frontend/preview/native-playback/
          cp -a preview-builds/v9.16.10/frontend/. frontend/preview/v9.16.10/
          cp -a preview-builds/v9.16.11/frontend/. frontend/preview/v9.16.11/
          cp -a preview-builds/v9.16.12/frontend/. frontend/preview/v9.16.12/
          cp -a preview-builds/v9.16.13/frontend/. frontend/preview/v9.16.13/
          mkdir -p frontend/preview/v9.16/research-gympie
          cp -a preview-builds/gympie-observations/. frontend/preview/v9.16/research-gympie/
          test -f preview-builds/gympie-hook-audit/gympie-hook-replay.json
          cp preview-builds/gympie-hook-audit/gympie-hook-replay.json frontend/preview/v9.16/research-gympie/gympie-hook-replay.json
          printf 'V9.14.0 candidate %s\n' "$(git -C preview-builds/v9.14.0 rev-parse HEAD)" > frontend/preview/v9.14.0/BUILD.txt
          printf 'V9.15.0 candidate %s\n' "$(git -C preview-builds/v9.15.0 rev-parse HEAD)" > frontend/preview/v9.15.0/BUILD.txt
          printf 'V9.15.1 candidate %s\n' "$(git -C preview-builds/v9.15.1 rev-parse HEAD)" > frontend/preview/v9.15.1/BUILD.txt
          printf 'V9.16 radar alerts candidate %s\n' "$(git -C preview-builds/v9.16 rev-parse HEAD)" > frontend/preview/v9.16/BUILD.txt
          test -f frontend/preview/v9.14.0/src/live3d-operational-v9.js
          test -f frontend/preview/v9.15.0/src/live3d-operational-v9.js
          test -f frontend/preview/v9.15.1/src/storm-track-label-overlay-v1.js
          test -f frontend/preview/v9.16/historical-gympie-v1.html
          test -f frontend/preview/v9.16/research-gympie/scan_meteorology.json
          test -f frontend/preview/v9.16/research-gympie/gympie-hook-replay.json
          grep -q 'StormTrackerExperimentalAURAHookReplayV1' frontend/preview/v9.16/research-gympie/gympie-hook-replay.json
          test -f frontend/preview/v9.16/research-gympie/observed_scan_previews/8_20251124_070000.pvol.png
          test -f frontend/preview/v9.16/src/severe-storm-alerts-v1.js
          test -f frontend/preview/v9.16/src/severe-storm-alert-overlay-v1.js
          test -f frontend/preview/v9.16/tests/run-startup-radar-default-v1-tests.mjs
          grep -q 'value="66" selected>Brisbane (Mt Stapylton)' frontend/preview/v9.16/live3d-operational-v9.html
          grep -q '9.16-window-menu-v2' frontend/preview/v9.16/index.html
          test -f frontend/preview/v9.16/src/operational-window-choices-v1.js
          grep -q 'Radar + Doppler — All available' frontend/preview/v9.16/src/operational-window-choices-v1.js
          test -f frontend/preview/v9.16/tests/run-operational-window-choices-v1-tests.mjs
          test -f frontend/preview/v9.16/src/doppler-available-window-v1.js
          ! grep -q 'id="showDopplerOverlay"' frontend/preview/v9.16/live3d-operational-v9.html
          grep -q 'id="dualSourceTimes"' frontend/preview/v9.16/live3d-operational-v9.html
          grep -q 'id="dopplerPlaybackTime"' frontend/preview/v9.16/live3d-operational-v9.html
          grep -q 'id="sourceTimeGap"' frontend/preview/v9.16/live3d-operational-v9.html
          ! grep -q 'id="dopplerPlayButton"' frontend/preview/v9.16/live3d-operational-v9.html
          test -f frontend/preview/v9.16/src/independent-doppler-loop-v1.js
          printf 'Playback/cone repair review %s\n' "$(git -C preview-builds/playback-cone-fix rev-parse HEAD)" > frontend/preview/playback-cone-fix/BUILD.txt
          test -f frontend/preview/playback-cone-fix/src/combined-loop-playback-v1.js
          test -f frontend/preview/playback-cone-fix/tests/run-playback-stall-cone-v1-tests.mjs
          grep -Fq 'v8-perf-v9-recovery-v10' frontend/preview/playback-cone-fix/index.html
          printf 'V9.16.13 pan-locked labels and opaque Doppler %s\n' "$(git -C preview-builds/v9.16.13 rev-parse HEAD)" > frontend/preview/v9.16.13/BUILD.txt
          ! grep -q 'id="dopplerOpacity"' frontend/preview/v9.16.13/live3d-operational-v9.html
          grep -Fq 'followCamera();' frontend/preview/v9.16.13/src/context-layers/qld-town-label-layer-v1.js
          grep -Fq 'sameGeographicSettlement' frontend/preview/v9.16.13/src/context-layers/qld-town-label-declutter-v1.js
          grep -Fq 'z-index:var(--stormtracker-geo-label-z)' frontend/preview/v9.16.13/src/operational-dashboard-v9-1.css
          printf 'V9.16.12 foreground place-label preview %s\n' "$(git -C preview-builds/v9.16.12 rev-parse HEAD)" > frontend/preview/v9.16.12/BUILD.txt
          grep -Fq 'qld-place-foreground' frontend/preview/v9.16.12/src/context-layers/qld-town-label-layer-v1.js
          grep -Fq 'qld-place-name' frontend/preview/v9.16.12/src/operational-dashboard-v9-1.css
          grep -Fq 'container: document.getElementById("mapPanel")' frontend/preview/v9.16.12/src/live3d-operational-v9.js
          printf 'V9.16.11 measured Doppler-only preview %s\n' "$(git -C preview-builds/v9.16.11 rev-parse HEAD)" > frontend/preview/v9.16.11/BUILD.txt
          test -f frontend/preview/v9.16.11/src/doppler-layer-transition-v1.js
          grep -Fq 'buildDopplerOnlySchedule(independentDopplerFrames)' frontend/preview/v9.16.11/src/live3d-operational-v9.js
          grep -Fq 'Doppler — All available' frontend/preview/v9.16.11/src/operational-window-choices-v1.js
          printf 'V9.16.10 playback, cone and trail candidate %s\n' "$(git -C preview-builds/v9.16.10 rev-parse HEAD)" > frontend/preview/v9.16.10/BUILD.txt
          test -f frontend/preview/v9.16.10/src/storm-track-trail-visibility-v1.js
          grep -Fq 'setStormTrackTrailVisibility(hybridSource.entities, show)' frontend/preview/v9.16.10/src/live3d-operational-v9.js
          printf 'Native source playback review %s\n' "$(git -C preview-builds/native-playback rev-parse HEAD)" > frontend/preview/native-playback/BUILD.txt
          test -f frontend/preview/native-playback/index.html
          test -f frontend/preview/native-playback/live3d-operational-v9.html
          test -f frontend/preview/native-playback/src/live3d-operational-v9.js
          grep -Fq 'source-native-playback-review-v2' frontend/preview/native-playback/index.html
          grep -Fq 'Native BoM playback review build' frontend/preview/native-playback/live3d-operational-v9.html
          grep -Fq 'dopplerImageryHandover' frontend/preview/native-playback/src/live3d-operational-v9.js
          ! grep -Eq 'createRadarMotionTransition|interpolateRadarFrame\(' frontend/preview/native-playback/src/live3d-operational-v9.js
          git diff --exit-code -- frontend/index.html frontend/live3d-operational-v9.html
          echo "Authorised-origin previews staged. Production root unchanged."

      - name: Construct published site from V9.17.0 SEALED production plus isolated previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published-site
          cp -a sealed-production/v9.17.0/frontend/. published-site/
          printf 'StormTracker V9.17.0 release %s\n' '60d6750be2d335858dac485a5312a55693e40c74' > published-site/BUILD.txt
          mkdir -p published-site/preview
          cp -a frontend/preview/. published-site/preview/
          # Standalone experimental volume study: only the preview HTML is copied.
          # The pinned production release and its site root remain unchanged.
          mkdir -p published-site/previews
          cp preview-builds/volumetric-dbz/frontend/previews/volumetric-v2.html published-site/previews/volumetric-v2.html
          test -s published-site/previews/volumetric-v2.html
          grep -Fq 'ISOLATED VISUAL PROTOTYPE' published-site/previews/volumetric-v2.html
          cmp sealed-production/v9.17.0/frontend/index.html published-site/index.html
          cmp sealed-production/v9.17.0/frontend/live3d-operational-v9.html published-site/live3d-operational-v9.html
          grep -Fq 'sidebar-hardcut-v14' published-site/index.html
          ! grep -Fq 'id="dopplerOpacity"' published-site/live3d-operational-v9.html
          grep -Fq '60d6750be2d335858dac485a5312a55693e40c74' published-site/BUILD.txt
          test -f published-site/preview/v9.16.13/src/context-layers/qld-town-label-layer-v1.js
          grep -Fq '2c3dd61e70cf6d5d7ab313ba310bcb1ad732710e' published-site/preview/v9.16.13/BUILD.txt
          test -f published-site/preview/v9.16.12/src/context-layers/qld-town-label-layer-v1.js
          grep -Fq 'caa8bd7d6e460a5f5bf2b49edb53dae01690f4ad' published-site/preview/v9.16.12/BUILD.txt
          test -f published-site/preview/v9.16.11/src/doppler-layer-transition-v1.js
          test -f published-site/preview/v9.16.10/src/storm-track-trail-visibility-v1.js
          grep -Fq 'f4927fea810833230bce1af65df80ee2e3b59661' published-site/preview/v9.16.10/BUILD.txt
          test -f published-site/preview/volume-dbz/src/volumetric-visual-v2.js
          test -f published-site/preview/volume-dbz/tests/run-volumetric-visual-v2-tests.mjs
          test -f published-site/preview/volume-dbz/previews/volumetric-v2.html
          test -f published-site/preview/multi-radar/src/multi-radar-display-v9.js
          grep -Fq 'ed3ecd3d8189e5e2d4fc7dd5f62d826b30e76903' published-site/preview/multi-radar/BUILD.txt
          test -f published-site/preview/track-grouping/src/storm-track-presentation-v1.js
          grep -Fq "a5f2d3658d738c52b209256751315ec00482d246" published-site/preview/track-grouping/BUILD.txt
          cmp sealed-production/v9.17.0/frontend/index.html published-site/index.html
          echo "Deployment payload: SEALED V9.17.0 production root + original previews"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published-site
      - name: Deploy sealed V9.17.0 root and isolated previews
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify served standalone volumetric V2 preview
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          preview="$(curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors "$base/previews/volumetric-v2.html")"
          grep -Fq 'StormTracker — Inferred Volume V2' <<< "$preview"
          grep -Fq 'SYNTHETIC TEST STORM' <<< "$preview"
          echo "Verified independent volumetric V2 preview; pinned production unchanged."

      - name: Verify publicly served dBZ volumetric preview without touching production
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
