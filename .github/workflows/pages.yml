      - name: Verify V9.18.0 recovery branch and create lightweight release tag via GitHub API
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="66d3da447ef7a4df53e7df49aa1ac06f86cb5afd"
          # The verified rollback branch is maintained separately, and the
          # historical V9.17.0 tag/branch must never be moved.
          restore="$(git ls-remote --heads origin 'refs/heads/restore/v9.18.0' | awk '{print $1}')"
          test "$restore" = "$release_sha"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs"
          opts=(--silent --show-error --location
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28")
          status="$(curl "${opts[@]}" -o /tmp/stormtracker-v9.18-tag.json -w '%{http_code}' "$api/tags/v9.18.0")"
          if [ "$status" = 404 ]; then
            # Creating a Git reference with the REST API avoids git-push's
            # unnecessary workflow-file permission gate for an unchanged
            # already-validated release commit.
            payload="$(printf '{"ref":"refs/tags/v9.18.0","sha":"%s"}' "$release_sha")"
            status="$(curl "${opts[@]}" --request POST --header 'Content-Type: application/json' --data "$payload" -o /tmp/stormtracker-v9.18-tag.json -w '%{http_code}' "$api")"
            if [ "$status" != 201 ]; then
              echo "::warning::Published V9.18.0 is verified and restore/v9.18.0 is pinned, but tag creation returned HTTP $status. A repository maintainer must create the immutable tag in GitHub."
              cat /tmp/stormtracker-v9.18-tag.json
              exit 0
            fi
          elif [ "$status" != 200 ]; then
            echo "::warning::Cannot read existing V9.18.0 tag (HTTP $status); production and recovery branch are still verified."
            exit 0
          fi
          python - <<'PY'
          import json
          d=json.load(open("/tmp/stormtracker-v9.18-tag.json"))
          actual=d.get("object",{}).get("sha")
          expected="66d3da447ef7a4df53e7df49aa1ac06f86cb5afd"
          if actual!=expected:
            raise SystemExit("V9.18.0 release tag points at an unexpected commit: "+str(actual))
          print("SEALED v9.18.0 tag ->",actual)
          PY
          echo "Sealed V9.18.0 public production, immutable tag and restore/v9.18.0; V9.17.0 preserved."

