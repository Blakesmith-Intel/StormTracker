name: Deploy existing StormTracker production Cloudflare relay

# Deploy the ONE existing relay when its source changes, never a second NSW worker.
on:
  push:
    branches: [main]
    paths:
      - "relay/worker.js"
      - "relay/cyclone-live-v1.js"
      - "scripts/cyclone-live-kv.mjs"
      - "relay/wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate browser science, source handling and relay
        run: |
          npm test
          node --check relay/worker.js
      - name: Provision source-current cyclone KV binding
        id: cyclone_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cyclone-live-kv.mjs ensure
      - name: Prepare ephemeral configuration for existing Worker
        run: node scripts/cyclone-live-kv.mjs configure "${{ steps.cyclone_kv.outputs.namespace_id }}"
      - name: Deploy the existing production Worker only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy --config wrangler.cyclone-runtime.json
      - name: Check QLD and Brewarrina Doppler paths
        run: node scripts/probe-brewarrina-wind-source.mjs --require-production-route
