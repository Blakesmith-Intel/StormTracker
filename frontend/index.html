<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    StormTracker
  </title>

  <style>
    * {
      box-sizing:border-box;
    }

    html,
    body {
      width:100%;
      height:100%;
      margin:0;
    }

    body {
      overflow:hidden;
      background:#081116;
      color:#edf5f8;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    #shell {
      width:100%;
      height:100%;
      display:grid;
      grid-template-rows:auto 1fr;
    }

    #modeBar {
      position:relative;
      z-index:20;
      display:flex;
      align-items:center;
      gap:10px;
      min-height:58px;
      padding:8px 12px;
      border-bottom:1px solid #31424d;
      background:#0e1820;
    }

    #brand {
      min-width:145px;
    }

    #brand strong {
      display:block;
      font-size:16px;
      line-height:1.1;
    }

    #brand span {
      display:block;
      margin-top:3px;
      color:#91a3ad;
      font-size:9px;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    #modeButtons {
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    .modeButton,
    #runRegressionButton {
      padding:8px 11px;
      border:1px solid #4a6575;
      border-radius:6px;
      background:#203440;
      color:#f2f7f9;
      font:inherit;
      font-size:11px;
      cursor:pointer;
    }

    .modeButton[aria-pressed="true"] {
      border-color:#92d3ef;
      background:#28546a;
      box-shadow:inset 0 0 0 1px rgba(146,211,239,.25);
    }

    #modeBadge {
      margin-left:auto;
      padding:7px 10px;
      border:1px solid #345b48;
      border-radius:999px;
      background:#143025;
      color:#9be0b7;
      font-size:10px;
      font-weight:800;
      letter-spacing:.06em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    body.validation #modeBar {
      border-bottom-color:#9a6b30;
      background:#211b12;
    }

    body.validation #modeBadge {
      border-color:#a06f31;
      background:#3a2812;
      color:#ffd28a;
    }

    #content {
      position:relative;
      min-height:0;
      overflow:hidden;
    }

    .productFrame {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#081116;
    }

    .productFrame[hidden] {
      display:none;
    }

    #validationNotice {
      position:absolute;
      z-index:12;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      max-width:min(780px,calc(100% - 28px));
      padding:8px 12px;
      border:1px solid rgba(255,196,96,.72);
      border-radius:8px;
      background:rgba(58,40,18,.95);
      color:#ffe0a6;
      font-size:10px;
      line-height:1.35;
      text-align:center;
      pointer-events:none;
    }

    #regressionStrip {
      display:none;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-top:1px solid #6e4b22;
      background:#19140d;
      font-size:10px;
      line-height:1.35;
    }

    body.validation #shell {
      grid-template-rows:auto auto 1fr;
    }

    body.validation #regressionStrip {
      display:flex;
    }

    #regressionStatus {
      font-weight:800;
      white-space:nowrap;
    }

    #regressionStatus.pass {
      color:#9be0b7;
    }

    #regressionStatus.fail {
      color:#ff9e91;
    }

    #regressionSummary {
      min-width:0;
      flex:1;
      color:#b7c4cb;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    #runRegressionButton {
      border-color:#87612e;
      background:#34240f;
      color:#ffd79a;
      white-space:nowrap;
    }

    @media (max-width:820px) {
      #modeBar {
        align-items:flex-start;
        flex-wrap:wrap;
      }

      #brand {
        min-width:120px;
      }

      #modeBadge {
        order:4;
        width:100%;
        margin-left:0;
        text-align:center;
      }

      body.validation #regressionStrip {
        flex-wrap:wrap;
      }

      #regressionSummary {
        width:100%;
        order:3;
        white-space:normal;
      }
    }
  </style>
</head>

<body>
<div id="shell">
  <header id="modeBar">
    <div id="brand">
      <strong>StormTracker</strong>
      <span>Browser-native severe-weather analysis</span>
    </div>

    <div id="modeButtons">
      <button
        id="liveModeButton"
        class="modeButton"
        type="button"
        aria-pressed="true"
      >
        Live weather
      </button>

      <button
        id="validationModeButton"
        class="modeButton"
        type="button"
        aria-pressed="false"
      >
        Test / Historical Validation
      </button>
    </div>

    <div id="modeBadge">
      LIVE WEATHER
    </div>
  </header>

  <div id="regressionStrip">
    <button
      id="runRegressionButton"
      type="button"
    >
      Run Christmas 2023 regression
    </button>

    <strong id="regressionStatus">
      not run
    </strong>

    <div id="regressionSummary">
      The historical validation mode runs against the production tracking and assessment modules.
    </div>
  </div>

  <main id="content">
    <iframe
      id="liveFrame"
      class="productFrame"
      title="StormTracker live weather"
      src="./live3d-operational-v9.html"
    ></iframe>

    <iframe
      id="validationFrame"
      class="productFrame"
      title="StormTracker historical validation"
      data-src="./christmas-2023-derecho-test-v1.html"
      hidden
    ></iframe>

    <div
      id="validationNotice"
      hidden
    >
      TEST / HISTORICAL VALIDATION — SIMULATED EVENT-CONSTRAINED INPUTS.
      THIS VIEW IS NOT LIVE WEATHER AND IS NOT AN ARCHIVED RADAR REPLAY.
    </div>
  </main>
</div>

<script
  type="module"
  src="./src/stormtracker-product-mode-v1.js"
></script>
</body>
</html>
