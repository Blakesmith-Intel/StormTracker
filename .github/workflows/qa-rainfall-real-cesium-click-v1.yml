name: QA real Cesium rainfall marker click
on:
  push:
    branches: [fix/rainfall-marker-interaction-v10-20261019]
    paths:
      - scripts/test-rainfall-real-cesium-click-v1.mjs
      - .github/workflows/qa-rainfall-real-cesium-click-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - name: Click mapped rainfall gauge and verify panel in real Cesium
        run: node scripts/test-rainfall-real-cesium-click-v1.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rainfall-real-cesium-click-qa
          path: /tmp/stormtracker-interactive-rainfall-qa.png
          if-no-files-found: warn
