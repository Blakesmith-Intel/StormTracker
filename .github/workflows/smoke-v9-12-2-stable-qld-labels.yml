name: Smoke V9.12.2 stable Queensland town labels

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v9.12.2-stable-vector-town-labels
    paths:
      - "frontend/src/context-layers/stable-queensland-place-labels-v1.js"
      - "scripts/smoke-stable-qld-labels.mjs"
      - ".github/workflows/smoke-v9-12-2-stable-qld-labels.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate official Queensland places CORS and Birdsville coordinates
        run: node scripts/smoke-stable-qld-labels.mjs
