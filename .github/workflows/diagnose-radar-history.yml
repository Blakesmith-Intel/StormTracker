name: Diagnose radar history source

on:
  push:
    branches: ["feature/three-hour-radar-history"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe three-hour BoM WMTS history via production relay
        run: |
          node <<'NODE'
          const base = "https://stormtracker-bom-relay.stormtracker-bom-relay.workers.dev/wmts";
          const now = Date.now();
          const floor5 = Math.floor(now / 300000) * 300000;
          const newestCandidate = floor5 - 10 * 60000;
          const rows = [];
          for (let i = 0; i < 43; i++) {
            const epoch = newestCandidate - i * 5 * 60000;
            const observedUtc = new Date(epoch).toISOString().replace(".000Z","Z");
            const params = new URLSearchParams({
              SERVICE:"WMTS", REQUEST:"GetTile", VERSION:"1.0.0",
              LAYER:"atm_surf_air_precip_reflectivity_dbz",
              STYLE:"default", FORMAT:"image/png",
              TILEMATRIXSET:"GoogleMapsCompatible_BoM",
              TILEMATRIX:"8", TILEROW:"15", TILECOL:"34",
              time:observedUtc
            });
            try {
              const response = await fetch(base + "?" + params.toString(), {
                headers:{Accept:"image/png"}
              });
              const bytes = new Uint8Array(await response.arrayBuffer());
              const png = bytes.length >= 8 &&
                bytes[0]===137 && bytes[1]===80 && bytes[2]===78 && bytes[3]===71;
              rows.push({observedUtc, ageMinutes:i*5+10, status:response.status, png, bytes:bytes.length});
            } catch (error) {
              rows.push({observedUtc, ageMinutes:i*5+10, status:"ERR", png:false, error:String(error)});
            }
          }
          console.log(JSON.stringify(rows,null,2));
          const good = rows.filter(x=>x.status===200 && x.png);
          console.log("SUMMARY", JSON.stringify({
            readableCount:good.length,
            newest:good[0]?.observedUtc ?? null,
            oldest:good.at(-1)?.observedUtc ?? null,
            oldestAgeMinutes:good.at(-1)?.ageMinutes ?? null,
            readableAgesMinutes:good.map(x=>x.ageMinutes)
          }));
          NODE
