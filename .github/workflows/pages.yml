      - name: Verify published V9.16 research preview and current sealed production
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          PRODUCTION_MARKER="sidebar-hardcut-v14" EXPECTED_PREVIEW_SHA="$(git -C preview-builds/v9.16 rev-parse HEAD)" node scripts/smoke-v9-16-preview.mjs

