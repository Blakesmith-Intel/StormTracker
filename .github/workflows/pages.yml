name: Deploy static StormTracker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write # Required only to create the immutable release tag after verified Pages deployment
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Preflight diagnostic tests before the expensive 20+ historical preview checkouts.
      - name: Checkout pinned diagnostic preview source
        uses: actions/checkout@v4
        with:
          ref: 09e5a172eda97a913658ff540804394f9cd82a07
          path: preview-builds/hover-gpu-guard
          persist-credentials: false
      - name: Validate complete diagnostic preview regressions first
        run: |
          set -euo pipefail
          (cd preview-builds/hover-gpu-guard && npm test)
          node --check preview-builds/hover-gpu-guard/relay/worker.js
          test "$(git -C preview-builds/hover-gpu-guard rev-parse HEAD)" = "09e5a172eda97a913658ff540804394f9cd82a07"
      - name: Validate current development source
        run: npm test
      - name: Checkout sealed V9.18.0 pixel-tracking production source
        uses: actions/checkout@v4
        with:
          # Exact, green-reviewed release merge commit. Never deploy unpinned main.
          ref: 66d3da447ef7a4df53e7df49aa1ac06f86cb5afd
          path: sealed-production/v9.18.0
          persist-credentials: false
      - name: Verify and test V9.18.0 release source
        run: |
          set -euo pipefail
          (cd sealed-production/v9.18.0 && npm test)
          node --check sealed-production/v9.18.0/relay/worker.js
          test "$(git -C sealed-production/v9.18.0 rev-parse HEAD)" = "66d3da447ef7a4df53e7df49aa1ac06f86cb5afd"
          grep -Fq 'sidebar-hardcut-v14' sealed-production/v9.18.0/frontend/index.html
          ! grep -Fq 'id="dopplerOpacity"' sealed-production/v9.18.0/frontend/live3d-operational-v9.html
          ! grep -Fq 'id="operationalDoppler"' sealed-production/v9.18.0/frontend/live3d-operational-v9.html
          grep -Fq 'pixeltrack-prod-r1' sealed-production/v9.18.0/frontend/index.html
          grep -Fq 'pixeltrack-prod-r1' sealed-production/v9.18.0/frontend/live3d-operational-v9.html
          grep -Fq 'minPixels: 16' sealed-production/v9.18.0/frontend/src/config.js
          ! grep -Fq 'minAreaKm2' sealed-production/v9.18.0/frontend/src/config.js
          test -f sealed-production/v9.18.0/frontend/src/storm-track-presentation-v1.js
          test -f sealed-production/v9.18.0/frontend/src/multi-radar-display-v9.js
          test -f sealed-production/v9.18.0/frontend/src/volumetric-visual-v2.js
          test -f sealed-production/v9.18.0/frontend/src/border-radar-sites-v1.js
          grep -Fq 'source_low_level_dbzh: inputDbz' sealed-production/v9.18.0/frontend/src/measured-track-volume-v1.js
          grep -Fq 'point.source_low_level_dbzh ?? point.dbzh' sealed-production/v9.18.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'btn.appendChild(dishGlyph())' sealed-production/v9.18.0/frontend/src/context-layers/radar-site-name-overlay-v1.js
          grep -Fq 'dopplerIntegrated:false' sealed-production/v9.18.0/frontend/src/border-radar-sites-v1.js
          grep -Fq 'id="reflectivityLegend"' sealed-production/v9.18.0/frontend/live3d-operational-v9.html
          grep -Fq 'id="blobVolume" checked' sealed-production/v9.18.0/frontend/live3d-operational-v9.html
          grep -Fq 'width:23px;height:23px' sealed-production/v9.18.0/frontend/src/operational-dashboard-v9-1.css
          test -f sealed-production/v9.18.0/docs/HANDOVER_V9.18.0.md
          test -f sealed-production/v9.18.0/docs/USER_GUIDE_V9.18.0.md
          test -f sealed-production/v9.18.0/docs/RELEASE_NOTES_V9.18.0.md
          test -f sealed-production/v9.18.0/scripts/build-nsw-radar-places.py
          grep -Fq 'NSW_RADAR_PLACE_CATALOGUE_SCHEMA' sealed-production/v9.18.0/frontend/src/context-layers/nsw-radar-place-catalogue-v1.js
          grep -Fq 'ga_ls8cls9c_gm_cyear_3' sealed-production/v9.18.0/frontend/src/context-layers/basemap-manager-v1.js
          grep -Fq 'Satellite · DEA Regional + Local Detail' sealed-production/v9.18.0/frontend/live3d-operational-v9.html
          grep -Fq 'v9.18.0' sealed-production/v9.18.0/frontend/index.html
          grep -Fq 'radar-dish-reflector' sealed-production/v9.18.0/frontend/src/context-layers/radar-site-name-overlay-v1.js
          grep -Fq 'id="multiRadarSelectButton"' sealed-production/v9.18.0/frontend/live3d-operational-v9.html
          grep -Fq 'id="multiRadarStatus"' sealed-production/v9.18.0/frontend/live3d-operational-v9.html
          grep -Fq 'role="alert" aria-live="assertive" hidden' sealed-production/v9.18.0/frontend/live3d-operational-v9.html
          grep -Fq 'maximum of three additional radars' sealed-production/v9.18.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'MAX_DISPLAY_RADAR_SITES = 4' sealed-production/v9.18.0/frontend/src/multi-radar-display-v9.js
          grep -Fq 'multiradar-v15' sealed-production/v9.18.0/frontend/index.html
          test -f sealed-production/v9.18.0/frontend/src/storm-track-trail-visibility-v1.js
          grep -Fq 'const trackVolumesRequested = true' sealed-production/v9.18.0/frontend/src/live3d-operational-v9.js

      - name: Build official NSW place-name snapshot for release (same-origin, browser-only)
        shell: bash
        run: |
          set -euo pipefail
          python sealed-production/v9.18.0/scripts/build-nsw-radar-places.py \
            --output sealed-production/v9.18.0/frontend/data/nsw-radar-places-v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("sealed-production/v9.18.0/frontend/data/nsw-radar-places-v1.json")
          d=json.loads(path.read_text(encoding="utf-8"))
          assert d.get("schema")=="StormTrackerNSWRadarPlacesV1"
          assert len(d.get("places",[]))>=500
          assert path.stat().st_size<300000
          names={p["name"].casefold() for p in d["places"]}
          assert {"brewarrina","moree","tweed heads"}<=names
          assert all(-38<=p["latitude"]<=-27 and 140.5<=p["longitude"]<=159.5 for p in d["places"])
          print("Sealed NSW radar context asset ready:",len(d["places"]),"geocoded places",path.stat().st_size,"bytes")
          PY
          test -s sealed-production/v9.18.0/frontend/data/nsw-radar-places-v1.json

      # PR #73, reviewed and tested source. Never use an unpinned branch
      # nor replace the immutable production root for this visual preview.
      - name: Checkout isolated Doppler/track and NSW handover repair preview
        uses: actions/checkout@v4
        with:
          ref: 76933117aac4e6cdf5333111f0a0b5f2f6463de2
          path: preview-builds/doppler-overlay-repair
          persist-credentials: false

      # PR #74 combines visually approved PR73 fixes with official NSW tiles.
      # Pin the exact reviewed source; never deploy the branch HEAD implicitly.
      - name: Checkout isolated QLD + NSW satellite preview
        uses: actions/checkout@v4
        with:
          ref: 94a6ccd40f518085646e413537819a8786ce0901
          path: preview-builds/nsw-satellite
          persist-credentials: false

      # PR76, pinned to tested source: national DEA GeoMAD at regional zoom,
      # automatic close-up official detail, and shared QLD/NSW place names.
      - name: Checkout isolated DEA regional + local detail preview
        uses: actions/checkout@v4
        with:
          ref: 36ff1c7798b9f62874ee27651a26196961ba7c6c
          path: preview-builds/dea-regional
          persist-credentials: false

      # Draft PR77 preserves the approved DEA+QLD/NSW frontend and bundles
      # official NSW town/locality point names from a same-origin static JSON.
      - name: Checkout isolated NSW radar-range foreground label preview
        uses: actions/checkout@v4
        with:
          ref: df5add5fb12d87244bf36213e76b4246f5f67ecc
          path: preview-builds/nsw-radar-labels
          persist-credentials: false

      # Preview subpaths share the trusted production github.io Origin,
      # so existing Cloudflare relay CORS policies work unchanged.
      - name: Checkout independent BoM dBZ cloud-volume preview
        uses: actions/checkout@v4
        with:
          # Draft PR #71, pinned; never replace the protected production root.
          ref: 07b8baafd0d1bf3bccd16f6fbb6667e0a0261fbd
          path: preview-builds/volumetric-dbz
          persist-credentials: false
      - name: Checkout V9.14 candidate
        uses: actions/checkout@v4
        with:
          ref: feature/v9.14.0-source-freshness
          path: preview-builds/v9.14.0
          persist-credentials: false
      - name: Checkout V9.15 candidate
        uses: actions/checkout@v4
        with:
          ref: feature/v9.15.0-qfd-technical-rescue
          path: preview-builds/v9.15.0
          persist-credentials: false
      - name: Checkout V9.15.1 storm-label preview
        uses: actions/checkout@v4
        with:
          ref: feature/v9.15.1-storm-label-foreground
          path: preview-builds/v9.15.1
          persist-credentials: false
      - name: Checkout V9.16 severe radar alerts candidate
        uses: actions/checkout@v4
        with:
          ref: feature/severe-storm-radar-alerts-v1
          path: preview-builds/v9.16
          persist-credentials: false
      - name: Checkout V9.16.13 foreground label and fixed Doppler candidate
        uses: actions/checkout@v4
        with:
          ref: 2c3dd61e70cf6d5d7ab313ba310bcb1ad732710e
          path: preview-builds/v9.16.13
          persist-credentials: false
      - name: Checkout V9.16.12 foreground town label candidate
        uses: actions/checkout@v4
        with:
          ref: caa8bd7d6e460a5f5bf2b49edb53dae01690f4ad
          path: preview-builds/v9.16.12
          persist-credentials: false
      - name: Checkout V9.16.11 native Doppler-only candidate
        uses: actions/checkout@v4
        with:
          ref: f7c12b0a7d2942446dc111428b4b7700cee11882
          path: preview-builds/v9.16.11
          persist-credentials: false
      - name: Checkout V9.16.10 playback/cone/trail candidate
        uses: actions/checkout@v4
        with:
          ref: f4927fea810833230bce1af65df80ee2e3b59661
          path: preview-builds/v9.16.10
          persist-credentials: false
      - name: Checkout validated native BoM playback review
        uses: actions/checkout@v4
        with:
          # Pin to the exact 88-suite-tested source; later feature pushes cannot
          # silently change this published review build.
          ref: 651b9aaf6780f4efb6a6fada7462483ca20c4ed1
          path: preview-builds/native-playback
          persist-credentials: false
      - name: Checkout isolated playback/cone repair review
        uses: actions/checkout@v4
        with:
          # Exact, immutable PR #57 candidate. Production root stays protected.
          ref: 202c212cd8dc1558b4b8788d01fa71001bc18fdc
          path: preview-builds/playback-cone-fix
          persist-credentials: false
      # Pinned PR #64: isolated pixel-based >=40 dBZ storm grouping/decluttering.
      # Never alter the sealed production checkout or production site root.
      - name: Checkout pixel-based storm grouping candidate
        uses: actions/checkout@v4
        with:
          ref: a5f2d3658d738c52b209256751315ec00482d246
          path: preview-builds/track-grouping
          persist-credentials: false
      # Pinned PR #63: multi-radar site selection visual preview, not production.
      - name: Checkout V9.18.0 multiple radar display candidate
        uses: actions/checkout@v4
        with:
          ref: ed3ecd3d8189e5e2d4fc7dd5f62d826b30e76903
          path: preview-builds/multi-radar
          persist-credentials: false
      - name: Download authentic Gympie 2025 measured radar research previews
        uses: actions/download-artifact@v4
        with:
          repository: Blakesmith-Intel/StormTracker
          run-id: 37816421560
          github-token: ${{ github.token }}
          name: AURA-Gympie-2025-measured-reflectivity-doppler
          path: preview-builds/gympie-observations
      - name: Download audited real-event two-scan hook candidate report
        uses: actions/download-artifact@v4
        with:
          repository: Blakesmith-Intel/StormTracker
          run-id: 37817144956
          github-token: ${{ github.token }}
          name: AURA-Gympie-2025-experimental-hook-replay
          path: preview-builds/gympie-hook-audit
      - name: Validate BoM dBZ volume preview independently
        shell: bash
        run: |
          set -euo pipefail
          test -f preview-builds/volumetric-dbz/package.json # immutable historical preview already regression-tested at pin
          test "$(git -C preview-builds/volumetric-dbz rev-parse HEAD)" = "07b8baafd0d1bf3bccd16f6fbb6667e0a0261fbd"
          test -f preview-builds/volumetric-dbz/frontend/src/volumetric-visual-v2.js
          test -f preview-builds/volumetric-dbz/frontend/tests/run-volumetric-visual-v2-tests.mjs
          test -f preview-builds/volumetric-dbz/frontend/tests/run-nsw-border-radar-site-labels-v1-tests.mjs
          grep -Fq 'id="blobVolume" checked' preview-builds/volumetric-dbz/frontend/live3d-operational-v9.html
          grep -Fq 'id="reflectivityLegend"' preview-builds/volumetric-dbz/frontend/live3d-operational-v9.html
          ! grep -Eqi 'rainRateLegend|estimated mm/h' preview-builds/volumetric-dbz/frontend/live3d-operational-v9.html

      - name: Validate all four candidates independently
        run: |
          test -f preview-builds/v9.14.0/package.json # immutable historical preview already regression-tested at pin
          test -f preview-builds/v9.15.0/package.json # immutable historical preview already regression-tested at pin
          test -f preview-builds/v9.15.1/package.json # immutable historical preview already regression-tested at pin
          test -f preview-builds/v9.16/package.json # immutable historical preview already regression-tested at pin

      - name: Validate V9.16.13 candidate independently
        run: |
          test -f preview-builds/v9.16.13/package.json # immutable historical preview already regression-tested at pin
          test "$(git -C preview-builds/v9.16.13 rev-parse HEAD)" = "2c3dd61e70cf6d5d7ab313ba310bcb1ad732710e"
          node --check preview-builds/v9.16.13/relay/worker.js
      - name: Validate V9.16.12 candidate independently
        run: |
          test -f preview-builds/v9.16.12/package.json # immutable historical preview already regression-tested at pin
          node --check preview-builds/v9.16.12/relay/worker.js
          test "$(git -C preview-builds/v9.16.12 rev-parse HEAD)" = "caa8bd7d6e460a5f5bf2b49edb53dae01690f4ad"
      - name: Validate V9.16.11 candidate independently
        run: |
          test -f preview-builds/v9.16.11/package.json # immutable historical preview already regression-tested at pin
          test "$(git -C preview-builds/v9.16.11 rev-parse HEAD)" = "f7c12b0a7d2942446dc111428b4b7700cee11882"
      - name: Validate V9.16.10 candidate independently
        run: |
          test -f preview-builds/v9.16.10/package.json # immutable historical preview already regression-tested at pin
          test "$(git -C preview-builds/v9.16.10 rev-parse HEAD)" = "f4927fea810833230bce1af65df80ee2e3b59661"
      - name: Validate native BoM playback preview independently
        run: |
          test -f preview-builds/native-playback/package.json # immutable historical preview already regression-tested at pin
          node --check preview-builds/native-playback/relay/worker.js
          test "$(git -C preview-builds/native-playback rev-parse HEAD)" = "651b9aaf6780f4efb6a6fada7462483ca20c4ed1"

      - name: Validate playback/cone repair in isolation
        run: |
          test -f preview-builds/playback-cone-fix/package.json # immutable historical preview already regression-tested at pin
          test "$(git -C preview-builds/playback-cone-fix rev-parse HEAD)" = "202c212cd8dc1558b4b8788d01fa71001bc18fdc"

      - name: Validate pixel-based storm grouping preview independently
        shell: bash
        run: |
          set -euo pipefail
          test -f preview-builds/track-grouping/package.json # immutable historical preview already regression-tested at pin
          node --check preview-builds/track-grouping/relay/worker.js
          test "$(git -C preview-builds/track-grouping rev-parse HEAD)" = "a5f2d3658d738c52b209256751315ec00482d246"
          grep -Fq 'minPixels: 16' preview-builds/track-grouping/frontend/src/config.js
          ! grep -Fq 'minAreaKm2' preview-builds/track-grouping/frontend/src/config.js
          test -f preview-builds/track-grouping/frontend/src/storm-track-presentation-v1.js

      - name: Validate multi-radar preview independently
        shell: bash
        run: |
          set -euo pipefail
          test -f preview-builds/multi-radar/package.json # immutable historical preview already regression-tested at pin
          node --check preview-builds/multi-radar/relay/worker.js
          test "$(git -C preview-builds/multi-radar rev-parse HEAD)" = "ed3ecd3d8189e5e2d4fc7dd5f62d826b30e76903"
          test -f preview-builds/multi-radar/frontend/src/multi-radar-display-v9.js
          grep -Fq 'id="multiRadarSelectButton"' preview-builds/multi-radar/frontend/live3d-operational-v9.html
          grep -Fq 'MAX_DISPLAY_RADAR_SITES = 4' preview-builds/multi-radar/frontend/src/multi-radar-display-v9.js

      - name: Stage isolated live previews without changing production
        shell: bash
        run: |
          set -euo pipefail
          # NSW place names are fetched server-to-server at BUILD TIME because
          # the official NSW ArcGIS API lacks browser CORS. At runtime this is
          # a lightweight same-origin static JSON; no relay or hosting change.
          test -f preview-builds/nsw-radar-labels/package.json # immutable historical preview already regression-tested at pin
          test "$(git -C preview-builds/nsw-radar-labels rev-parse HEAD)" = "df5add5fb12d87244bf36213e76b4246f5f67ecc"
          grep -Fq 'nsw-radar-places-v1.json' preview-builds/nsw-radar-labels/frontend/src/context-layers/nsw-radar-place-catalogue-v1.js
          mkdir -p frontend/preview/nsw-radar-labels
          cp -a preview-builds/nsw-radar-labels/frontend/. frontend/preview/nsw-radar-labels/
          python preview-builds/nsw-radar-labels/scripts/build-nsw-radar-places.py --output frontend/preview/nsw-radar-labels/data/nsw-radar-places-v1.json
          python - <<'PY'
          import json
          doc=json.load(open("frontend/preview/nsw-radar-labels/data/nsw-radar-places-v1.json"))
          assert doc["schema"]=="StormTrackerNSWRadarPlacesV1"
          assert len(doc["places"])>=500
          names={p["name"].lower() for p in doc["places"]}
          assert {"moree","brewarrina","tweed heads"}<=names
          print("NSW radar range official same-origin snapshot validated:",len(doc["places"]))
          PY
          printf 'PR77 same-origin NSW radar-range place names %s\n' 'df5add5fb12d87244bf36213e76b4246f5f67ecc' > frontend/preview/nsw-radar-labels/BUILD.txt
          # Review-only automated cross-zoom satellite basemap; never
          # replace the sealed production root without explicit approval.
          test -f preview-builds/dea-regional/package.json # immutable historical preview already regression-tested at pin
          test "$(git -C preview-builds/dea-regional rev-parse HEAD)" = "36ff1c7798b9f62874ee27651a26196961ba7c6c"
          grep -Fq 'ga_ls8cls9c_gm_cyear_3' preview-builds/dea-regional/frontend/src/context-layers/basemap-manager-v1.js
          grep -Fq 'chooseDetailForScale' preview-builds/dea-regional/frontend/src/context-layers/basemap-manager-v1.js
          grep -Fq 'fetchNswTowns' preview-builds/dea-regional/frontend/src/context-layers/qld-town-label-layer-v1.js
          grep -Fq 'Satellite · DEA Regional + Local Detail' preview-builds/dea-regional/frontend/live3d-operational-v9.html
          mkdir -p frontend/preview/dea-regional
          cp -a preview-builds/dea-regional/frontend/. frontend/preview/dea-regional/
          printf 'PR76 national DEA GeoMAD 2025 regional + NSW/QLD zoom detail commit %s\n' '36ff1c7798b9f62874ee27651a26196961ba7c6c' > frontend/preview/dea-regional/BUILD.txt
          # QLD + NSW satellite preview extends the proven PR73 build.
          test -f preview-builds/nsw-satellite/package.json # immutable historical preview already regression-tested at pin
          test "$(git -C preview-builds/nsw-satellite rev-parse HEAD)" = "94a6ccd40f518085646e413537819a8786ce0901"
          grep -Fq 'NSW_IMAGERY_BASEMAP' preview-builds/nsw-satellite/frontend/src/context-layers/basemap-manager-v1.js
          grep -Fq 'Satellite · QLD + NSW' preview-builds/nsw-satellite/frontend/live3d-operational-v9.html
          grep -Fq 'clearReflectivityForDoppler()' preview-builds/nsw-satellite/frontend/src/live3d-operational-v9.js
          mkdir -p frontend/preview/nsw-satellite
          cp -a preview-builds/nsw-satellite/frontend/. frontend/preview/nsw-satellite/
          printf 'PR74 QLD and NSW satellite imagery + PR73 bug fixes %s\n' '94a6ccd40f518085646e413537819a8786ce0901' > frontend/preview/nsw-satellite/BUILD.txt
          # All 22 stations and QLD/NSW handovers; no root app changes.
          test -f preview-builds/doppler-overlay-repair/package.json # immutable historical preview already regression-tested at pin
          test "$(git -C preview-builds/doppler-overlay-repair rev-parse HEAD)" = "76933117aac4e6cdf5333111f0a0b5f2f6463de2"
          test -f preview-builds/doppler-overlay-repair/frontend/src/reflectivity-overlay-mode-v1.js
          grep -Fq 'clearReflectivityForDoppler();' preview-builds/doppler-overlay-repair/frontend/src/live3d-operational-v9.js
          grep -Fq 'createRadarImageryHandover' preview-builds/doppler-overlay-repair/frontend/src/multi-radar-display-v9.js
          grep -Fq 'radar-dish-reflector' preview-builds/doppler-overlay-repair/frontend/src/context-layers/radar-site-name-overlay-v1.js
          mkdir -p frontend/preview/doppler-overlay-repair
          cp -a preview-builds/doppler-overlay-repair/frontend/. frontend/preview/doppler-overlay-repair/
          printf 'Isolated PR73 Doppler cleanup, NSW/QLD radar handover and icon visibility commit %s\n' '76933117aac4e6cdf5333111f0a0b5f2f6463de2' > frontend/preview/doppler-overlay-repair/BUILD.txt
          test -s frontend/preview/doppler-overlay-repair/index.html
          mkdir -p frontend/preview/volume-dbz
          cp -a preview-builds/volumetric-dbz/frontend/. frontend/preview/volume-dbz/
          printf 'BoM dBZ volumetric V2 preview candidate %s\n' '07b8baafd0d1bf3bccd16f6fbb6667e0a0261fbd' > frontend/preview/volume-dbz/BUILD.txt
          test -f frontend/preview/volume-dbz/src/volumetric-visual-v2.js
          mkdir -p frontend/preview/multi-radar
          cp -a preview-builds/multi-radar/frontend/. frontend/preview/multi-radar/
