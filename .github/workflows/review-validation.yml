name: Validate StormTracker review changes

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate JavaScript and run all frontend regression suites
        run: npm test
      - name: Validate relay JavaScript without running external services
        run: node --check relay/worker.js
      - name: Checkout exact accepted QA source for package audit
        uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
          persist-credentials: false
      - name: Checkout exact sealed production source for package audit
        uses: actions/checkout@v4
        with:
          ref: 66d3da447ef7a4df53e7df49aa1ac06f86cb5afd
          path: checked/production-v9.18.0
          persist-credentials: false
      - name: Dry-run the identical final Pages package without deploying
        run: |
          bash scripts/build-current-site.sh
          test -f _site/BUILD.txt
          test -f _site/preview/radar-history-fix/BUILD.txt
          test "$(find _site/preview -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
