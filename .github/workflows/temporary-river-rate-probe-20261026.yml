name: TEMP exact-gauge BoM history diagnostic 20261026
on:
  push:
    branches: [fix/river-all-gauges-history-rate-20261026]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect live official station history and bulletin values
        run: |
          node --input-type=module <<'NODE'
          const stations=[["Laidley Showground Weir","IDQ65389","540158"],
            ["Coulson Crossing","IDQ65388","540510"],
            ["Sandy Creek Rd","IDQ65389","540386"]];
          for (const [name,product,station] of stations){
            const url="https://stormtracker-bom-relay.stormtracker-bom-relay.workers.dev/river-recent-history?"+
              new URLSearchParams({product,station});
            try {
              const r=await fetch(url,{signal:AbortSignal.timeout(22000),headers:{
                Origin:"https://blakesmith-intel.github.io",Accept:"application/json"}});
              const body=await r.text();let data={};try{data=JSON.parse(body)}catch{}
              const samples=data.samples??[];const latest=samples.at(-1);
              const older=latest?[...samples].reverse().find(x=>latest.time-x.time>=1800000 &&
                latest.time-x.time<=7200000):null;
              console.log(JSON.stringify({name,station,status:r.status,error:data.code,available:data.availability,
                length:samples.length,first:samples[0],latest,older,
                hoursSinceLatest:latest?((Date.now()-latest.time)/3600000).toFixed(2):null,
                measuredRate:older?(latest.height-older.height)/((latest.time-older.time)/3600000):null,
                tail:samples.slice(-22),start:body.slice(0,120)}));
            }catch(error){console.log(JSON.stringify({name,error:String(error)}))}
          }
          const url="https://stormtracker-bom-relay.stormtracker-bom-relay.workers.dev/river-height-bulletins?force=1";
          try{
            const r=await fetch(url,{signal:AbortSignal.timeout(25000)});
            const data=await r.json();
            const str=JSON.stringify(data);
            const matches=str.match(/.{0,90}(540158|540510|540386).{0,230}/g)??[];
            console.log(JSON.stringify({source:"bulletin",status:r.status,partial:data.partial,
              matches:matches.slice(0,15)}));
          }catch(e){console.log("bulletin request",String(e))}
          NODE
