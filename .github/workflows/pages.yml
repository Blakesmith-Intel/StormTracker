          grep -Fq 'ACCEPTED MAINTENANCE RELEASE V10.2.5' scripts/apply-ftp-aep-release-v10.py
          current_restore="$(git ls-remote origin "refs/heads/$restore" | cut -f1)"
          if [ -n "$current_restore" ]; then
            # V10.2.5 was frozen previously: later approved maintenance must
            # never repoint its immutable recovery branch or annotated tag.
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$current_restore"
            echo "Preserved frozen $tag at $current_restore; current maintenance source $release_sha deployed without resealing old version."
            exit 0
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$restore" -f sha="$release_sha" >/dev/null
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
