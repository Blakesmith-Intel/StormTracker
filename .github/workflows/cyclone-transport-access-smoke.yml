name: One-shot BoM cyclone product transport verification

on:
  pull_request:
    paths:
      - 'scripts/probe-cyclone-transport.py'
      - '.github/workflows/cyclone-transport-access-smoke.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Verify original archived GML decode and live-warning FTP directory
        run: python3 scripts/probe-cyclone-transport.py
