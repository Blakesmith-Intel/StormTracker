name: TEMP verified gauge-source investigation 20261026
on:
  push:
    branches: [fix/retire-unverified-stale-flood-gauges-20261026]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live official station history and river bulletin by exact id
        run: |
          node --input-type=module <<'NODE'
          const base="https://stormtracker-bom-relay.stormtracker-bom-relay.workers.dev/";
          for(const [name,product,station] of [
            ["Nerada North Johnstone River","IDQ65394","032165"],
            ["Sandy Creek Road","IDQ65389","540386"],
            ["Laidley Showground Weir","IDQ65389","540158"]]){
            const url=base+"river-recent-history?"+new URLSearchParams({product,station});
            try{
              const r=await fetch(url,{signal:AbortSignal.timeout(20000),headers:{
                Origin:"https://blakesmith-intel.github.io",Accept:"application/json"}});
              const d=await r.json();
              console.log(JSON.stringify({name,station,status:r.status,availability:d.availability,code:d.code,
                count:d.samples?.length,first:d.samples?.[0],last:d.samples?.at(-1),tail:d.samples?.slice(-12)}));
            }catch(e){console.log(JSON.stringify({name,station,error:String(e)}))}
          }
          try{
            const r=await fetch(base+"river-height-bulletins?force=1",{signal:AbortSignal.timeout(25000)});
            const d=await r.json(),all=d.observations??d.stations??d.bulletins??[];
            console.log(JSON.stringify({source:"bulletin",status:r.status,partial:d.partial,
              topLevel:Object.keys(d),objects:all.length,
              stations:all.filter?.(x=>["032165","540386","540158"].includes(String(x.stationId))) }));
          }catch(e){console.log(JSON.stringify({source:"bulletin",error:String(e)}))}
          NODE
