name: Publish BoM FTP observation manifest
on:
  schedule:
    # Reactivate the default-branch schedule; the preceding offset cron never ran.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/publish-bom-ftp-manifest-v1.py
      - scripts/stage-genuine-ftp-png-feed-v1.py
      # Any operational radar source change also refreshes the verified archive.
      - frontend/src/bom-wmts-loop-v2.js
      - frontend/src/ftp-reflectivity-operational-v1.js
      - .github/workflows/publish-bom-ftp-manifest.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: bom-ftp-observation-manifest
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Checkout previously authenticated source frames for SHA-verified reuse
        uses: actions/checkout@v4
        with:
          ref: radar-ftp-feed
          path: checked/radar-ftp-feed
          persist-credentials: false
      - name: Retrieve authentic BoM radar directory listing
        run: python scripts/publish-bom-ftp-manifest-v1.py --out /tmp/bom-ftp-manifest.json
      - name: Stage actual original PNGs over anonymous FTP
        run: |
          python scripts/stage-genuine-ftp-png-feed-v1.py \
            --manifest /tmp/bom-ftp-manifest.json \
            --out /tmp/stormtracker-ftp-static \
            --reuse-dir checked/radar-ftp-feed/frames \
            --prior-manifest checked/radar-ftp-feed/manifest.json
      - name: Publish genuine radar observation archive branch
        run: |
          set -euo pipefail
          git config user.name "stormtracker-source-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin radar-ftp-feed >/dev/null; then
            git fetch --depth=1 origin radar-ftp-feed
            git checkout -B radar-ftp-feed FETCH_HEAD
          else
            git checkout --orphan radar-ftp-feed
            git rm -r --cached . >/dev/null
          fi
          # This branch stores only the radar feed; no application source changes.
          git rm -r --ignore-unmatch frames >/dev/null || true
          rm -rf frames
          cp -a /tmp/stormtracker-ftp-static/frames ./frames
          cp /tmp/stormtracker-ftp-static/manifest.json manifest.json
          git add -f manifest.json frames/
          git diff --cached --quiet && exit 0
          git commit -m "radar: publish BoM-observed FTP frame index"
          # IFD calibration publishes a different path on this same data branch.
          # It must never silently prevent today's actual FTP image archive update.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/radar-ftp-feed; then exit 0; fi
            echo "Radar feed advanced during FTP stage; rebasing source-only update ($attempt)"
            git fetch --depth=20 origin radar-ftp-feed
            git rebase FETCH_HEAD
            sleep 2
          done
          echo "Unable to publish fresh authentic FTP archive" >&2
          exit 1
      - name: Report data feed
        run: echo "Verified original FTP radar feed at https://raw.githubusercontent.com/Blakesmith-Intel/StormTracker/radar-ftp-feed/manifest.json"

  # GitHub Actions' minute-cron has not delivered any schedule events for this
  # repository. Arm a low-cost workflow_dispatch watchdog after each run.
  # Dispatch events created by GITHUB_TOKEN ARE allowed to trigger new Actions.
  # If native scheduling recovers, the watchdog stands down automatically.
  watchdog:
    needs: publish
    if: ${{ always() && vars.STORMTRACKER_STOP_RADAR_WATCHDOG != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: stormtracker-ftp-refresh-watchdog
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for next normal five-minute source refresh
        run: |
          # First run after this watchdog is installed verifies dispatch promptly.
          # All later self-dispatched runs remain approximately five minutes apart.
          if [ "${{ github.event_name }}" = "push" ]; then
            sleep 45
          else
            sleep 240
          fi
      - name: Arm next refresh only if GitHub's native scheduler has not recovered
        run: |
          set -euo pipefail
          scheduled="$(gh api "repos/$GH_REPO/actions/workflows/publish-bom-ftp-manifest.yml/runs?event=schedule&per_page=1" --jq '.workflow_runs[0].created_at // empty')"
          if [ -n "$scheduled" ]; then
            last_schedule="$(date --date="$scheduled" +%s)"
            now="$(date -u +%s)"
            if [ "$last_schedule" -le "$now" ] && [ "$((now-last_schedule))" -lt 900 ]; then
              echo "Native five-minute GitHub schedule recovered at $scheduled; watchdog standing down."
              exit 0
            fi
          fi
          echo "No recent scheduled refresh. Dispatching next original BoM FTP publication."
          gh workflow run publish-bom-ftp-manifest.yml --ref main
