name: Diagnose official Queensland flood threshold coverage
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  inspect-live-thresholds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/probe-qld-flood-thresholds-live.mjs
