name: Audit Richmond PNG quality and live Wynnum outage geometry
on:
  push:
    branches: [fix/radar-visual-outage-polygon-20261019]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - name: Audit official current Energex geometry and filtering
        run: |
          node scripts/diagnose-live-energex-wynnum-20261019.mjs
          node scripts/diagnose-live-road-closure-geometry-v1.mjs
      - name: Verify affected JS modules and frontend regression tests
        run: |
          node --check frontend/src/context-layers/power-outages-v1.js
          node --check frontend/src/ftp-reflectivity-operational-v1.js
          node scripts/test-map-geometry-integrity-20261019.mjs
          npm test
      - uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
      - uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
      - uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
      - name: Verify the ACTUAL sealed production artefact includes new geometry
        run: |
          bash scripts/build-current-site.sh
          python scripts/apply-ftp-aep-release-v10.py
          node --check _site/src/context-layers/flood-road-closures-v1.js
          node --check _site/src/context-layers/flood-road-closure-filter-v1.js
          node --check _site/src/context-layers/power-outages-v1.js
          grep -Fq 'officialPowerOutageBoundaryRings(feature).entries()' _site/src/context-layers/power-outages-v1.js
          grep -Fq 'multipoint-' _site/src/context-layers/flood-road-closures-v1.js
          grep -Fq 'zIndex:51' _site/src/context-layers/flood-road-closures-v1.js
          grep -Fq 'flood-road-closures-v1.js?v=background-incident-refresh-20261017-v1' _site/src/context-layers/flood-road-closures-operational-v1.js
          echo MAP_GEOMETRY_PRODUCTION_EQUIVALENT_PASS
