          ! grep -Fq '>Primary radar only.</div>' <<< "$productionHtml"
          echo "Verified multi-radar V9.17.0 production and retained isolated pre-release preview; storm pixel-tracking intact."

      - name: Seal verified production tag v9.17.0
        shell: bash
        run: |
          set -euo pipefail
          release_sha="60d6750be2d335858dac485a5312a55693e40c74"
          # actions/checkout uses fetch-depth:1; the pinned release SHA is its parent.
          # Fetch the release commit object before creating immutable refs.
          git fetch --no-tags --depth=4 origin main
          git cat-file -e "$release_sha^{commit}"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/v9.17.0" >/dev/null; then
            actual="$(git rev-list -n1 refs/tags/v9.17.0)"
            test "$actual" = "$release_sha"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v9.17.0 "$release_sha" -m "Sealed StormTracker V9.17.0 · dBZ 3D, NSW coverage, minimal radar icons · verified GitHub Pages"
            git push origin refs/tags/v9.17.0
          fi
          test "$(git rev-list -n1 refs/tags/v9.17.0)" = "$release_sha"
          restore="$(git ls-remote --heads origin 'refs/heads/restore/v9.17.0' | awk '{print $1}')"
          if [ -z "$restore" ]; then
            git push origin "$release_sha:refs/heads/restore/v9.17.0"
          else
            test "$restore" = "$release_sha"
          fi
          test "$(git ls-remote --heads origin 'refs/heads/restore/v9.17.0' | awk '{print $1}')" = "$release_sha"
          echo "SEALED v9.17.0 and restore/v9.17.0 to exact commit $release_sha (historical v9.16.15 left unchanged)"
