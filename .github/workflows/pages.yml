name: Deploy StormTracker — sealed V10.2.0 production and historical QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stormtracker-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout maintenance source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate repository and relay
        run: |
          set -euo pipefail
          npm test
          node --check relay/worker.js

      - name: Checkout accepted diagnostic source
        uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
          persist-credentials: false

      - name: Validate accepted diagnostic source
        run: |
          set -euo pipefail
          (cd checked/accepted-v9.18 && npm test)
          node --check checked/accepted-v9.18/relay/worker.js
          test "$(git -C checked/accepted-v9.18 rev-parse HEAD)" = "acfa0ebd3717a793369e3e887e2d1a54785620b7"

      - name: Checkout retained V9.19.0 rollback source
        uses: actions/checkout@v4
        with:
          ref: d317c17a6a8f706a0d867cb852db1e8d3f9ffac0
          path: checked/production-v9.19.0
          persist-credentials: false

      - name: Validate retained V9.19.0 rollback source
        run: |
          set -euo pipefail
          (cd checked/production-v9.19.0 && npm test)
          node --check checked/production-v9.19.0/relay/worker.js
          test "$(git -C checked/production-v9.19.0 rev-parse HEAD)" = "d317c17a6a8f706a0d867cb852db1e8d3f9ffac0"
          test -f checked/production-v9.19.0/docs/HANDOVER_V9.19.0.md
          test -f checked/production-v9.19.0/docs/USER_GUIDE_V9.19.0.md
          test -f checked/production-v9.19.0/docs/RELEASE_NOTES_V9.19.0.md
          grep -Fq 'PUBLISHED_PRODUCTION_RUNTIME' checked/production-v9.19.0/frontend/src/live3d-operational-v9.js

      - name: Checkout approved V9.20.2 production source
        uses: actions/checkout@v4
        with:
          ref: b8be458acbae942a3bb0b530a5c17618b6d03134
          path: checked/production-v9.20.2
          persist-credentials: false

      - name: Validate exact immutable V9.20.2 production source
        run: |
          set -euo pipefail
          (cd checked/production-v9.20.2 && npm test)
          node --check checked/production-v9.20.2/relay/worker.js
          test "$(git -C checked/production-v9.20.2 rev-parse HEAD)" = "b8be458acbae942a3bb0b530a5c17618b6d03134"
          test -f checked/production-v9.20.2/docs/HANDOVER_V9.20.2.md
          test -f checked/production-v9.20.2/docs/USER_GUIDE_V9.20.2.md
          test -f checked/production-v9.20.2/docs/RELEASE_NOTES_V9.20.2.md
          grep -Fq 'const INCREMENTAL_VOLUME_PREVIEW =' checked/production-v9.20.2/frontend/src/live3d-operational-v9.js
          grep -Fq 'incrementalVolumeRenderer.upsert(pixelIndex,category,nextSpecs' checked/production-v9.20.2/frontend/src/live3d-operational-v9.js
          grep -Fq 'createResponsiveMemoryDiagnostics' checked/production-v9.20.2/frontend/src/live3d-operational-v9.js
          grep -Fq 'Memory diagnostics' checked/production-v9.20.2/frontend/src/responsive-memory-diagnostics-v1.js
          grep -Fq 'GLOBAL_SATELLITE_FALLBACK' checked/production-v9.20.2/frontend/src/context-layers/basemap-manager-v1.js
          grep -Fq 'global-satellite-blue-gap-20261016-v1' checked/production-v9.20.2/frontend/src/live3d-operational-v9.js
          grep -Fq 'satellite-blue-gap-qa-v1' checked/production-v9.20.2/frontend/index.html
          grep -Fq 'v9.20.0-optimised-3d-prod' checked/production-v9.20.2/frontend/live3d-operational-v9.html
          grep -Fq 'v9.20.1-secondary-3d-fix' checked/production-v9.20.2/frontend/live3d-operational-v9.html
          grep -Fq 'selectSupplementalVolumeSampleIndices' checked/production-v9.20.2/frontend/src/supplemental-radar-volume-v1.js
          grep -Fq 'hashSupplementalPixel' checked/production-v9.20.2/frontend/src/supplemental-volume-sampling-v1.js

      - name: Checkout exact V10.2.0 accepted UI + multi-site Doppler source
        uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
          persist-credentials: false
      - name: Validate exact immutable V10.2.0 release candidate
        run: |
          set -euo pipefail
          test "$(git -C checked/production-v10.2.0 rev-parse HEAD)" = "047b3bd1c66b0ed5f070d2298202f46d0cd8dae2"
          (cd checked/production-v10.2.0 && npm test)
          node --check checked/production-v10.2.0/relay/worker.js
          node --check checked/production-v10.2.0/frontend/src/multi-doppler-display-v1.js
          grep -Fq 'createSupplementalDopplerDisplay' checked/production-v10.2.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'id="multiRadarDopplerStatus"' checked/production-v10.2.0/frontend/live3d-operational-v9.html
          grep -Fq 'body class="simple-ui"' checked/production-v10.2.0/frontend/live3d-operational-v9.html
          test -f checked/production-v10.2.0/frontend/tests/run-multi-native-doppler-v1-tests.mjs
          grep -Fq 'body.simple-ui #app.sidebar-collapsed' checked/production-v10.2.0/frontend/src/single-interface-v1.css
          grep -Fq 'full-map-controls-gauge-severity-v4' checked/production-v10.2.0/frontend/live3d-operational-v9.html
          grep -Fq 'hide-controls-full-map-v1' checked/production-v10.2.0/frontend/index.html
          grep -Fq 'supplementalDopplerDisplay.prepare(source.observedUtc)' checked/production-v10.2.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'supplementalDopplerDisplay.commit(source.observedUtc)' checked/production-v10.2.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'function commit(utc)' checked/production-v10.2.0/frontend/src/multi-doppler-display-v1.js
          grep -Fq 'SECONDARY_WIND_FRAME_SYNC_WAIT_MS=350' checked/production-v10.2.0/frontend/src/multi-doppler-display-v1.js
          grep -Fq 'IDR93I' checked/production-v10.2.0/frontend/src/border-radar-sites-v1.js
          grep -Fq 'stormtracker-bom-relay.stormtracker-bom-relay.workers.dev' checked/production-v10.2.0/frontend/src/bom-doppler-intake-v3.js
          grep -Fq 'id="openCycloneForecastQa"' checked/production-v10.2.0/frontend/live3d-operational-v9.html
          grep -Fq 'createInternalCycloneLiveQA' checked/production-v10.2.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'Currently no tropical cyclone warnings' checked/production-v10.2.0/frontend/src/internal-cyclone-live-qa-v1.js

      # QA is an independently pinned third preview. Never change the V10.2.0
      # production source, nor the two existing diagnostic QA subpaths.
      - name: Checkout isolated V10.3 wind-hook scientific QA source
        uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
          persist-credentials: false

      - name: Verify scientific QA tests and immutable preview source
        run: |
          set -euo pipefail
          test "$(git -C checked/wind-hook-v10.3-qa rev-parse HEAD)" = "f3a07688ca02f5f0234ae6425fc1177722518c53"
          (cd checked/wind-hook-v10.3-qa && npm test)
          node --check checked/wind-hook-v10.3-qa/frontend/src/severe-storm-v10.js
          node --check checked/wind-hook-v10.3-qa/frontend/src/doppler-persistence-v10-3.js
          test -f checked/wind-hook-v10.3-qa/frontend/tests/run-doppler-persistence-v10-3-tests.mjs
          node --check checked/wind-hook-v10.3-qa/frontend/src/live3d-operational-v9.js
          grep -Fq 'wind-hook-v10-3/' checked/wind-hook-v10.3-qa/frontend/src/live3d-operational-v9.js
          grep -Fq 'const onCycloneQaPreview' checked/wind-hook-v10.3-qa/frontend/src/live3d-operational-v9.js

      - name: Verify historical V9.18.0 rollback source is immutable
        run: |
          set -euo pipefail
          tag_commit="$(git ls-remote origin refs/tags/v9.18.0 | cut -f1)"
          branch_commit="$(git ls-remote origin refs/heads/restore/v9.18.0 | cut -f1)"
          test "$tag_commit" = "66d3da447ef7a4df53e7df49aa1ac06f86cb5afd"
          test "$branch_commit" = "66d3da447ef7a4df53e7df49aa1ac06f86cb5afd"

      - name: Verify V9.19.0 immediate rollback references remain untouched
        run: |
          set -euo pipefail
          tag_peeled="$(git ls-remote origin 'refs/tags/v9.19.0^{}' | cut -f1)"
          branch="$(git ls-remote origin refs/heads/restore/v9.19.0 | cut -f1)"
          test "$tag_peeled" = "d317c17a6a8f706a0d867cb852db1e8d3f9ffac0"
          test "$branch" = "d317c17a6a8f706a0d867cb852db1e8d3f9ffac0"

      - name: Verify sealed V9.20.0 fallback before cutover
        run: |
          set -euo pipefail
          test "$(git ls-remote origin 'refs/tags/v9.20.0^{}' | cut -f1)" = "aba409fd1609e7bf7be6bf3c098b7fb6a14d89d1"
          test "$(git ls-remote origin refs/heads/restore/v9.20.0 | cut -f1)" = "aba409fd1609e7bf7be6bf3c098b7fb6a14d89d1"

      - name: Verify V9.20.1 rollback references remain untouched
        run: |
          set -euo pipefail
          test "$(git ls-remote origin 'refs/tags/v9.20.1^{}' | cut -f1)" = "efaceb59427f0b71859b15a61a6758a80d08547e"
          test "$(git ls-remote origin refs/heads/restore/v9.20.1 | cut -f1)" = "efaceb59427f0b71859b15a61a6758a80d08547e"

      - name: Build pinned V10.2.0 plus QA-approved FTP/AEP production overlay
        run: |
          bash scripts/build-current-site.sh
          python scripts/apply-ftp-aep-release-v10.py
          python scripts/apply-radar-auto-refresh-v1.py
          node --check _site/src/live-loop-refresh-v1.js
          node --check _site/src/live3d-operational-v9.js
          node frontend/tests/run-radar-auto-refresh-v10-2-37-tests.mjs
          ! test -e _site/src/ftp-reflectivity-operational-v1.js
          node --check _site/src/hires-radar-loop-policy-v1.js
          node --check _site/src/bom-wmts-loop-v2.js
          node --check _site/src/context-layers/rainfall-ifd-aep-v1.js
          node --check _site/src/context-layers/significant-rainfall-operational-v1.js
          grep -Fq '__STORMTRACKER_NATIONAL_MOSAIC_PRIMARY=true' _site/live3d-operational-v9.html
          ! grep -Fq 'ftp-reflectivity-operational-v1.js' _site/src/bom-wmts-loop-v2.js
          ! grep -Fq 'loadFtpReflectivityMosaicAtTime' _site/src/bom-wmts-loop-v2.js
          grep -Fq 'isVerifiedHiResRadarFrame' _site/src/live3d-operational-v9.js
          grep -Fq 'measuredHiResRainWindow' _site/src/live3d-operational-v9.js
          grep -Fq 'NATIONAL_MOSAIC_PRIMARY=true' _site/src/bom-wmts-loop-v2.js
          node frontend/tests/run-hires-radar-road-toggle-20261019-tests.mjs
          node scripts/test-national-source-policy-v1.mjs
          grep -Fq 'classifyRainfallAep' _site/src/context-layers/significant-rainfall-operational-v1.js
          grep -Fq 'FLOOD RECOVERY V10.2.9' _site/BUILD.txt
          grep -Fq 'FLOOD CROSSING REPORT V10.2.10' _site/BUILD.txt
          node --check _site/src/context-layers/river-gauge-notable-report-v1.js
          grep -Fq 'get sourceFeatures()' _site/src/context-layers/river-gauge-layer-v1.js
          grep -Fq 'openFloodGaugeReport' _site/live3d-operational-v9.html
          grep -Fq 'buildNotableFloodGaugeReport' _site/src/context-layers/river-gauges-operational-v1.js
          grep -Fq 'preRiseReference' _site/src/context-layers/river-flood-events-v1.js
          grep -Fq 'elevated:"#1269e8"' _site/src/context-layers/river-gauge-layer-v1.js
          grep -Fq 'IFD_LOOKUP_CONCURRENCY=6' _site/src/context-layers/rainfall-ifd-aep-v1.js
          grep -Fq 'loadPersistedIfdCells' _site/src/context-layers/significant-rainfall-operational-v1.js
          grep -Fq 'persistVerifiedIfdCell' _site/src/context-layers/significant-rainfall-operational-v1.js
          grep -Fq 'rainfall-ifd-aep-v1.js?v=20261022-v10-2-8-verified-ifd-persistence' _site/src/context-layers/significant-rainfall-operational-v1.js
          grep -Fq 'scheduleAepRender' _site/src/context-layers/significant-rainfall-operational-v1.js
          grep -Fq 'ACCEPTED MAINTENANCE RELEASE V10.2.8' _site/BUILD.txt

      - name: Checkout AEP live rainfall preview (separate from sealed production)
        uses: actions/checkout@v4
        with:
          ref: 18ca3f44cfa0cb431c440995fa44744f866d885b
          path: checked/aep-rainfall-preview
          persist-credentials: false

      - name: Validate and package interactive on-demand AEP test preview
        run: |
          set -euo pipefail
          node checked/aep-rainfall-preview/frontend/tests/run-ifd-on-demand-v1-tests.mjs
          node checked/aep-rainfall-preview/frontend/tests/run-rainfall-catchment-v1-tests.mjs
          node --check checked/aep-rainfall-preview/frontend/src/context-layers/significant-rainfall-operational-v1.js
          node --check relay/ifd-on-demand.js
          python scripts/package-rainfall-aep-preview.py
          python scripts/build-bom-rainfall-basins.py --out _site/preview/rainfall-aep/data/qld-rainfall-basins-v1.json
          cp _site/preview/rainfall-aep/data/qld-rainfall-basins-v1.json _site/data/qld-rainfall-basins-v1.json
          test -s _site/data/qld-rainfall-basins-v1.json
          grep -Fq '"543013"' _site/data/qld-rainfall-basins-v1.json
          node --check _site/src/context-layers/rainfall-catchment-v1.js
          grep -Fq 'queueIfdLookups' _site/src/context-layers/significant-rainfall-operational-v1.js
          grep -Fq '"Catchment"' _site/src/context-layers/significant-rainfall-operational-v1.js
          node --check _site/preview/rainfall-aep/src/context-layers/rainfall-catchment-v1.js
          grep -Fq '"543013"' _site/preview/rainfall-aep/data/qld-rainfall-basins-v1.json
          grep -Fq '"Catchment"' _site/preview/rainfall-aep/src/context-layers/significant-rainfall-operational-v1.js
          grep -Fq 'queueIfdLookups' _site/preview/rainfall-aep/src/context-layers/significant-rainfall-operational-v1.js
          test -s _site/preview/rainfall-aep/BUILD.txt
          grep -Fq 'SEALED StormTracker V10.2.0' _site/BUILD.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload supported site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy supported site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published V10.2.0 source and existing historical QA
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Published-site verification failed at command: $BASH_COMMAND (line $LINENO)"' ERR
          base="${PAGES_URL%/}"
          # GitHub Pages publication can briefly serve the previous CDN copy.
          # Confirm all three actual published flood-legend assets before
          # accepting the release; do not weaken any existing historic QA.
          legend_published=0
          for attempt in $(seq 1 10); do
            suffix="?release=$GITHUB_SHA&check=$attempt"
            legend_html="$(curl -fsSL --max-time 20 "$base/live3d-operational-v9.html$suffix" || true)"
            legend_css="$(curl -fsSL --max-time 20 "$base/src/single-interface-v1.css$suffix" || true)"
            legend_js="$(curl -fsSL --max-time 20 "$base/src/context-layers/river-gauges-operational-v1.js$suffix" || true)"
            if grep -Fq 'data-flood-legend-state="crossing"' <<< "$legend_html" &&
               grep -Fq 'flood-legend-grid' <<< "$legend_css" &&
               grep -Fq 'icon.src=createRiverGaugeMarkerImage(state,rapid)' <<< "$legend_js"; then
              legend_published=1
              break
            fi
            echo "Live flood legend assets not yet fully published, check $attempt/10"
            sleep 5
          done
          test "$legend_published" = 1 || {
            echo "::error::Published Pages site is missing the amber crossing legend or its styling / matching marker code"
            exit 1
          }
          root="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/BUILD.txt")"
          preview="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/preview/radar-history-fix/BUILD.txt")"
          grep -Fq 'SEALED StormTracker V10.2.0 source 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2' <<< "$root"
          grep -Fq 'RELEASE CANDIDATE: original BoM FTP source archive + independently sourced location-specific IFD/AEP' <<< "$root"
          grep -Fq 'ACCEPTED MAINTENANCE RELEASE V10.2.5' <<< "$root"
          grep -Fq 'ACCEPTED MAINTENANCE RELEASE V10.2.8' <<< "$root"
          grep -Fq 'FLOOD RECOVERY V10.2.9' <<< "$root"
          grep -Fq 'FLOOD CROSSING REPORT V10.2.10' <<< "$root"
          grep -Fq 'RIVER-HISTORY MAINTENANCE HOTFIX 2026-10-18' <<< "$root"
          grep -Fq 'RIVER-HISTORY NO-DATA V2 2026-10-18' <<< "$root"
          grep -Fq 'OPTIONAL RIVER HISTORY 503 MITIGATION 2026-10-18' <<< "$root"
          grep -Fq 'DOPPLER HISTORICAL PNG 502 RETRY COOLDOWN 75 SECONDS' <<< "$root"
          grep -Fq 'WMTS ALL RADARS SOURCE-PUBLISHED TIME DIMENSION 2026-10-18' <<< "$root"
          grep -Fq 'WALKERSTON 533142 MINOR 2.75M STALE FLOOD CLASS PERSISTENCE 2026-10-18' <<< "$root"
          grep -Fq 'ALL RADARS WMTS STALE TIME 400 ONE-TILE PREFLIGHT + IDR74 PNG SOURCE COOLDOWN 2026-10-18' <<< "$root"
          grep -Fq 'FIRST-PARTY SVG FAVICON 2026-10-18' <<< "$root"
          grep -Fq 'SOURCE-VERIFIED QLD SIGNIFICANT RAINFALL 9AM/1HR ORANGE 50-99.9 RED 100+' <<< "$root"
          rainfall_html="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/live3d-operational-v9.html")"
          grep -Fq 'showSignificantRainfall' <<< "$rainfall_html"
          grep -Fq 'significantRainfallPeriod' <<< "$rainfall_html"
          grep -Fq '__STORMTRACKER_NATIONAL_MOSAIC_PRIMARY=true' <<< "$rainfall_html"
          grep -Fq 'Significant rain</label>' <<< "$rainfall_html"
          grep -Fq 'value="last24Hours"' <<< "$rainfall_html"
          grep -Fq 'id="openRainfallTotalsReport"' <<< "$rainfall_html"
          grep -Fq 'id="openRainfallAepReport"' <<< "$rainfall_html"
          grep -Fq 'id="openFloodGaugeReport"' <<< "$rainfall_html"
          grep -Fq 'id="floodGaugeReport"' <<< "$rainfall_html"
          grep -Fq 'id="floodGaugeReportRows"' <<< "$rainfall_html"
          # Read-only user guide must be part of the existing sidebar header,
          # not a floating overlay or anything inside the Cesium map panel.
          grep -Fq 'id="operatorGuideLink"' <<< "$rainfall_html"
          grep -Fq 'https://github.com/Blakesmith-Intel/StormTracker/blob/main/docs/OPERATOR_GUIDE_CURRENT.md' <<< "$rainfall_html"
          grep -Fq 'target="_blank" rel="noopener noreferrer"' <<< "$rainfall_html"
          guide_css="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/single-interface-v1.css")"
          grep -Fq '#controlSidebar > .dashboard-heading .operator-guide-link' <<< "$guide_css"
          grep -Fq '#openFloodGaugeReport' <<< "$guide_css"
          grep -Fq 'class="significant-rainfall-report-actions"' <<< "$rainfall_html"
          rainfall_style="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/single-interface-v1.css")"
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr))' <<< "$rainfall_style"
          grep -Fq 'id="significantRainfallReport"' <<< "$rainfall_html"
          grep -Fq '1 in 20' <<< "$rainfall_html"
          grep -Fq '1 in 100' <<< "$rainfall_html"
          rainfall_engine="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/live3d-operational-v9.js")"
          grep -Fq 'initialiseOperationalSignificantRainfall({viewer})' <<< "$rainfall_engine"
          rainfall_source="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/context-layers/significant-rainfall-source-v1.js")"
          grep -Fq 'parseBomRainfallMap' <<< "$rainfall_source"
          rainfall_layer="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/context-layers/significant-rainfall-operational-v1.js")"
          severity_source="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/context-layers/severity-marker-layer-v1.js")"
          grep -Fq 'One scene collection per rank makes order explicit' <<< "$severity_source"
          grep -Fq 'Never replace original BoM longitude/latitude' <<< "$severity_source"
          # The map pin asset must be a fixed-surface PNG for every flood
          # category, including saved blue post-rise monitoring on Safari.
          live_flood_source="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/context-layers/river-gauge-layer-v1.js")"
          grep -Fq 'canvas.width=160;canvas.height=176;' <<< "$live_flood_source"
          grep -Fq 'markerImages.set(key,createRiverGaugeMapMarkerBitmap(state,rapidRise))' <<< "$live_flood_source"
          grep -Fq 'canvas.toDataURL("image/png")' <<< "$live_flood_source"
          ! grep -Fq 'chooseVisibleSeverityMarkers' <<< "$severity_source"
          ! grep -Fq 'safeguardOverlap' <<< "$severity_source"
          grep -Fq 'SIGNIFICANT_RAINFALL_RELAY' <<< "$rainfall_layer"
          grep -Fq 'classifyRainfallAep' <<< "$rainfall_layer"
          grep -Fq 'queueIfdLookups' <<< "$rainfall_layer"
          grep -Fq 'buildSignificantRainfallReport' <<< "$rainfall_layer"
