name: Verify restored production Pages after FTP import rollback
on:
  push:
    branches: [hotfix/verify-pages-rollback-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Assert public site serves sealed modules with no FTP import
        run: node scripts/verify-production-pages-rollback-20261019.mjs
      - name: Install isolated Chromium browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - name: Verify real public Cesium map boots without failed JavaScript imports
        run: node scripts/verify-production-pages-browser-20261019.mjs
      - name: Save recovery screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-stormtracker-rollback-browser
          path: /tmp/stormtracker-recovered-browser.png
          if-no-files-found: warn
