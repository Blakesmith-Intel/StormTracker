name: Audit published QLDTraffic flood-closure records
on:
  workflow_dispatch:
  push:
    branches: [feature/v9.15.0-qfd-technical-rescue]
    paths:
      - scripts/audit-qldtraffic-live-closures-v1.mjs
      - .github/workflows/audit-qldtraffic-live-closures.yml
permissions:
  contents: read
jobs:
  live-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/audit-qldtraffic-live-closures-v1.mjs
