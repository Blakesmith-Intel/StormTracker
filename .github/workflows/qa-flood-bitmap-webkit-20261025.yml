name: QA actual iOS-like flood bitmap output (isolated)
on:
  push:
    branches: ["fix/flood-safari-bitmap-icons-20261025"]
permissions:
  contents: read
jobs:
  verify-bitmaps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install WebKit and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test raster assets in live Canvas on iOS-like Chromium and WebKit
        run: |
          python3 -m http.server 8765 --directory frontend > /tmp/bitmap-http.log 2>&1 &
          sleep 2
          node scripts/qa-flood-bitmap-browser-v1.mjs
