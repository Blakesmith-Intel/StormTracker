name: QA actual V10 AEP popup in Cesium
on:
  push:
    branches: [release/ftp-static-archive-aep-v10-20261019]
    paths:
      - scripts/test-ftp-aep-actual-v10-viewer-browser-v1.mjs
      - .github/workflows/qa-real-v10-aep-cesium-popup-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
      - uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
      - uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
      - run: |
          bash scripts/build-current-site.sh
          python scripts/apply-ftp-aep-release-v10.py
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - run: |
          python -m http.server 8137 --bind 127.0.0.1 --directory _site >/tmp/aep-browser-http.log 2>&1 &
          node scripts/test-ftp-aep-actual-v10-viewer-browser-v1.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aep-popup-real-cesium-qa
          path: /tmp/v10-ftp-aep-cesium-qa.png
          if-no-files-found: warn
