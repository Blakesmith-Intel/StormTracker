name: QA Firefox and Edge Cesium warnings — sealed V10
on:
  push:
    branches: [qa/browser-warning-cleanup-v10-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
      - uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
      - uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
      - name: Test current sealed production code
        run: |
          npm test
          node --check relay/worker.js
      - name: Download the exact same Cesium runtime from npm
        run: |
          npm install --no-save --ignore-scripts cesium@1.145.0 playwright@1.58.2
          node -e "const p=require('./node_modules/cesium/package.json');if(p.version!=='1.145.0')process.exit(1);console.log('CESIUM_RUNTIME_VERSION',p.version)"
      - name: Package without touching immutable V10 source
        run: |
          bash scripts/build-current-site.sh
          python scripts/package-cesium-selfhost-v10-20261019.py
          test -s _site/cesium/Cesium.js
          test -s _site/cesium/Workers/createVerticesFromHeightmap.js
          test -s _site/cesium/Widgets/widgets.css
          node --check _site/src/live3d-operational-v9.js
          ! grep -q 'unpkg.com/cesium' _site/live3d-operational-v9.html
          ! grep -q 'const frame = hybridFrames\[index\];' <(sed -n '/function syncSevereStormAlerts/,/function dopplerContextForTrack/p' _site/src/live3d-operational-v9.js)
      - name: Install Firefox and Chromium
        run: npx playwright install --with-deps chromium firefox
      - name: Verify rendering and same-origin assets in BOTH browsers
        run: |
          python -m http.server 8137 --bind 127.0.0.1 --directory _site >/tmp/stormtracker-browser-qa.log 2>&1 &
          node scripts/test-selfhost-cesium-browsers-20261019.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-party-cesium-browser-qa
          path: /tmp/stormtracker-*-cesium-qa.png
          if-no-files-found: warn
