name: Probe DEA imagery for regional basemap
on:
  push:
    branches: ["feature/v9-17-dea-regional-auto-detail-20261013"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe DEA OGC imagery and browser cross-origin headers
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET
          root="https://ows.dea.ga.gov.au/"
          for service in ("WMTS","WMS"):
              url=root+"?"+urllib.parse.urlencode({"SERVICE":service,"VERSION":"1.0.0" if service=="WMTS" else "1.3.0","REQUEST":"GetCapabilities"})
              try:
                  req=urllib.request.Request(url,headers={"Origin":"https://blakesmith-intel.github.io","User-Agent":"StormTracker-DEA-Imagery-Validation/1.0"})
                  with urllib.request.urlopen(req,timeout=40) as response:
                      raw=response.read()
                      print("SERVICE",service,"status",response.status,"bytes",len(raw),"content-type",response.headers.get("content-type"),"CORS",response.headers.get("access-control-allow-origin"))
                  doc=ET.fromstring(raw)
                  if service=="WMTS":
                      ns={"wmts":"http://www.opengis.net/wmts/1.0","ows":"http://www.opengis.net/ows/1.1"}
                      layers=doc.findall(".//wmts:Contents/wmts:Layer",ns)
                      for layer in layers:
                          title=(layer.findtext("ows:Title","",ns) or "")
                          identifier=layer.findtext("ows:Identifier","",ns)
                          if "geomedian" in title.lower() or "median" in title.lower() or "true" in title.lower() or "ga_ls8cls9c_gm" in identifier.lower():
                              styles=[(x.findtext("ows:Identifier","",ns),x.get("isDefault")) for x in layer.findall("wmts:Style",ns)]
                              matrices=[x.findtext("wmts:TileMatrixSet","",ns) for x in layer.findall("wmts:TileMatrixSetLink",ns)]
                              dim=[(x.findtext("ows:Identifier","",ns),x.findtext("wmts:Default","",ns)) for x in layer.findall("wmts:Dimension",ns)]
                              print("WMTS LAYER:",identifier,"title",title,"styles",styles[:8],"tilematrix",matrices,"dimensions",dim[:3])
                      print("WMTS LAYER COUNT",len(layers))
                  else:
                      layers=doc.findall(".//{http://www.opengis.net/wms}Layer")
                      for layer in layers:
                          title=layer.findtext("{http://www.opengis.net/wms}Title","")
                          name=layer.findtext("{http://www.opengis.net/wms}Name","")
                          if "geomedian" in title.lower() or "median" in title.lower() or "true" in title.lower() or "ga_ls8cls9c_gm" in name.lower():
                              print("WMS LAYER:",name,"title",title)
                      print("WMS LAYER COUNT",len(layers))
              except Exception as err:
                  print("SERVICE",service,"PROBE ERROR",repr(err))
          PY
