name: Deploy Brewarrina Doppler isolated NSW preview relay

# Manual only until Cloudflare's NSW Worker deployment permission is fixed.
# The first automatic deployment returned "No access to the specified resource".
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stormtracker-nsw-doppler-preview-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate NSW Doppler contract and existing radar sources
        run: |
          npm test
          node --check relay/worker.js
      - name: Deploy NSW preview Cloudflare Worker only (never the Queensland worker)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy --config wrangler-nsw-preview.jsonc
      - name: Verify NSW Worker route and probe authentic Brewarrina source
        run: node scripts/probe-brewarrina-wind-source.mjs
