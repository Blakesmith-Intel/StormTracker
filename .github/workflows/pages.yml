          grep -Fq 'V10.2.26' docs/BASELINE_RESTORE.md
          test "$(git rev-parse HEAD)" = "$release_sha"
          grep -Fq 'INTERVAL_MS=15*60*1000' frontend/src/context-layers/bom-warning-operational-v1.js
          grep -Fq '/bom-official-warning-polygons' relay/worker.js
          node frontend/tests/run-official-bom-warning-polygons-bees-dick-v1-tests.mjs
          node frontend/tests/run-bom-warning-product-cancel-refresh-v1-tests.mjs
          # Validate the published HTML/module chain, not just the checkout.
          # BoM does not need to have an active warning to pass this release:
          # source unavailable/cancelled with zero polygons is an honest state.
          base="https://blakesmith-intel.github.io/StormTracker"
          relay="https://stormtracker-bom-relay.stormtracker-bom-relay.workers.dev/bom-official-warning-polygons"
          verified=false
          for attempt in $(seq 1 16); do
            page="$(curl -fsSL --max-time 18 "$base/live3d-operational-v9.html?check=$release_sha-$attempt" || true)"
            module="$(curl -fsSL --max-time 18 "$base/src/context-layers/bom-warning-operational-v1.js?check=$release_sha-$attempt" || true)"
            render="$(curl -fsSL --max-time 18 "$base/src/context-layers/bom-warning-terrain-imagery-v1.js?check=$release_sha-$attempt" || true)"
            status="$(curl -fsSL --max-time 25 "$relay?check=$release_sha-$attempt" || true)"
            if grep -Fq 'id="officialBomWarningProduct"' <<< "$page" &&
               grep -Fq 'id="officialBomWarningGroupsReport"' <<< "$page" &&
               grep -Fq 'INTERVAL_MS=15*60*1000' <<< "$module" &&
               grep -Fq 'createWarningImageryProvider' <<< "$render" &&
               grep -Fq 'StormTrackerOfficialBoMWarningPolygonsV1' <<< "$status"; then
               verified=true
               break
            fi
            sleep 4
          done
          test "$verified" = true || { echo 'Refusing V10.2.26 freeze: public warnings UI/relay not verified'; exit 1; }
          old_tag="$(git ls-remote origin 'refs/tags/v10.2.25^{}' | cut -f1)"
          old_branch="$(git ls-remote origin 'refs/heads/restore/v10.2.25' | cut -f1)"
          test -n "$old_tag" && test "$old_tag" = "$old_branch"
          test "$old_tag" = "d9620f6cbc411bfee029d9fa9d170752aa7c34f2"
          prior_tag="$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)"
          prior_branch="$(git ls-remote origin "refs/heads/$restore" | cut -f1)"
          test -z "$prior_tag" || test "$prior_tag" = "$release_sha"
          test -z "$prior_branch" || test "$prior_branch" = "$release_sha"
          if [ -z "$prior_branch" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$restore" -f sha="$release_sha" >/dev/null
          fi
          if [ -z "$prior_tag" ]; then
            object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$tag" \
              -f message="StormTracker V10.2.26 — operator-accepted final docs-only freeze of V10.2.25 working warnings and unchanged V10.2.0 science; all historical tags unchanged" \
              -f object="$release_sha" -f type="commit" --jq .sha)"
            test -n "$object"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$object" >/dev/null
          fi
          test "$(git ls-remote origin "refs/heads/$restore" | cut -f1)" = "$release_sha"
          test "$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)" = "$release_sha"
          echo "SEALED $tag and $restore at $release_sha; historical releases unchanged"

      - name: Preserve sealed V10.2.27 (historical only)
        if: false
        env:
          GH_TOKEN: ${{ secrets.STORMTRACKER_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          release_sha="$GITHUB_SHA"
          tag="v10.2.27"
          restore="restore/v10.2.27"
          test -f docs/RELEASE_NOTES_V10.2.27.md
          grep -Fq 'V10.2.27 live BoM CAP warning-source correction' docs/OPERATOR_GUIDE_CURRENT.md
          grep -Fq 'live-idq21033-cap-source-20261028-v1' scripts/build-current-site.sh
          node frontend/tests/run-live-idq21033-source-recognition-v1-tests.mjs
          node frontend/tests/run-official-bom-warning-polygons-bees-dick-v1-tests.mjs
          node frontend/tests/run-bom-warning-product-cancel-refresh-v1-tests.mjs
          # Confirm Pages and existing Worker both serve the new code.
          # BoM may cancel or revise IDQ21033 during deployment; never require
          # active warning geometry or a particular live issue timestamp.
          base="https://blakesmith-intel.github.io/StormTracker"
          relay="https://stormtracker-bom-relay.stormtracker-bom-relay.workers.dev/bom-official-warning-polygons"
          verified=false
          for attempt in $(seq 1 18); do
            ui="$(curl -fsSL --max-time 15 "$base/live3d-operational-v9.html?sourcefix=$release_sha-$attempt" || true)"
            source="$(curl -fsSL --max-time 15 "$base/src/context-layers/bom-warning-cap-source-v1.js?sourcefix=$release_sha-$attempt" || true)"
            overlay="$(curl -fsSL --max-time 15 "$base/src/context-layers/bom-warning-operational-v1.js?sourcefix=$release_sha-$attempt" || true)"
            status="$(curl -fsSL --max-time 30 "$relay?sourcefix=$release_sha-$attempt" || true)"
            if grep -Fq 'id="officialBomWarningsStatus"' <<< "$ui" &&
               grep -Fq 'function verifiedEventKind' <<< "$source" &&
               grep -Fq 'ACTIVE BoM warning' <<< "$overlay" &&
               grep -Fq 'StormTrackerOfficialBoMWarningPolygonsV1' <<< "$status" &&
               grep -Fq '"products":' <<< "$status"; then
              verified=true
              break
            fi
            sleep 4
          done
          test "$verified" = true || { echo "Refuse freeze: live browser and corrected BoM relay not both verified"; exit 1; }
          old="$(git ls-remote origin 'refs/tags/v10.2.26^{}' | cut -f1)"
          old_restore="$(git ls-remote origin 'refs/heads/restore/v10.2.26' | cut -f1)"
          test -n "$old" && test "$old" = "$old_restore"
          existing_tag="$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)"
          existing_restore="$(git ls-remote origin "refs/heads/$restore" | cut -f1)"
          test -z "$existing_tag" || test "$existing_tag" = "$release_sha"
          test -z "$existing_restore" || test "$existing_restore" = "$release_sha"
          if [ -z "$existing_restore" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$restore" -f sha="$release_sha" >/dev/null
          fi
          if [ -z "$existing_tag" ]; then
            annotated="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$tag" \
              -f message="StormTracker V10.2.27 — current genuine BoM IDQ21033 CAP warning status and safety details; original polygon not supplied; all prior layers frozen" \
              -f object="$release_sha" -f type="commit" --jq .sha)"
            test -n "$annotated"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$annotated" >/dev/null
          fi
          test "$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)" = "$release_sha"
          test "$(git ls-remote origin "refs/heads/$restore" | cut -f1)" = "$release_sha"
          echo "SEALED $tag / $restore at $release_sha; V10.2.26 and earlier references unchanged"

      - name: Seal verified V10.2.28 clear operational BoM warning status
        env:
          GH_TOKEN: ${{ secrets.STORMTRACKER_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          release_sha="$GITHUB_SHA"
          tag="v10.2.28"
          restore="restore/v10.2.28"
          test -f docs/RELEASE_NOTES_V10.2.28.md
          grep -Fq 'Negative reporting is normal' docs/OPERATOR_GUIDE_CURRENT.md
          grep -Fq 'bom-warning-clear-report-20261028-v1' scripts/build-current-site.sh
          node frontend/tests/run-bom-warning-product-cancel-refresh-v1-tests.mjs
          node frontend/tests/run-official-bom-warning-polygons-bees-dick-v1-tests.mjs
          # No requirement for a currently active thunderstorm: verify the
          # published status logic rather than invent a synthetic live polygon.
          base="https://blakesmith-intel.github.io/StormTracker"
          verified=false
          for attempt in $(seq 1 15); do
            ui="$(curl -fsSL --max-time 15 "$base/live3d-operational-v9.html?status=$release_sha-$attempt" || true)"
            module="$(curl -fsSL --max-time 15 "$base/src/context-layers/bom-warning-operational-v1.js?status=$release_sha-$attempt" || true)"
            if grep -Fq 'id="officialBomWarningsStatus"' <<< "$ui" &&
               grep -Fq 'export function describeOfficialBomWarningState' <<< "$module" &&
               grep -Fq 'No current warnings' <<< "$module" &&
               grep -Fq 'No current thunderstorm warnings' <<< "$module" &&
               grep -Fq 'Unable to confirm current BoM warnings' <<< "$module"; then
              verified=true; break
            fi
            sleep 4
          done
          test "$verified" = true || { echo "Refusing V10.2.28 seal: public status module not confirmed"; exit 1; }
          old_tag="$(git ls-remote origin 'refs/tags/v10.2.27^{}' | cut -f1)"
          old_restore="$(git ls-remote origin 'refs/heads/restore/v10.2.27' | cut -f1)"
          test -n "$old_tag" && test "$old_tag" = "$old_restore"
          old_newtag="$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)"
          old_newrestore="$(git ls-remote origin "refs/heads/$restore" | cut -f1)"
          test -z "$old_newtag" || test "$old_newtag" = "$release_sha"
          test -z "$old_newrestore" || test "$old_newrestore" = "$release_sha"
          if [ -z "$old_newrestore" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$restore" -f sha="$release_sha" >/dev/null
          fi
          if [ -z "$old_newtag" ]; then
            object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$tag" \
              -f message="StormTracker V10.2.28 — operator requested no-current-warnings reporting, independent IDQ21033/IDQ21035 status and safe mobile failure handling; prior layers preserved" \
              -f object="$release_sha" -f type="commit" --jq .sha)"
            test -n "$object"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$object" >/dev/null
          fi
          test "$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)" = "$release_sha"
          test "$(git ls-remote origin "refs/heads/$restore" | cut -f1)" = "$release_sha"
          echo "SEALED V10.2.28 negative reporting; historical V10.2.27 unchanged"
