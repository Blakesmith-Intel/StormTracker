name: Validate live national BoM rain reflectivity mosaic
on:
  push:
    branches: [feature/national-bom-mosaic-first-20261019]
  pull_request:
    paths:
      - frontend/src/bom-wmts-loop-v2.js
      - frontend/src/bom-wmts-published-times-v1.js
      - frontend/src/national-mosaic-source-v1.js
      - scripts/probe-live-national-bom-mosaic-v1.mjs
      - .github/workflows/qa-national-bom-mosaic.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate pure source-contract modules
        run: |
          node --check frontend/src/bom-wmts-loop-v2.js
          node --check frontend/src/bom-wmts-published-times-v1.js
          node --check scripts/probe-live-national-bom-mosaic-v1.mjs
          npm test
      - name: Discover the new Bureau website's actual radar data transport
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
          node scripts/probe-bom-new-radar-page-network.mjs
      - name: Probe official documented national products from permitted data services
        run: python scripts/probe-official-national-products.py
      - name: Verify actual BoM national mosaic tiles for Richmond and Brisbane
        run: node scripts/probe-live-national-bom-mosaic-v1.mjs
