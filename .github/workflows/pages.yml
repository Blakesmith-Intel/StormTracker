name: Deploy StormTracker — sealed production and accepted V9.18 QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stormtracker-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout maintenance source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate repository and relay
        run: |
          set -euo pipefail
          npm test
          node --check relay/worker.js

      - name: Checkout accepted diagnostic source
        uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
          persist-credentials: false

      - name: Validate accepted diagnostic source
        run: |
          set -euo pipefail
          (cd checked/accepted-v9.18 && npm test)
          node --check checked/accepted-v9.18/relay/worker.js
          test "$(git -C checked/accepted-v9.18 rev-parse HEAD)" = "acfa0ebd3717a793369e3e887e2d1a54785620b7"

      - name: Checkout sealed production source
        uses: actions/checkout@v4
        with:
          ref: 66d3da447ef7a4df53e7df49aa1ac06f86cb5afd
          path: checked/production-v9.18.0
          persist-credentials: false

      - name: Validate sealed production source
        run: |
          set -euo pipefail
          (cd checked/production-v9.18.0 && npm test)
          node --check checked/production-v9.18.0/relay/worker.js
          test "$(git -C checked/production-v9.18.0 rev-parse HEAD)" = "66d3da447ef7a4df53e7df49aa1ac06f86cb5afd"
          test -f checked/production-v9.18.0/docs/HANDOVER_V9.18.0.md
          test -f checked/production-v9.18.0/docs/USER_GUIDE_V9.18.0.md

      - name: Build sealed production, accepted QA, and isolated next-baseline preview
        run: bash scripts/build-current-site.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload supported site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy supported site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify sealed production and both separate QA previews
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          root="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/BUILD.txt")"
          preview="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/preview/radar-history-fix/BUILD.txt")"
          grep -Fq '66d3da447ef7a4df53e7df49aa1ac06f86cb5afd' <<< "$root"
          grep -Fq 'acfa0ebd3717a793369e3e887e2d1a54785620b7' <<< "$preview"
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/preview/radar-history-fix/src/supplemental-radar-volume-v1.js" \
            | grep -Fq 'SUPPLEMENTAL_VOLUME_MAX_GLYPHS=1500'
          candidate="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/preview/next-baseline/BUILD.txt")"
          grep -Fq 'CANDIDATE StormTracker next baseline source' <<< "$candidate"
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/preview/next-baseline/src/supplemental-observed-anchor-v1.js" \
            | grep -Fq 'supplementalObservedAnchor'
          echo 'Verified sealed production, accepted diagnostic, and next-baseline candidate.'
