name: Inspect exact BoM WMTS upstream rejection

on:
  pull_request:
    paths:
      - '.github/workflows/wmts-source-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read exact previously rejected WMTS tile (no retry burst)
        run: |
          set -euo pipefail
          path='https://stormtracker-bom-relay.stormtracker-bom-relay.workers.dev/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=atm_surf_air_precip_reflectivity_dbz&STYLE=default&FORMAT=image%2Fpng&TILEMATRIXSET=GoogleMapsCompatible_BoM&TILEMATRIX=8&TILEROW=15&TILECOL=34&time=2026-10-18T01%3A20%3A00Z'
          curl -sS -L --connect-timeout 8 --max-time 20 --output /tmp/stormtracker-wmts-response --write-out 'WMTS relay HTTP %{http_code}; content type %{content_type}; bytes %{size_download}\n' "$path" || true
          python3 - <<'PY'
          from pathlib import Path
          body=Path('/tmp/stormtracker-wmts-response')
          if body.exists():
              s=body.read_bytes()
              print('Upstream WMTS refusal body excerpt (no radar imagery):')
              if len(s)<20000 and not s.startswith(b'\x89PNG'):
                  print(s[:1800].decode('utf-8','replace'))
              else:
                  print('binary/oversized response, length=',len(s))
          PY
