name: Publish verified Queensland rainfall IFD point cells
on:
  push:
    branches: [main]
    paths: [scripts/build-native-bom-ifd-point-cells-v1.py, scripts/test_bom_ifd_point_cells_20261020.py, .github/workflows/publish-verified-queensland-ifd.yml]
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qld-ifd-reference-calibration
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Test first-party Bureau 2016 IFD parser
        run: python scripts/test_bom_ifd_point_cells_20261020.py
      - name: Retrieve current station IDs and coordinates (optional)
        run: |
          python - <<'PY'
          import urllib.request,json
          url="https://stormtracker-bom-relay.stormtracker-bom-relay.workers.dev/qld-significant-rainfall"
          try:
            req=urllib.request.Request(url,headers={"Origin":"https://blakesmith-intel.github.io","Accept":"application/json","User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(req,timeout=20) as r:m=json.load(r)
            if m.get("format")=="StormTrackerSignificantRainfallV1":
              json.dump(m,open("/tmp/current-rainfall-gauges.json","w"))
              print("Genuine rainfall gauges", {k:len(v) for k,v in m["observations"].items()})
          except Exception as e:print("Genuine station feed unavailable; retaining previous IFD values",str(e)[:160])
          PY
      - name: Retrieve previously verified reference cells
        run: |
          git fetch --depth=1 origin radar-ftp-feed
          git show FETCH_HEAD:ifd.json > /tmp/previous-ifd.json
          test -s /tmp/previous-ifd.json
      - name: Download official 2016 BoM IFD for unrated station locations
        run: |
          if test -s /tmp/current-rainfall-gauges.json; then
            python scripts/build-native-bom-ifd-point-cells-v1.py --stations /tmp/current-rainfall-gauges.json --existing /tmp/previous-ifd.json --out /tmp/stormtracker-ifd.json --max-new 30
          else
            python scripts/build-native-bom-ifd-point-cells-v1.py --existing /tmp/previous-ifd.json --out /tmp/stormtracker-ifd.json --max-new 30
          fi
      - name: Verify catalogue is append-only and schema-compatible
        run: |
          python - <<'PY'
          import json
          previous=json.load(open("/tmp/previous-ifd.json"))
          incoming=json.load(open("/tmp/stormtracker-ifd.json"))
          schema="StormTrackerBoM2016IFDCellsV1"
          if previous.get("schema")!=schema or incoming.get("schema")!=schema:
            raise SystemExit("IFD schema invalid; refusing to overwrite preserved catalogue")
          before=previous.get("cells")
          after=incoming.get("cells")
          if not isinstance(before,dict) or not before or not isinstance(after,dict):
            raise SystemExit("Missing official IFD catalogue; refusing destructive replacement")
          missing=set(before)-set(after)
          if missing:
            raise SystemExit(f"IFD catalogue loss blocked: {len(missing)} existing cells missing")
          print("IFD_CATALOGUE_PRESERVED",len(before),"->",len(after))
          PY
      - name: Publish authenticated IFD source table to data-only branch
        run: |
          set -euo pipefail
          git config user.name "stormtracker-source-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B radar-ftp-feed FETCH_HEAD
          cp /tmp/stormtracker-ifd.json ifd.json
          git add -f ifd.json
          git diff --cached --quiet && exit 0
          git commit -m "rain: publish source-attributed official BoM 2016 IFD station calibration"
          # A simultaneous FTP publication changes a disjoint set of paths.
          # Preserve both independently verified sources if that branch advances.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/radar-ftp-feed; then exit 0; fi
            echo "FTP archive advanced during IFD calibration; rebasing ($attempt)"
            git fetch --depth=20 origin radar-ftp-feed
            git rebase FETCH_HEAD
            sleep 2
          done
          echo "Unable to publish validated IFD grid without overwriting FTP archive" >&2
          exit 1
