name: One-shot BoM source health 2026-10-19
on:
  push:
    branches: [diagnostics/bom-webgl-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check diagnostic modules
        run: |
          node --check scripts/one-shot-bom-health-20261019.mjs
          node --check frontend/src/dev-webgl-lifecycle-probe-20261019.js
          node scripts/test-bom-diagnostic-fallback-20261019.mjs
      - name: Probe anonymous FTP directly (read only)
        continue-on-error: true
        run: |
          curl --max-time 12 --disable-epsv -v 'ftp://ftp.bom.gov.au/anon/gen/radar/' -o /tmp/bom-ftp-listing.txt 2>&1 | tail -25
          head -c 500 /tmp/bom-ftp-listing.txt || true
      - name: One-shot relay and WMTS health verification
        run: node scripts/one-shot-bom-health-20261019.mjs
      - name: Install isolated browser profiler
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - name: Profile sealed StormTracker WebGL
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/one-shot-webgl-browser-profile-20261019.mjs
      - name: Examine real FTP reflectivity images
        timeout-minutes: 2
        run: |
          python -m pip install pillow
          python scripts/one-shot-ftp-reflectivity-audit-20261019.py
