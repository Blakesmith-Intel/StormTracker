name: Deploy StormTracker Relay V9.12

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v9.12-flood-gauges
    paths:
      - "relay/**"
      - "frontend/src/context-layers/river-height-bulletin-v1.js"
      - "frontend/tests/run-river-height-bulletin-v1-tests.mjs"
      - "frontend/tests/run-river-height-relay-v1-tests.mjs"
      - ".github/workflows/deploy-relay-v9-12.yml"

permissions:
  contents: read

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate StormTracker regression suite
        run: |
          npm test
          node --check relay/worker.js

      - name: Deploy stormtracker-bom-relay
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy

      - name: Smoke-test river-height relay
        run: |
          set -euo pipefail
          url="https://stormtracker-bom-relay.stormtracker-bom-relay.workers.dev/river-height-bulletins"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$url" -o /tmp/river-heights.json; then
              if python - <<'PY'
import json

with open("/tmp/river-heights.json", "r", encoding="utf-8") as handle:
    payload = json.load(handle)

assert payload.get("format") == "StormTrackerRiverHeightBulletinsV1"
products = payload.get("products") or []
assert products, "No BoM river-height products were parsed."
observations = sum(len(item.get("observations") or []) for item in products)
assert observations > 0, "No live river-height observations were parsed."

print(
    f"River-height relay returned {len(products)} product(s), "
    f"{observations} observation(s), partial={payload.get('partial')}."
)
PY
              then
                exit 0
              fi
            fi

            sleep 3
          done

          echo "River-height relay smoke test failed."
          head -c 1000 /tmp/river-heights.json 2>/dev/null || true
          exit 1
