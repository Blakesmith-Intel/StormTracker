name: Validate playback and motion-cone fixes

on:
  push:
    branches:
      - fix/v9.16.10-playback-cone-performance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate source syntax and full frontend regression suite
        run: npm test
      - name: Validate relay syntax (no relay changes)
        run: node --check relay/worker.js
