name: V10 AURA historical evidence audit
on:
  push:
    branches: [feature/v10-severe-weather-candidates]
    paths: ['.github/workflows/v10-aura-evidence.yml']
  workflow_dispatch:
    inputs:
      event:
        description: Historical event / radar
        required: true
        type: choice
        options:
          - gympie-2025
          - goldcoast-2023
          - marburg-2023
      target_utc:
        description: "Event UTC time (HH:MM); default 04:00 Gympie / 10:30 Gold Coast"
        required: false
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        event: [goldcoast-2023, marburg-2023]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline scientific reader
        run: python -m pip install 'requests>=2.31,<3' 'h5py>=3.10,<4' 'numpy>=1.26,<3'
      - name: Attempt streamed measured archive retrieval and ODIM audit
        run: |
          event='${{ inputs.event || matrix.event }}'
          target='${{ inputs.target_utc || '' }}'
          if [ -z "$target" ]; then
            if [ "$event" = "gympie-2025" ]; then target="04:00"; else target="10:30"; fi
          fi
          python scripts/aura-v10-volume-audit.py --event "$event" --target-utc "$target" --max-files 3 --output aura-evidence
      - name: Preserve machine-readable findings even on access failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-${{ matrix.event }}-audit
          path: aura-evidence/*.json
          if-no-files-found: warn
