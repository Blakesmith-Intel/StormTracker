name: Acceptance — FTP-first V10 operational browser
on:
  push:
    branches: [release/ftp-first-v10-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
      - uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
      - uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
      - name: Full repo regression and production package dry-run
        run: |
          npm test
          node --check relay/worker.js
          node --check frontend/src/ftp-reflectivity-operational-v1.js
          bash scripts/build-current-site.sh
          test -f _site/src/ftp-reflectivity-operational-v1.js
          grep -Fq '__STORMTRACKER_FTP_FIRST=true' _site/index.html
          grep -Fq 'ftp-first-v10-20261019' _site/src/live3d-operational-v9.js
      - name: Install browser and dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - name: Run real FTP-first operational source in Chromium
        run: |
          echo '<!doctype html><meta charset="utf-8"><p>FTP-first source QA</p>' > _site/ftp-smoke.html
          python -m http.server 8137 --bind 127.0.0.1 --directory _site > /tmp/ftp-smoke-http.log 2>&1 &
          node scripts/test-ftp-first-operational-browser-v1.mjs
