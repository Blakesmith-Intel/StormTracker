name: QA browser reads direct unmodified FTP reflectivity PNGs
on:
  push:
    branches: [release/ftp-static-archive-aep-v10-20261019]
    paths:
      - scripts/test-direct-ftp-feed-public-browser-v1.mjs
      - .github/workflows/qa-direct-ftp-feed-browser-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - run: node scripts/test-direct-ftp-feed-public-browser-v1.mjs
