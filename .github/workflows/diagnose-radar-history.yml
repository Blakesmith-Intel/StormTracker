name: Diagnose radar history source

on:
  push:
    branches: ["feature/three-hour-radar-history"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WMTS and raw Mt Stapylton reflectivity history
        run: |
          node <<'NODE'
          const relay = "https://stormtracker-bom-relay.stormtracker-bom-relay.workers.dev/wmts";
          const now = Date.now();
          const floor5 = Math.floor(now / 300000) * 300000;
          const newestCandidate = floor5 - 10 * 60000;
          const wmts = [];
          for (let i = 0; i < 43; i++) {
            const epoch = newestCandidate - i * 5 * 60000;
            const observedUtc = new Date(epoch).toISOString().replace(".000Z","Z");
            const params = new URLSearchParams({
              SERVICE:"WMTS", REQUEST:"GetTile", VERSION:"1.0.0",
              LAYER:"atm_surf_air_precip_reflectivity_dbz",
              STYLE:"default", FORMAT:"image/png",
              TILEMATRIXSET:"GoogleMapsCompatible_BoM",
              TILEMATRIX:"8", TILEROW:"15", TILECOL:"34",
              time:observedUtc
            });
            const response = await fetch(relay + "?" + params.toString(), {headers:{Accept:"image/png"}});
            const bytes = new Uint8Array(await response.arrayBuffer());
            const png = bytes.length >= 8 && bytes[0]===137 && bytes[1]===80 && bytes[2]===78 && bytes[3]===71;
            wmts.push({observedUtc,ageMinutes:i*5+10,status:response.status,png,bytes:bytes.length});
          }
          const wmtsGood = wmts.filter(x=>x.status===200&&x.png);
          console.log("WMTS_SUMMARY",JSON.stringify({
            readableCount:wmtsGood.length,
            newest:wmtsGood[0]?.observedUtc??null,
            oldest:wmtsGood.at(-1)?.observedUtc??null,
            oldestAgeMinutes:wmtsGood.at(-1)?.ageMinutes??null,
            readableAgesMinutes:wmtsGood.map(x=>x.ageMinutes)
          }));

          for (const cadence of [5,6,10]) {
            const rows=[];
            const base=Math.floor(now/(cadence*60000))*(cadence*60000);
            for(let i=0;i<=Math.ceil(210/cadence);i++){
              const epoch=base-i*cadence*60000;
              const d=new Date(epoch);
              const stamp=
                d.getUTCFullYear().toString()+
                String(d.getUTCMonth()+1).padStart(2,"0")+
                String(d.getUTCDate()).padStart(2,"0")+
                String(d.getUTCHours()).padStart(2,"0")+
                String(d.getUTCMinutes()).padStart(2,"0");
              const host = cadence===6 ? "https://ftp.bom.gov.au/anon/gen/radar/" : "https://www.bom.gov.au/radar/";
              const url=host+"IDR663.T."+stamp+".png";
              const response=await fetch(url,{redirect:"manual",headers:{Accept:"image/png","User-Agent":"StormTracker-source-diagnostic"}});
              const bytes=new Uint8Array(await response.arrayBuffer());
              const png=bytes.length>=8&&bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71;
              if(response.status===200&&png) rows.push({stamp,ageMinutes:i*cadence,bytes:bytes.length});
            }
            console.log("RAW663",cadence,JSON.stringify(rows));
          }
          NODE
