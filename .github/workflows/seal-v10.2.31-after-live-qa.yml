name: Seal V10.2.31 after live warning source acceptance
on:
  push:
    branches: [qa/v10.2.31-boM-current-status-live-20261030]
    paths: [.github/workflows/seal-v10.2.31-after-live-qa.yml]
permissions: {contents: write}
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Confirm deployed release, prior baseline, and create NEW recovery refs
        env:
          GH_TOKEN: ${{ secrets.STORMTRACKER_RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="42859b72b8d0dc21ea888bcb8cc196de7fdc6b2e"
          current="$(git ls-remote origin 'refs/heads/main' | cut -f1)"
          test "$current" = "$release_sha" || { echo "Main moved; refuse to tag different version"; exit 1; }
          git fetch origin "$release_sha" --quiet
          git cat-file -e "$release_sha:docs/RELEASE_NOTES_V10.2.31.md"
          old_restore="$(git ls-remote origin 'refs/heads/restore/v10.2.30' | cut -f1)"
          old_tag="$(git ls-remote origin 'refs/tags/v10.2.30^{}' | cut -f1)"
          test -n "$old_tag" && test "$old_tag" = "$old_restore" || exit 1
          existing_tag="$(git ls-remote origin 'refs/tags/v10.2.31^{}' | cut -f1)"
          existing_restore="$(git ls-remote origin 'refs/heads/restore/v10.2.31' | cut -f1)"
          test -z "$existing_tag" || test "$existing_tag" = "$release_sha"
          test -z "$existing_restore" || test "$existing_restore" = "$release_sha"
          if [ -z "$existing_restore" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/restore/v10.2.31" -f sha="$release_sha" >/dev/null
          fi
          if [ -z "$existing_tag" ]; then
            tag_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="v10.2.31" -f object="$release_sha" -f type="commit" \
              -f message="V10.2.31 verified BoM Queensland per-product negative status and truthful heavy rainfall terms; prior V10.2.30 immutable" --jq .sha)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/v10.2.31" -f sha="$tag_sha" >/dev/null
          fi
          test "$(git ls-remote origin 'refs/tags/v10.2.31^{}' | cut -f1)" = "$release_sha"
          test "$(git ls-remote origin 'refs/heads/restore/v10.2.31' | cut -f1)" = "$release_sha"
          echo "SEALED v10.2.31 and restore/v10.2.31 at $release_sha; V10.2.30 unchanged."
