          grep -Fq 'minimal-dish-v4' <<< "$html"
          intake="$(retry_curl "$base/preview/volume-dbz/src/bom-doppler-intake-v3.js")"
          grep -Fq 'stormtracker-bom-relay-nsw-preview' <<< "$intake"
          script="$(retry_curl "$base/preview/volume-dbz/src/volumetric-visual-v2.js")"
          grep -Fq 'reflectivityLegendBands' <<< "$script"
          demo="$(retry_curl "$base/previews/volumetric-v2.html")"
          grep -Fq 'value="1.0"' <<< "$demo"
          production="$(retry_curl "$base/BUILD.txt")"
          grep -Fq '60d6750be2d335858dac485a5312a55693e40c74' <<< "$production"
          echo "Isolated BoM dBZ volume preview is public; pinned production unchanged."

      - name: Verify V9.17.0 publicly served production root
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          retry_curl() { curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors "$1"; }
          build="$(retry_curl "$base/BUILD.txt")"
