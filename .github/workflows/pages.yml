name: Deploy StormTracker — sealed V10.2.0 production and historical QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stormtracker-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout maintenance source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate repository and relay
        run: |
          set -euo pipefail
          npm test
          node --check relay/worker.js

      - name: Checkout accepted diagnostic source
        uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
          persist-credentials: false

      - name: Validate accepted diagnostic source
        run: |
          set -euo pipefail
          (cd checked/accepted-v9.18 && npm test)
          node --check checked/accepted-v9.18/relay/worker.js
          test "$(git -C checked/accepted-v9.18 rev-parse HEAD)" = "acfa0ebd3717a793369e3e887e2d1a54785620b7"

      - name: Checkout retained V9.19.0 rollback source
        uses: actions/checkout@v4
        with:
          ref: d317c17a6a8f706a0d867cb852db1e8d3f9ffac0
          path: checked/production-v9.19.0
          persist-credentials: false

      - name: Validate retained V9.19.0 rollback source
        run: |
          set -euo pipefail
          (cd checked/production-v9.19.0 && npm test)
          node --check checked/production-v9.19.0/relay/worker.js
          test "$(git -C checked/production-v9.19.0 rev-parse HEAD)" = "d317c17a6a8f706a0d867cb852db1e8d3f9ffac0"
          test -f checked/production-v9.19.0/docs/HANDOVER_V9.19.0.md
          test -f checked/production-v9.19.0/docs/USER_GUIDE_V9.19.0.md
          test -f checked/production-v9.19.0/docs/RELEASE_NOTES_V9.19.0.md
          grep -Fq 'PUBLISHED_PRODUCTION_RUNTIME' checked/production-v9.19.0/frontend/src/live3d-operational-v9.js

      - name: Checkout approved V9.20.2 production source
        uses: actions/checkout@v4
        with:
          ref: b8be458acbae942a3bb0b530a5c17618b6d03134
          path: checked/production-v9.20.2
          persist-credentials: false

      - name: Validate exact immutable V9.20.2 production source
        run: |
          set -euo pipefail
          (cd checked/production-v9.20.2 && npm test)
          node --check checked/production-v9.20.2/relay/worker.js
          test "$(git -C checked/production-v9.20.2 rev-parse HEAD)" = "b8be458acbae942a3bb0b530a5c17618b6d03134"
          test -f checked/production-v9.20.2/docs/HANDOVER_V9.20.2.md
          test -f checked/production-v9.20.2/docs/USER_GUIDE_V9.20.2.md
          test -f checked/production-v9.20.2/docs/RELEASE_NOTES_V9.20.2.md
          grep -Fq 'const INCREMENTAL_VOLUME_PREVIEW =' checked/production-v9.20.2/frontend/src/live3d-operational-v9.js
          grep -Fq 'incrementalVolumeRenderer.upsert(pixelIndex,category,nextSpecs' checked/production-v9.20.2/frontend/src/live3d-operational-v9.js
          grep -Fq 'createResponsiveMemoryDiagnostics' checked/production-v9.20.2/frontend/src/live3d-operational-v9.js
          grep -Fq 'Memory diagnostics' checked/production-v9.20.2/frontend/src/responsive-memory-diagnostics-v1.js
          grep -Fq 'GLOBAL_SATELLITE_FALLBACK' checked/production-v9.20.2/frontend/src/context-layers/basemap-manager-v1.js
          grep -Fq 'global-satellite-blue-gap-20261016-v1' checked/production-v9.20.2/frontend/src/live3d-operational-v9.js
          grep -Fq 'satellite-blue-gap-qa-v1' checked/production-v9.20.2/frontend/index.html
          grep -Fq 'v9.20.0-optimised-3d-prod' checked/production-v9.20.2/frontend/live3d-operational-v9.html
          grep -Fq 'v9.20.1-secondary-3d-fix' checked/production-v9.20.2/frontend/live3d-operational-v9.html
          grep -Fq 'selectSupplementalVolumeSampleIndices' checked/production-v9.20.2/frontend/src/supplemental-radar-volume-v1.js
          grep -Fq 'hashSupplementalPixel' checked/production-v9.20.2/frontend/src/supplemental-volume-sampling-v1.js

      - name: Checkout exact V10.2.0 accepted UI + multi-site Doppler source
        uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
          persist-credentials: false
      - name: Validate exact immutable V10.2.0 release candidate
        run: |
          set -euo pipefail
          test "$(git -C checked/production-v10.2.0 rev-parse HEAD)" = "047b3bd1c66b0ed5f070d2298202f46d0cd8dae2"
          (cd checked/production-v10.2.0 && npm test)
          node --check checked/production-v10.2.0/relay/worker.js
          node --check checked/production-v10.2.0/frontend/src/multi-doppler-display-v1.js
          grep -Fq 'createSupplementalDopplerDisplay' checked/production-v10.2.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'id="multiRadarDopplerStatus"' checked/production-v10.2.0/frontend/live3d-operational-v9.html
          grep -Fq 'body class="simple-ui"' checked/production-v10.2.0/frontend/live3d-operational-v9.html
          test -f checked/production-v10.2.0/frontend/tests/run-multi-native-doppler-v1-tests.mjs
          grep -Fq 'body.simple-ui #app.sidebar-collapsed' checked/production-v10.2.0/frontend/src/single-interface-v1.css
          grep -Fq 'full-map-controls-gauge-severity-v4' checked/production-v10.2.0/frontend/live3d-operational-v9.html
          grep -Fq 'hide-controls-full-map-v1' checked/production-v10.2.0/frontend/index.html
          grep -Fq 'supplementalDopplerDisplay.prepare(source.observedUtc)' checked/production-v10.2.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'supplementalDopplerDisplay.commit(source.observedUtc)' checked/production-v10.2.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'function commit(utc)' checked/production-v10.2.0/frontend/src/multi-doppler-display-v1.js
          grep -Fq 'SECONDARY_WIND_FRAME_SYNC_WAIT_MS=350' checked/production-v10.2.0/frontend/src/multi-doppler-display-v1.js
          grep -Fq 'IDR93I' checked/production-v10.2.0/frontend/src/border-radar-sites-v1.js
          grep -Fq 'stormtracker-bom-relay.stormtracker-bom-relay.workers.dev' checked/production-v10.2.0/frontend/src/bom-doppler-intake-v3.js
          grep -Fq 'id="openCycloneForecastQa"' checked/production-v10.2.0/frontend/live3d-operational-v9.html
          grep -Fq 'createInternalCycloneLiveQA' checked/production-v10.2.0/frontend/src/live3d-operational-v9.js
          grep -Fq 'Currently no tropical cyclone warnings' checked/production-v10.2.0/frontend/src/internal-cyclone-live-qa-v1.js

      # QA is an independently pinned third preview. Never change the V10.2.0
      # production source, nor the two existing diagnostic QA subpaths.
      - name: Checkout isolated V10.3 wind-hook scientific QA source
        uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
          persist-credentials: false

      - name: Verify scientific QA tests and immutable preview source
        run: |
          set -euo pipefail
          test "$(git -C checked/wind-hook-v10.3-qa rev-parse HEAD)" = "f3a07688ca02f5f0234ae6425fc1177722518c53"
          (cd checked/wind-hook-v10.3-qa && npm test)
          node --check checked/wind-hook-v10.3-qa/frontend/src/severe-storm-v10.js
          node --check checked/wind-hook-v10.3-qa/frontend/src/doppler-persistence-v10-3.js
          test -f checked/wind-hook-v10.3-qa/frontend/tests/run-doppler-persistence-v10-3-tests.mjs
          node --check checked/wind-hook-v10.3-qa/frontend/src/live3d-operational-v9.js
          grep -Fq 'wind-hook-v10-3/' checked/wind-hook-v10.3-qa/frontend/src/live3d-operational-v9.js
          grep -Fq 'const onCycloneQaPreview' checked/wind-hook-v10.3-qa/frontend/src/live3d-operational-v9.js

      - name: Verify historical V9.18.0 rollback source is immutable
        run: |
          set -euo pipefail
          tag_commit="$(git ls-remote origin refs/tags/v9.18.0 | cut -f1)"
          branch_commit="$(git ls-remote origin refs/heads/restore/v9.18.0 | cut -f1)"
          test "$tag_commit" = "66d3da447ef7a4df53e7df49aa1ac06f86cb5afd"
          test "$branch_commit" = "66d3da447ef7a4df53e7df49aa1ac06f86cb5afd"

      - name: Verify V9.19.0 immediate rollback references remain untouched
        run: |
          set -euo pipefail
          tag_peeled="$(git ls-remote origin 'refs/tags/v9.19.0^{}' | cut -f1)"
          branch="$(git ls-remote origin refs/heads/restore/v9.19.0 | cut -f1)"
          test "$tag_peeled" = "d317c17a6a8f706a0d867cb852db1e8d3f9ffac0"
          test "$branch" = "d317c17a6a8f706a0d867cb852db1e8d3f9ffac0"

      - name: Verify sealed V9.20.0 fallback before cutover
        run: |
          set -euo pipefail
          test "$(git ls-remote origin 'refs/tags/v9.20.0^{}' | cut -f1)" = "aba409fd1609e7bf7be6bf3c098b7fb6a14d89d1"
          test "$(git ls-remote origin refs/heads/restore/v9.20.0 | cut -f1)" = "aba409fd1609e7bf7be6bf3c098b7fb6a14d89d1"

      - name: Verify V9.20.1 rollback references remain untouched
        run: |
          set -euo pipefail
          test "$(git ls-remote origin 'refs/tags/v9.20.1^{}' | cut -f1)" = "efaceb59427f0b71859b15a61a6758a80d08547e"
          test "$(git ls-remote origin refs/heads/restore/v9.20.1 | cut -f1)" = "efaceb59427f0b71859b15a61a6758a80d08547e"

      - name: Build pinned V10.2.0 production and preserved diagnostic QA
        run: bash scripts/build-current-site.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload supported site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy supported site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published V10.2.0 source and existing historical QA
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          root="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/BUILD.txt")"
          preview="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/preview/radar-history-fix/BUILD.txt")"
          grep -Fq 'SEALED StormTracker V10.2.0 source 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2' <<< "$root"
          grep -Fq 'RIVER-HISTORY MAINTENANCE HOTFIX 2026-10-18' <<< "$root"
          grep -Fq 'RIVER-HISTORY NO-DATA V2 2026-10-18' <<< "$root"
          grep -Fq 'OPTIONAL RIVER HISTORY 503 MITIGATION 2026-10-18' <<< "$root"
          history_source="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/context-layers/bom-recent-river-history-v1.js")"
          grep -Fq 'if(explicitlyTidal)return null' <<< "$history_source"
          grep -Fq 'if(!classified && !inland)return null' <<< "$history_source"
          gauge_source="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/context-layers/river-gauge-layer-v1.js")"
          grep -Fq '.slice(0,4)' <<< "$gauge_source"
          grep -Fq 'TERRAIN-SAFE OUTAGE POLYGONS 2026-10-18' <<< "$root"
          grep -Fq 'MANUAL FLOOD GAUGE REFRESH 2026-10-18' <<< "$root"
          grep -Fq 'BOUNDED STREAMING BOM RIVER TABLES 2026-10-18' <<< "$root"
          grep -Fq 'BOM ALL-GAUGE FLOOD PERSISTENCE ID-ONLY JOIN' <<< "$root"
          grep -Fq 'BOM TIDAL FALSE FLASH-RISE SUPPRESSION 2026-10-18' <<< "$root"
          grep -Fq 'MATCHING FLOOD GAUGE INFORMATION PANEL ICONS AND SEVERITY 2026-10-18' <<< "$root"
          grep -Fq 'STATEWIDE TIDAL REFERENCE RAPID-RISE THRESHOLD 1.40 M_PER_H 2026-10-18' <<< "$root"
          info_js="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/context-layers/river-gauges-operational-v1.js")"
          grep -Fq 'icon.src=appearance.image' <<< "$info_js"
          grep -Fq 'summary.tidalScreened' <<< "$info_js"
          info_css="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/single-interface-v1.css")"
          grep -Fq '#riverGaugeInfo .river-gauge-key img' <<< "$info_css"
          grep -Fq '#riverGaugeInfo[data-gauge-state="major"] .map-info-kicker' <<< "$info_css"
          source_signal="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/context-layers/river-flood-signals-v1.js")"
          grep -Fq 'observedTidalOscillation(' <<< "$source_signal"
          grep -Fq 'rateMatches && !tidal' <<< "$source_signal"
          grep -Fq 'recentTidalReversal(' <<< "$source_signal"
          grep -Fq 'NON_TIDAL_RAPID_RISE_M_PER_H = 0.30' <<< "$source_signal"
          grep -Fq 'COASTAL_UNCERTAIN_RAPID_RISE_M_PER_H = 1.40' <<< "$source_signal"
          grep -Fq 'gaugeRiseScreeningZone(' <<< "$source_signal"
          coastal_source="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/context-layers/river-gauge-coastal-screen-v1.js")"
          grep -Fq 'INLAND_COAST_BUFFER_KM = 125' <<< "$coastal_source"
          grep -Fq 'INLAND RAPID RISE 0.30 M_PER_H COASTAL 1.40 M_PER_H 125 KM' <<< "$root"
          # Public-site acceptance: strict source-ID join, live BoM severity,
          # separate measured rise badge, existing cyclone & radar untouched.
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/river-gauge-observations-v1.js" \
            | grep -F 'const feature = idKey ? byId.get(idKey) : null' >/dev/null
          if curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
              "$base/src/context-layers/river-gauge-observations-v1.js" | grep -Fq 'uniqueNameIndex'; then
            echo "ERROR: name fallback still shipped in production river gauges" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/river-flood-events-v1.js" \
            | grep -F 'STORMTRACKER_RAPID_RISE' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/river-gauge-layer-v1.js" \
            | grep -F 'FLOOD_MARKER_COLORS' >/dev/null
          grep -Fq 'Rapid rise below minor' <<< "$(curl --fail --silent --show-error --location "$base/live3d-operational-v9.html")"

          grep -Fq 'PRODUCTION ACTIVE-ONLY CYCLONES 2026-10-18' <<< "$root"
          # A sealed operational site must never show Jasper/Alfred/Fina test
          # fixtures or import obsolete archived cyclone science modules.
          app_js="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/src/live3d-operational-v9.js")"
          active_html="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/live3d-operational-v9.html")"
          grep -Fq 'createOperationalCyclonePanel' <<< "$app_js"
          grep -Fq 'createInternalCycloneLiveQA' <<< "$app_js"
          ! grep -Fq 'createHistoricalCycloneForecastQA' <<< "$app_js"
          grep -Fq 'Current BoM tropical cyclone forecasts' <<< "$active_html"
          ! grep -Fq 'cycloneUseJasper' <<< "$active_html"
          ! grep -Fq 'cycloneUseAlfred' <<< "$active_html"
          ! grep -Fq 'cycloneGmlFile' <<< "$active_html"
          ! grep -Fq 'Reference case: Fina' <<< "$active_html"
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/operational-cyclone-panel-v1.js" | grep -F 'createOperationalCyclonePanel' >/dev/null
          # The historical module must not be served in the operational root;
          # it remains under the deliberately separate preview namespaces.
          if curl --fail --silent --show-error --location --max-time 15 \
              "$base/src/historical-cyclone-forecast-map-v1.js" >/dev/null; then
            echo "ERROR: archived cyclone viewer is still publicly served in production" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/index.html" | grep -F 'river-large-table-stream-v1-20261018' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/bom-recent-river-history-v1.js" | grep -F 'source_response_too_large' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/live3d-operational-v9.html" | grep -F 'id="refreshRiverGaugesButton"' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/river-gauges-operational-v1.js" | grep -F 'bindRiverGaugeManualRefresh(' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/single-interface-v1.css" | grep -F 'body.simple-ui #controlSidebar #refreshRiverGaugesButton' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/index.html" | grep -F 'flood-gauge-refresh-v1-20261018' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/power-outages-v1.js" | grep -F 'styleTerrainClampedPowerOutagePolygon(entity.polygon,unplannedColour)' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/power-outages-operational-v1.js" | grep -F 'terrain-outline-v1-20261018' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/river-gauge-layer-v1.js" | grep -F 'noData++' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/bom-recent-river-history-v1.js" | grep -F 'inspectBomRecentWaterLevelTable' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/index.html" | grep -F 'river-history-nodata-v2-20261018' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/river-gauge-layer-v1.js" | grep -F 'recentNextAttemptAt' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/bom-recent-river-history-v1.js" | grep -F 'recentFloodHistoryGap' >/dev/null
          grep -Fq 'acfa0ebd3717a793369e3e887e2d1a54785620b7' <<< "$preview"
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/preview/radar-history-fix/src/supplemental-radar-volume-v1.js" \
            | grep -F 'SUPPLEMENTAL_VOLUME_MAX_GLYPHS=1500' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/live3d-operational-v9.js" | grep -F 'PUBLISHED_PRODUCTION_RUNTIME' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/adaptive-threat-cone-v1.js" | grep -F 'credibleMeasuredMotionAtObservation' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/supplemental-observed-anchor-v1.js" | grep -F 'shouldPrepareSupplementalForPlayback' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/live3d-operational-v9.html" | grep -F 'trackLabelsScopeNote' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/src/context-layers/river-gauge-layer-v1.js" | grep -F '"#e53935"' >/dev/null
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/data/nsw-radar-places-v1.json" | grep -F 'StormTrackerNSWRadarPlacesV1' >/dev/null
          preview_marker="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/preview/incremental-3d/BUILD.txt")"
          grep -Fq 'EXPERIMENTAL incremental 3-D QA' <<< "$preview_marker"
          preview_engine="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/preview/incremental-3d/src/incremental-volume-renderer-v1.js")"
          grep -Fq 'createIncrementalVolumeRenderer' <<< "$preview_engine"
          # A publicly hosted EXPERIMENTAL QA route, not active BoM warning
          # service. Live operational app remains exactly pinned to V10.2.0.
          wind_preview="$(curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors "$base/preview/wind-hook-v10-3/BUILD.txt")"
          grep -Fq 'EXPERIMENTAL V10.3 wind-hook original radar QA source f3a07688ca02f5f0234ae6425fc1177722518c53' <<< "$wind_preview"
          grep -Fq 'production sealed V10.2.0 untouched' <<< "$wind_preview"
          curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
            "$base/preview/wind-hook-v10-3/src/live3d-operational-v9.js" \
            | grep -F 'syncIndependentDopplerResearch' >/dev/null
