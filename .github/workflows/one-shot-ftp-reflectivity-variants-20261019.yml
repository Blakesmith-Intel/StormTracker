name: One-shot BoM reflectivity variant validation
on:
  push:
    branches: [diagnostics/bom-webgl-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - run: python scripts/one-shot-ftp-reflectivity-variants-20261019.py
