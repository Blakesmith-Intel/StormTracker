name: Audit official severe-weather CAP polygon feeds
on:
  push:
    branches: [feature/official-thunderstorm-geometry-source-audit-20261016]
    paths:
      - scripts/audit-official-thunderstorm-cap-polygon-feeds.mjs
      - .github/workflows/audit-official-thunderstorm-cap.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Read current public feed format only, never publish warning contents
        run: node scripts/audit-official-thunderstorm-cap-polygon-feeds.mjs
