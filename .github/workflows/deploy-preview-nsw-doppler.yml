name: Deploy isolated Brewarrina Doppler preview relay

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-preview-nsw-doppler.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-brewarrina-preview-relay
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CI-validated isolated NSW branch
        uses: actions/checkout@v4
        with:
          ref: 2f72c22d0382fb85bfbacb2070979d822c21d168
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Confirm isolated Worker name and run all regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2f72c22d0382fb85bfbacb2070979d822c21d168"
          npm test
          node --check relay/worker.js
          node -e 'const c=JSON.parse(require("node:fs").readFileSync("./relay/wrangler-nsw-preview.jsonc","utf8")); if(c.name!=="stormtracker-bom-relay-nsw-preview"||c.main!=="worker.js")throw new Error("Unsafe deployment configuration")'
          grep -Fq '"93":"IDR93I"' frontend/src/border-radar-sites-v1.js
          ! grep -Fq '"53":"IDR53I"' frontend/src/border-radar-sites-v1.js
          ! grep -Fq '"28":"IDR28I"' frontend/src/border-radar-sites-v1.js
      - name: Deploy new isolated NSW preview Worker (NOT production relay)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy --config wrangler-nsw-preview.jsonc
      - name: Verify Brewarrina Doppler, reject unrelated NSW radar products
        shell: bash
        run: |
          set -euo pipefail
          base="https://stormtracker-bom-relay-nsw-preview.stormtracker-bom-relay.workers.dev"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors \
            --header 'Origin: https://blakesmith-intel.github.io' \
            "$base/radar-history?product=IDR93I" -o /tmp/brewarrina-history.json
          node -e 'const p=require("/tmp/brewarrina-history.json"); if(p.format!=="StormTrackerDopplerHistoryV1"||p.product!=="IDR93I"||!Array.isArray(p.frames)||p.frames.length<1)throw new Error("Brewarrina native frames unavailable");console.log("Brewarrina source frames:",p.frames.length)'
          for disallowed in IDR53I IDR28I IDR94I; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "$base/radar-history?product=$disallowed")"
            test "$code" = 403 || { echo "Unexpected allowance for $disallowed ($code)"; exit 1; }
          done
          echo 'Isolated Brewarrina Doppler preview deployed and verified; existing production Worker untouched.'
