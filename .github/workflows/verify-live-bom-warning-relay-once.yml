name: Verify deployed BoM warning relay once
on:
  push:
    branches:
      - fix/live-idq21033-official-polygon-source-20261028
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/verify-live-bom-warning-relay-once.mjs
