name: Release gate — V10 combined FTP and rainfall AEP
on:
  push:
    branches: [release/ftp-static-archive-aep-v10-20261019]
    paths:
      - scripts/apply-ftp-aep-release-v10.py
      - scripts/test-combined-ftp-aep-operational-browser-v1.mjs
      - scripts/test-ftp-aep-actual-v10-viewer-browser-v1.mjs
      - .github/workflows/qa-ftp-aep-combined-release-v1.yml
      - frontend/src/bom-wmts-loop-v2.js
      - frontend/src/ftp-reflectivity-operational-v1.js
      - frontend/src/context-layers/rainfall-ifd-aep-v1.js
      - frontend/src/context-layers/significant-rainfall-operational-v1.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - name: Validate current source plus published science contracts
        run: |
          npm test
          node --check relay/worker.js
          node --check frontend/src/ftp-reflectivity-operational-v1.js
          node --check frontend/src/bom-wmts-loop-v2.js
          node --check frontend/src/context-layers/significant-rainfall-operational-v1.js
      - uses: actions/checkout@v4
        with:
          ref: acfa0ebd3717a793369e3e887e2d1a54785620b7
          path: checked/accepted-v9.18
      - uses: actions/checkout@v4
        with:
          ref: 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2
          path: checked/production-v10.2.0
      - uses: actions/checkout@v4
        with:
          ref: f3a07688ca02f5f0234ae6425fc1177722518c53
          path: checked/wind-hook-v10.3-qa
      - name: Build exact operational Pages and apply pinned release changes
        run: |
          bash scripts/build-current-site.sh
          python scripts/apply-ftp-aep-release-v10.py
          node --check _site/src/live3d-operational-v9.js
          node --check _site/src/bom-wmts-loop-v2.js
          node --check _site/src/ftp-reflectivity-operational-v1.js
          grep -Fq '__STORMTRACKER_FTP_FIRST=true' _site/live3d-operational-v9.html
          grep -Fq 'ftp-reflectivity-operational-v1.js' _site/src/bom-wmts-loop-v2.js
          grep -Fq 'window.addEventListener("pointerdown",pointerDown' _site/src/context-layers/significant-rainfall-operational-v1.js
      - name: Install headless Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - name: Test true live FTP feed and AEP geography at production origin
        run: |
          echo '<!doctype html><title>FTP AEP QA</title>' > _site/ftp-aep-smoke.html
          python -m http.server 8137 --bind 127.0.0.1 --directory _site >/tmp/ftp-aep-qa-http.log 2>&1 &
          node scripts/test-combined-ftp-aep-operational-browser-v1.mjs
          node scripts/test-ftp-aep-actual-v10-viewer-browser-v1.mjs

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-ftp-aep-production-like-map-browser
          path: /tmp/v10-ftp-aep-cesium-qa.png
          if-no-files-found: warn
