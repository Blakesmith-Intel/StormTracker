name: Validate StormTracker feature branches

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run full frontend regression suite
        run: npm test

      - name: Validate relay worker syntax
        run: node --check relay/worker.js



      - name: Verify genuine-product cyclone GML decoder contracts (offline)
        run: python3 scripts/test-bom-issued-cyclone-decoder.py




      - name: Probe Brewarrina BoM Doppler transport (advisory)
        run: node scripts/probe-brewarrina-wind-source.mjs



      - name: One-shot geographic source audit (advisory)
        run: node scripts/probe-multisite-wmts-20261018.mjs
