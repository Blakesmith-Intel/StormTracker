            'src/live3d-operational-v9.js|supplementalDopplerDisplay.prepare(source.observedUtc)' \
            'src/live3d-operational-v9.js|supplementalDopplerDisplay.commit(source.observedUtc)' \
            'src/multi-doppler-display-v1.js|function commit(utc)' \
            'src/multi-doppler-display-v1.js|SECONDARY_WIND_FRAME_SYNC_WAIT_MS=350' \
            'src/border-radar-sites-v1.js|IDR93I' \
            'src/single-interface-v1.css|body.simple-ui #app.sidebar-collapsed' \
            'live3d-operational-v9.html|full-map-controls-gauge-severity-v4' \
            'index.html|hide-controls-full-map-v1' \
            'live3d-operational-v9.html|multiRadarDopplerStatus' \
            'live3d-operational-v9.html|single-interface-v1.css' \
            'index.html|multisite-native-wind-v1'; do
            path="${component%%|*}"
            needle="${component#*|}"
            curl --fail --silent --show-error --location --retry 7 --retry-delay 2 --retry-all-errors \
              "$base/$path" | grep -F "$needle" >/dev/null
          done
          echo 'Verified sealed V10.2.0 source 047b3bd1c66b0ed5f070d2298202f46d0cd8dae2, single UI, native multi-site BoM Doppler, previous full-quality 3-D, and V9.18 QA.'

  seal:
    name: Seal verified cyclone release references
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source for version/reference verification
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Seal V10.2.0 annotated tag and new rollback branch after public verification
        env:
          GH_TOKEN: ${{ secrets.STORMTRACKER_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          release_sha="047b3bd1c66b0ed5f070d2298202f46d0cd8dae2"
          tag="v10.2.0"
          restore="restore/v10.2.0"
          # Earlier sealed release refs remain immutable and may never be repointed.
          test "$(git ls-remote origin 'refs/tags/v10.1.1^{}' | cut -f1)" = "711d65a72a483b319e80711a09cfeabe2f69bbcd"
          test "$(git ls-remote origin refs/heads/restore/v10.1.1 | cut -f1)" = "711d65a72a483b319e80711a09cfeabe2f69bbcd"
          test "$(git ls-remote origin 'refs/tags/v10.1.0^{}' | cut -f1)" = "11f0012170c4632bd5ef2448bf5671326fdd287e"
          test "$(git ls-remote origin refs/heads/restore/v10.1.0 | cut -f1)" = "11f0012170c4632bd5ef2448bf5671326fdd287e"
          test "$(git ls-remote origin 'refs/tags/v10.0.0^{}' | cut -f1)" = "e3f7f6d007f52e4ca48e103288bc5ffa77fac9b5"
          test "$(git ls-remote origin refs/heads/restore/v10.0.0 | cut -f1)" = "e3f7f6d007f52e4ca48e103288bc5ffa77fac9b5"
          test "$(git ls-remote origin 'refs/tags/v9.20.2^{}' | cut -f1)" = "b8be458acbae942a3bb0b530a5c17618b6d03134"
          test "$(git ls-remote origin refs/heads/restore/v9.20.2 | cut -f1)" = "b8be458acbae942a3bb0b530a5c17618b6d03134"
          test "$(git ls-remote origin 'refs/tags/v9.20.1^{}' | cut -f1)" = "efaceb59427f0b71859b15a61a6758a80d08547e"
          test "$(git ls-remote origin refs/heads/restore/v9.20.1 | cut -f1)" = "efaceb59427f0b71859b15a61a6758a80d08547e"
          test "$(git ls-remote origin 'refs/tags/v9.20.0^{}' | cut -f1)" = "aba409fd1609e7bf7be6bf3c098b7fb6a14d89d1"
          test "$(git ls-remote origin refs/heads/restore/v9.20.0 | cut -f1)" = "aba409fd1609e7bf7be6bf3c098b7fb6a14d89d1"
          test "$(git ls-remote origin 'refs/tags/v9.19.0^{}' | cut -f1)" = "d317c17a6a8f706a0d867cb852db1e8d3f9ffac0"
          test "$(git ls-remote origin refs/heads/restore/v9.19.0 | cut -f1)" = "d317c17a6a8f706a0d867cb852db1e8d3f9ffac0"
          git fetch --no-tags origin "$release_sha"
          current_restore="$(git ls-remote origin "refs/heads/$restore" | cut -f1)"
          if [ -n "$current_restore" ]; then
            test "$current_restore" = "$release_sha"
            echo "Existing $restore is pinned correctly."
          else
            # Git push can be rejected when the source commit contains workflow
            # changes and the runner app has no Workflows write permission.
            # Git Data REST creates a reference without pushing workflow files.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$restore" -f sha="$release_sha" >/dev/null
            echo "Created recovery branch $restore using GitHub Git Data API"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$release_sha"
            echo "Existing release tag points to the sealed V10.2.0 source."
          else
            # Create a real annotated Git tag object and then its ref through
            # the Git Data API. Do not push a Git ref through a checkout token
            # that cannot modify .github/workflows in the pinned source commit.
            tag_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$tag" \
              -f message="StormTracker V10.2.0 — original BoM cyclone forecast interface (17 October 2026)" \
              -f object="$release_sha" -f type="commit" --jq .sha)"
            test -n "$tag_sha"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$tag_sha" >/dev/null
            echo "Created annotated $tag via GitHub Git Data API, object $tag_sha"
          fi
          test "$(git ls-remote origin "refs/heads/$restore" | cut -f1)" = "$release_sha"
          test "$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)" = "$release_sha"
      - name: Seal frozen V10.2.5 rainfall AEP and catchment production baseline
        env:
          GH_TOKEN: ${{ secrets.STORMTRACKER_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          release_sha="$GITHUB_SHA"
          tag="v10.2.5"
