name: Live FTP map and three-frame source QA
on:
  push:
    branches: [diagnostics/bom-webgl-20261019]
permissions:
  contents: read
jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - run: python scripts/test-genuine-ftp-map-3frame-20261019.py
      - run: node scripts/test-ftp-reflectivity-validation-20261019.mjs
      - run: npm test
