name: Validate StormTracker feature branches

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run full frontend regression suite
        run: npm test

      - name: Validate relay worker syntax
        run: node --check relay/worker.js

      - name: Probe official QLD locality LGA service (diagnostic only)
        continue-on-error: true
        run: node scripts/probe-lga-endpoint.mjs
