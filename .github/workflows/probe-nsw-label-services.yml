name: Probe NSW radar-range place-name sources
on:
  push:
    branches: ["fix/nsw-radar-range-place-labels-20261013"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build same-origin NSW radar place snapshot from official point feeds
        run: |
          python scripts/build-nsw-radar-places.py --output /tmp/nsw-radar-places-v1.json
          python - <<'PY'
          import json,collections
          p=json.load(open('/tmp/nsw-radar-places-v1.json'))
          print('SNAPSHOT COUNTS',dict(collections.Counter(x['kind'] for x in p['places'])))
          print('SNAPSHOT BYTES',__import__('os').path.getsize('/tmp/nsw-radar-places-v1.json'))
          for n in ['Brewarrina','Moree','Grafton','Tweed Heads']:
              print('SNAPSHOT ANCHOR',n,[x for x in p['places'] if x['name'].lower()==n.lower()][:2])
          PY
      - name: Check browser origin NSW city/town/village/locality ArcGIS queries
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,collections
          root="https://spatial.industry.nsw.gov.au/arcgis/rest/services/PUBLIC/TopoBaseMap/MapServer"
          sites=[("Brewarrina",146.81,-29.96),("Moree",149.85,-29.50),("Grafton",152.97,-29.62)]
          def read(path,params,limit=30):
            url=root+"/"+str(path)+"/query?"+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={"Origin":"https://blakesmith-intel.github.io","User-Agent":"StormTracker-NSW-Radar-Labels/1.0"})
            with urllib.request.urlopen(req,timeout=limit) as r:
              raw=r.read()
              print("NSW RESPONSE",path,"status",r.status,"CORS",r.headers.get("access-control-allow-origin"),"len",len(raw))
            return json.loads(raw)
          endpoints=[
            ("NSW GNB official names",
              "https://portal.data.nsw.gov.au/arcgis/rest/services/Hosted/GNB_Place_name_Public/FeatureServer/0"),
            ("NSW Spatial Collaboration Suburbs",
              "https://portal.spatial.nsw.gov.au/server/rest/services/NSW_Administrative_Boundaries_Theme/FeatureServer/2")
          ]
          for title,endpoint in endpoints:
            print("ALT SOURCE",title,endpoint)
            for opts in [
              {"f":"json","where":"1=1","returnCountOnly":"true"},
              {"f":"geojson","where":"1=1","outFields":"*",
                "returnGeometry":"true","outSR":"4326","resultRecordCount":"2"},
              {"f":"geojson","where":"1=1",
                "geometry":"148.5,-30.5,151,-28.8","geometryType":"esriGeometryEnvelope",
                "spatialRel":"esriSpatialRelIntersects","inSR":"4326",
                "outFields":"objectid,geographical_name,place_name,designation,locality,status",
                "returnGeometry":"true","outSR":"4326","resultRecordCount":"5"}
            ]:
              q=urllib.parse.urlencode(opts)
              url=endpoint+"/query?"+q
              try:
                request=urllib.request.Request(url,headers={"Origin":"https://blakesmith-intel.github.io","User-Agent":"StormTracker-NSW-Radar-Labels/1.0"})
                with urllib.request.urlopen(request,timeout=25) as response:
                  body=response.read()
                  print("ALT HEADERS",title,"status",response.status,"CORS",response.headers.get("access-control-allow-origin"),"bytes",len(body),"content-type",response.headers.get("content-type"))
                data=json.loads(body)
                print("ALT CONTENT",title,"count",data.get("count"),"error",data.get("error"),"features",str(data.get("features",[]))[:1700])
              except Exception as error:
                print("ALT ERROR",title,repr(error))
          for layer in range(4):
            try:
              count=read(layer,{"where":"generalname IS NOT NULL","returnCountOnly":"true","f":"json"})
              print("NSW TOTAL",layer,count)
              params={"where":"generalname IS NOT NULL","outFields":"objectid,generalname"+(",population,placetype_desc" if layer==1 else ""),
                "returnGeometry":"true","outSR":"4326","resultRecordCount":"3","resultOffset":"0","f":"geojson"}
              result=read(layer,params)
              print("NSW GEOJSON",layer,"keys",list(result),"error",result.get("error"),"examples",str(result.get("features",[]))[:550])
              for name,lon,lat in sites:
                params={"where":"generalname IS NOT NULL","geometry":f"{lon-1.3},{lat-1.15},{lon+1.3},{lat+1.15}",
                  "geometryType":"esriGeometryEnvelope","spatialRel":"esriSpatialRelIntersects",
                  "inSR":"4326","returnCountOnly":"true","f":"json"}
                ct=read(layer,params)
                print("NSW RADAR",layer,name,ct.get("count"),"error",ct.get("error"))
            except Exception as e:
              print("NSW ERROR",layer,repr(e))
          PY
