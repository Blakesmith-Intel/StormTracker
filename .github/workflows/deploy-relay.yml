name: Deploy existing StormTracker Cloudflare relay (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate browser science, source handling and relay
        run: |
          npm test
          node --check relay/worker.js
      - name: Deploy current Cloudflare transport Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy
