name: Analyse real Gympie 2025 storm volumes
on:
  push:
    branches: [feature/severe-storm-radar-alerts-v1]
    paths:
      - .github/workflows/analyse-gympie-2025-volumes.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download real archived HDF5 scan fixture from previous research run
        uses: actions/download-artifact@v4
        with:
          repository: Blakesmith-Intel/StormTracker
          run-id: 37816134728
          github-token: ${{ github.token }}
          name: AURA-Gympie-08-2025-11-24-real-scans
          path: ${{ runner.temp }}/gympie-real-volumes
      - name: Install offline scientific decode libraries
        run: python -m pip install --quiet numpy pillow h5py
      - name: Decode measured lowest-elevation reflectivity and radial velocity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gympie-measured-previews"
          python scripts/summarize-aura-gympie-2025.py \
            "$RUNNER_TEMP/gympie-real-volumes" "$RUNNER_TEMP/gympie-measured-previews"
          ls -lh "$RUNNER_TEMP/gympie-measured-previews" | head -15
          echo "Raw radial velocity is not a surface wind gust, and raw reflectivity is uncorrected."
      - name: Publish measured research preview plots and scan report
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Gympie-2025-measured-reflectivity-doppler
          path: ${{ runner.temp }}/gympie-measured-previews/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
