name: Diagnose live Theresa Creek gauge 535162
on:
  push:
    branches:
      - fix/theresa-creek-exactid-live-discovery-20261024
permissions:
  contents: read
jobs:
  station:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify shared statewide crossing and 535162 regressions
        run: |
          node --check frontend/src/context-layers/river-gauge-layer-v1.js
          node frontend/tests/run-statewide-river-crossing-discovery-v1-tests.mjs
          node frontend/tests/run-river-crossing-map-coverage-v1-tests.mjs
          node frontend/tests/run-flood-recovery-lifecycle-v1-tests.mjs
      - name: Probe exact station across all production sources
        run: node scripts/probe-live-theresa-535162-v1.mjs
