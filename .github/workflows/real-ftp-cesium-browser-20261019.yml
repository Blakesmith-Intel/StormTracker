name: Real Cesium FTP browser acceptance
on:
  push:
    branches: [diagnostics/bom-webgl-20261019]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Retrieve real BoM FTP input frames
        run: |
          python scripts/prepare-live-ftp-volume-fixtures-20261019.py
          cp /tmp/stormtracker-ftp-qa/frames.json frontend/qa-ftp-live/fixtures.json
      - name: Browser dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - name: Headless real-Cesium QA
        run: |
          python -m http.server 8137 --bind 127.0.0.1 > /tmp/storm-qa-http.log 2>&1 &
          node scripts/test-real-ftp-cesium-browser-20261019.mjs
      - name: Screenshot and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftp-real-cesium-browser-screenshot
          path: /tmp/stormtracker-ftp-qa/cesium-real-ftp-final.png
          if-no-files-found: warn
      - run: npm test
