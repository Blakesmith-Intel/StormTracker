name: Deploy StormTracker Relay V9.11

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v9.11-power-outages
    paths:
      - "relay/**"
      - "frontend/src/context-layers/power-outages-v1.js"
      - "frontend/src/context-layers/essential-energy-kml-v1.js"
      - "frontend/tests/run-power-outages-v1-tests.mjs"
      - "frontend/tests/run-essential-energy-kml-v1-tests.mjs"
      - ".github/workflows/deploy-relay-v9-11.yml"

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate StormTracker regression suite
        run: |
          npm test
          node --check relay/worker.js

      - name: Deploy stormtracker-bom-relay
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy
