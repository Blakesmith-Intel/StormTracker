name: IDQ21033 live geometry source diagnostic
on:
  push:
    branches:
      - feature/idq21033-live-source-diagnostic-20261030
    paths:
      - .github/workflows/idq21033-source-diagnostic-20261030.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check source records and current official CAP join
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const now=Date.now();
          const capRss='https://severeweather.wmo.int/v2/cap-alerts/au-bom-en/rss.xml';
          const src='https://services1.arcgis.com/vkTwD8kHw2woKBqV/arcgis/rest/services/BOM_Land_Warnings_RO/FeatureServer';
          async function get(url) {
            const r=await fetch(url,{signal:AbortSignal.timeout(15000)});
            const body=await r.text();
            let data; try{data=JSON.parse(body)}catch{}
            return {status:r.status,body,data};
          }
          const rss=await get(capRss);
          const xml=rss.body;
          const itemRe=/<item\b[^>]*>([\s\S]*?)<\/item>/gi;
          const tag=(s,k)=>s.match(new RegExp('<(?:[\\w-]+:)?'+k+'(?:\\s[^>]*)?>([\\s\\S]*?)<\\/(?:[\\w-]+:)?'+k+'>','i'))?.[1]?.trim()||'';
          let items=[...xml.matchAll(itemRe)];
          console.log('RSS',JSON.stringify({http:rss.status,items:items.length,bytes:xml.length,now:new Date(now).toISOString()}));
          const links=[];
          for(const m of items){
            const title=tag(m[1],'title');
            if(!/severe thunderstorm warning/i.test(title))continue;
            const url=tag(m[1],'link');
            if(!url.startsWith('https://severeweather.wmo.int/'))continue;
            links.push({url,title:title.slice(0,120)});
            if(links.length>=40)break;
          }
          console.log('SEVERE_CAP_CANDIDATES',links.length);
          const cap=[];
          await Promise.all(links.map(async x=>{
            try{
              const d=await get(x.url);
              const id=tag(d.body,'identifier');
              if(!/IDQ21033/i.test(id))return;
              const info=tag(d.body,'info');
              const rec={http:d.status,id:id.slice(0,110),sent:tag(d.body,'sent'),expires:tag(info,'expires'),
                event:tag(info,'event'),headline:tag(info,'headline').slice(0,180),
                status:tag(d.body,'status'),msgType:tag(d.body,'msgType'),
                polygons:(d.body.match(/<(?:[\w-]+:)?polygon\s*>/gi)||[]).length};
              cap.push(rec);
            }catch(e){console.log('CAP_FETCH_ERROR',String(e).slice(0,130))}
          }));
          cap.sort((a,b)=>String(b.sent).localeCompare(String(a.sent)));
          console.log('CURRENT_IDQ21033_CAP',JSON.stringify(cap.slice(0,12)));
          for(const [id,code] of [[3,'IDQ65654'],[3,'IDQ65650']]){
            const url=new URL(src+'/'+id+'/query');
            url.searchParams.set('f','geojson');
            url.searchParams.set('where',"product='"+code+"'");
            url.searchParams.set('outFields','product,validfrom_utc,validto_utc,phenomena,OBJECTID,gml_id');
            url.searchParams.set('outSR','4326');
            url.searchParams.set('returnGeometry','true');
            url.searchParams.set('resultRecordCount','500');
            try{
              const r=await get(url);
              console.log('GEOMETRY',JSON.stringify({code,http:r.status,error:r.data?.error,
                type:r.data?.type,features:r.data?.features?.length,
                exceededTransferLimit:r.data?.exceededTransferLimit,
                records:(r.data?.features||[]).slice(0,25).map(f=>({
                  product:f.properties?.product,
                  from:f.properties?.validfrom_utc,
                  to:f.properties?.validto_utc,
                  fromIso:new Date(f.properties?.validfrom_utc).toISOString(),
                  toIso:new Date(f.properties?.validto_utc).toISOString(),
                  type:f.geometry?.type,
                  nCoords:f.geometry?.coordinates?.length
                }))}));
            }catch(e){console.log('GIS_ERROR',code,String(e).slice(0,130))}
          }
          NODE
