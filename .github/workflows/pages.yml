name: Deploy static StormTracker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate current development source
        run: npm test
      - name: Checkout sealed V9.15.1 production source
        uses: actions/checkout@v4
        with:
          # Immutable accepted production reference. Never deploy main/frontend
          # as the production root while experimental branches are under review.
          ref: 7e4315754baae55aa288306cd05ecd39ae22ff75
          path: sealed-production/v9.15.1
          persist-credentials: false
      - name: Verify and test sealed production source
        run: |
          set -euo pipefail
          (cd sealed-production/v9.15.1 && npm test)
          test "$(git -C sealed-production/v9.15.1 rev-parse HEAD)" = "7e4315754baae55aa288306cd05ecd39ae22ff75"
          grep -Fq 'v=9.15.1-intensity40' sealed-production/v9.15.1/frontend/index.html

      # Preview subpaths share the trusted production github.io Origin,
      # so existing Cloudflare relay CORS policies work unchanged.
      - name: Checkout V9.14 candidate
        uses: actions/checkout@v4
        with:
          ref: feature/v9.14.0-source-freshness
          path: preview-builds/v9.14.0
          persist-credentials: false
      - name: Checkout V9.15 candidate
        uses: actions/checkout@v4
        with:
          ref: feature/v9.15.0-qfd-technical-rescue
          path: preview-builds/v9.15.0
          persist-credentials: false
      - name: Checkout V9.15.1 storm-label preview
        uses: actions/checkout@v4
        with:
          ref: feature/v9.15.1-storm-label-foreground
          path: preview-builds/v9.15.1
          persist-credentials: false
      - name: Checkout V9.16 severe radar alerts candidate
        uses: actions/checkout@v4
        with:
          ref: feature/severe-storm-radar-alerts-v1
          path: preview-builds/v9.16
          persist-credentials: false
      - name: Checkout V9.16.11 native Doppler-only candidate
        uses: actions/checkout@v4
        with:
          ref: 96bb19192765c8a07345a08de1600b491840fb5f
          path: preview-builds/v9.16.11
          persist-credentials: false
      - name: Checkout V9.16.10 playback/cone/trail candidate
        uses: actions/checkout@v4
        with:
          ref: f4927fea810833230bce1af65df80ee2e3b59661
          path: preview-builds/v9.16.10
          persist-credentials: false
      - name: Checkout validated native BoM playback review
        uses: actions/checkout@v4
        with:
          # Pin to the exact 88-suite-tested source; later feature pushes cannot
          # silently change this published review build.
          ref: 651b9aaf6780f4efb6a6fada7462483ca20c4ed1
          path: preview-builds/native-playback
          persist-credentials: false
      - name: Checkout isolated playback/cone repair review
        uses: actions/checkout@v4
        with:
          # Exact, immutable PR #57 candidate. Production root stays protected.
          ref: 202c212cd8dc1558b4b8788d01fa71001bc18fdc
          path: preview-builds/playback-cone-fix
          persist-credentials: false
      - name: Download authentic Gympie 2025 measured radar research previews
        uses: actions/download-artifact@v4
        with:
          repository: Blakesmith-Intel/StormTracker
          run-id: 37816421560
          github-token: ${{ github.token }}
          name: AURA-Gympie-2025-measured-reflectivity-doppler
          path: preview-builds/gympie-observations
      - name: Download audited real-event two-scan hook candidate report
        uses: actions/download-artifact@v4
        with:
          repository: Blakesmith-Intel/StormTracker
          run-id: 37817144956
          github-token: ${{ github.token }}
          name: AURA-Gympie-2025-experimental-hook-replay
          path: preview-builds/gympie-hook-audit
      - name: Validate all four candidates independently
        run: |
          (cd preview-builds/v9.14.0 && npm test)
          (cd preview-builds/v9.15.0 && npm test)
          (cd preview-builds/v9.15.1 && npm test)
          (cd preview-builds/v9.16 && npm test)

      - name: Validate V9.16.11 candidate independently
        run: |
          (cd preview-builds/v9.16.11 && npm test)
          test "$(git -C preview-builds/v9.16.11 rev-parse HEAD)" = "96bb19192765c8a07345a08de1600b491840fb5f"
      - name: Validate V9.16.10 candidate independently
        run: |
          (cd preview-builds/v9.16.10 && npm test)
          test "$(git -C preview-builds/v9.16.10 rev-parse HEAD)" = "f4927fea810833230bce1af65df80ee2e3b59661"
      - name: Validate native BoM playback preview independently
        run: |
          (cd preview-builds/native-playback && npm test)
          node --check preview-builds/native-playback/relay/worker.js
          test "$(git -C preview-builds/native-playback rev-parse HEAD)" = "651b9aaf6780f4efb6a6fada7462483ca20c4ed1"

      - name: Validate playback/cone repair in isolation
        run: |
          (cd preview-builds/playback-cone-fix && npm test)
          test "$(git -C preview-builds/playback-cone-fix rev-parse HEAD)" = "202c212cd8dc1558b4b8788d01fa71001bc18fdc"

      - name: Stage isolated live previews without changing production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/preview/v9.14.0 frontend/preview/v9.15.0 frontend/preview/v9.15.1 frontend/preview/v9.16
          mkdir -p frontend/preview/native-playback frontend/preview/v9.16.10 frontend/preview/v9.16.11 frontend/preview/playback-cone-fix
          cp -a preview-builds/playback-cone-fix/frontend/. frontend/preview/playback-cone-fix/
          cp -a preview-builds/v9.14.0/frontend/. frontend/preview/v9.14.0/
          cp -a preview-builds/v9.15.0/frontend/. frontend/preview/v9.15.0/
          cp -a preview-builds/v9.15.1/frontend/. frontend/preview/v9.15.1/
          cp -a preview-builds/v9.16/frontend/. frontend/preview/v9.16/
          cp -a preview-builds/native-playback/frontend/. frontend/preview/native-playback/
          cp -a preview-builds/v9.16.10/frontend/. frontend/preview/v9.16.10/
          cp -a preview-builds/v9.16.11/frontend/. frontend/preview/v9.16.11/
          mkdir -p frontend/preview/v9.16/research-gympie
          cp -a preview-builds/gympie-observations/. frontend/preview/v9.16/research-gympie/
          test -f preview-builds/gympie-hook-audit/gympie-hook-replay.json
          cp preview-builds/gympie-hook-audit/gympie-hook-replay.json frontend/preview/v9.16/research-gympie/gympie-hook-replay.json
          printf 'V9.14.0 candidate %s\n' "$(git -C preview-builds/v9.14.0 rev-parse HEAD)" > frontend/preview/v9.14.0/BUILD.txt
          printf 'V9.15.0 candidate %s\n' "$(git -C preview-builds/v9.15.0 rev-parse HEAD)" > frontend/preview/v9.15.0/BUILD.txt
          printf 'V9.15.1 candidate %s\n' "$(git -C preview-builds/v9.15.1 rev-parse HEAD)" > frontend/preview/v9.15.1/BUILD.txt
          printf 'V9.16 radar alerts candidate %s\n' "$(git -C preview-builds/v9.16 rev-parse HEAD)" > frontend/preview/v9.16/BUILD.txt
          test -f frontend/preview/v9.14.0/src/live3d-operational-v9.js
          test -f frontend/preview/v9.15.0/src/live3d-operational-v9.js
          test -f frontend/preview/v9.15.1/src/storm-track-label-overlay-v1.js
          test -f frontend/preview/v9.16/historical-gympie-v1.html
          test -f frontend/preview/v9.16/research-gympie/scan_meteorology.json
          test -f frontend/preview/v9.16/research-gympie/gympie-hook-replay.json
          grep -q 'StormTrackerExperimentalAURAHookReplayV1' frontend/preview/v9.16/research-gympie/gympie-hook-replay.json
          test -f frontend/preview/v9.16/research-gympie/observed_scan_previews/8_20251124_070000.pvol.png
          test -f frontend/preview/v9.16/src/severe-storm-alerts-v1.js
          test -f frontend/preview/v9.16/src/severe-storm-alert-overlay-v1.js
          test -f frontend/preview/v9.16/tests/run-startup-radar-default-v1-tests.mjs
          grep -q 'value="66" selected>Brisbane (Mt Stapylton)' frontend/preview/v9.16/live3d-operational-v9.html
          grep -q '9.16-window-menu-v2' frontend/preview/v9.16/index.html
          test -f frontend/preview/v9.16/src/operational-window-choices-v1.js
          grep -q 'Radar + Doppler — All available' frontend/preview/v9.16/src/operational-window-choices-v1.js
          test -f frontend/preview/v9.16/tests/run-operational-window-choices-v1-tests.mjs
          test -f frontend/preview/v9.16/src/doppler-available-window-v1.js
          ! grep -q 'id="showDopplerOverlay"' frontend/preview/v9.16/live3d-operational-v9.html
          grep -q 'id="dualSourceTimes"' frontend/preview/v9.16/live3d-operational-v9.html
          grep -q 'id="dopplerPlaybackTime"' frontend/preview/v9.16/live3d-operational-v9.html
          grep -q 'id="sourceTimeGap"' frontend/preview/v9.16/live3d-operational-v9.html
          ! grep -q 'id="dopplerPlayButton"' frontend/preview/v9.16/live3d-operational-v9.html
          test -f frontend/preview/v9.16/src/independent-doppler-loop-v1.js
          printf 'Playback/cone repair review %s\n' "$(git -C preview-builds/playback-cone-fix rev-parse HEAD)" > frontend/preview/playback-cone-fix/BUILD.txt
          test -f frontend/preview/playback-cone-fix/src/combined-loop-playback-v1.js
          test -f frontend/preview/playback-cone-fix/tests/run-playback-stall-cone-v1-tests.mjs
          grep -Fq 'v8-perf-v9-recovery-v10' frontend/preview/playback-cone-fix/index.html
          printf 'V9.16.11 measured Doppler-only preview %s\n' "$(git -C preview-builds/v9.16.11 rev-parse HEAD)" > frontend/preview/v9.16.11/BUILD.txt
          test -f frontend/preview/v9.16.11/src/doppler-layer-transition-v1.js
          grep -Fq 'buildDopplerOnlySchedule(independentDopplerFrames)' frontend/preview/v9.16.11/src/live3d-operational-v9.js
          grep -Fq 'Doppler — All available' frontend/preview/v9.16.11/src/operational-window-choices-v1.js
          printf 'V9.16.10 playback, cone and trail candidate %s\n' "$(git -C preview-builds/v9.16.10 rev-parse HEAD)" > frontend/preview/v9.16.10/BUILD.txt
          test -f frontend/preview/v9.16.10/src/storm-track-trail-visibility-v1.js
          grep -Fq 'setStormTrackTrailVisibility(hybridSource.entities, show)' frontend/preview/v9.16.10/src/live3d-operational-v9.js
          printf 'Native source playback review %s\n' "$(git -C preview-builds/native-playback rev-parse HEAD)" > frontend/preview/native-playback/BUILD.txt
          test -f frontend/preview/native-playback/index.html
          test -f frontend/preview/native-playback/live3d-operational-v9.html
          test -f frontend/preview/native-playback/src/live3d-operational-v9.js
          grep -Fq 'source-native-playback-review-v2' frontend/preview/native-playback/index.html
          grep -Fq 'Native BoM playback review build' frontend/preview/native-playback/live3d-operational-v9.html
          grep -Fq 'dopplerImageryHandover' frontend/preview/native-playback/src/live3d-operational-v9.js
          ! grep -Eq 'createRadarMotionTransition|interpolateRadarFrame\(' frontend/preview/native-playback/src/live3d-operational-v9.js
          git diff --exit-code -- frontend/index.html frontend/live3d-operational-v9.html
          echo "Authorised-origin previews staged. Production root unchanged."

      - name: Construct published site from SEALED production plus isolated previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published-site
          cp -a sealed-production/v9.15.1/frontend/. published-site/
          mkdir -p published-site/preview
          cp -a frontend/preview/. published-site/preview/
          cmp sealed-production/v9.15.1/frontend/index.html published-site/index.html
          cmp sealed-production/v9.15.1/frontend/live3d-operational-v9.html published-site/live3d-operational-v9.html
          grep -Fq 'v=9.15.1-intensity40' published-site/index.html
          ! grep -Fq 'v8-perf-v9' published-site/index.html
          test -f published-site/preview/v9.16.11/src/doppler-layer-transition-v1.js
          test -f published-site/preview/v9.16.10/src/storm-track-trail-visibility-v1.js
          grep -Fq 'f4927fea810833230bce1af65df80ee2e3b59661' published-site/preview/v9.16.10/BUILD.txt
          echo "Deployment payload: SEALED V9.15.1 root + immutable V9.16.10 preview only"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published-site
      - name: Deploy sealed V9.15.1 root and isolated previews
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify immutable production root after Pages deployment
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors "$base/index.html" | grep -Fq 'v=9.15.1-intensity40'
          echo "Verified sealed V9.15.1 public root; development source never published there"

      - name: Verify published V9.16 and stable V9.15.1 URLs
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          EXPECTED_PREVIEW_SHA="$(git -C preview-builds/v9.16 rev-parse HEAD)" node scripts/smoke-v9-16-preview.mjs

      - name: Verify published V9.16.11 genuine Doppler-only preview
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}/preview/v9.16.11"
          retry_curl() { curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors "$1"; }
          build="$(retry_curl "$base/BUILD.txt")"
          grep -Fq "96bb19192765c8a07345a08de1600b491840fb5f" <<< "$build"
          menu="$(retry_curl "$base/src/operational-window-choices-v1.js")"
          grep -Fq 'Doppler — All available' <<< "$menu"
          js="$(retry_curl "$base/src/live3d-operational-v9.js")"
          grep -Fq 'await dopplerOverlayTransition.replacePrepared' <<< "$js"
          echo "Verified V9.16.11 Doppler-only preview; sealed V9.15.1 public root unchanged"
      - name: Verify published V9.16.10 candidate
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}/preview/v9.16.10"
          retry_curl() { curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors "$1"; }
          build="$(retry_curl "$base/BUILD.txt")"
          grep -Fq "f4927fea810833230bce1af65df80ee2e3b59661" <<< "$build"
          js="$(retry_curl "$base/src/live3d-operational-v9.js")"
          grep -Fq "setStormTrackTrailVisibility(hybridSource.entities, show)" <<< "$js"
          echo "Isolated V9.16.10 candidate available at $base/; production source unchanged."
      - name: Verify published native BoM playback preview
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}/preview/native-playback"
          retry_curl() { curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors "$1"; }
          index="$(retry_curl "$base/index.html")"
          grep -Fq 'source-native-playback-review-v2' <<< "$index"
          shell="$(retry_curl "$base/live3d-operational-v9.html")"
          grep -Fq 'Native BoM playback review build' <<< "$shell"
          js="$(retry_curl "$base/src/live3d-operational-v9.js")"
          grep -Fq 'dopplerImageryHandover' <<< "$js"
          ! grep -Eq 'createRadarMotionTransition|interpolateRadarFrame\(' <<< "$js"
          build="$(retry_curl "$base/BUILD.txt")"
          grep -Fq '651b9aaf6780f4efb6a6fada7462483ca20c4ed1' <<< "$build"
          echo "Verified isolated native playback preview at $base/; live production root unchanged."

      - name: Verify deployed playback/cone repair preview (root unchanged)
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}/preview/playback-cone-fix"
          retry_curl() { curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors "$1"; }
          index="$(retry_curl "$base/index.html")"
          grep -Fq 'v8-perf-v9-recovery-v10' <<< "$index"
          shell="$(retry_curl "$base/live3d-operational-v9.html")"
          grep -Fq 'v8-perf-v9-recovery-v10' <<< "$shell"
          js="$(retry_curl "$base/src/live3d-operational-v9.js")"
          grep -Fq 'isDopplerOnlyPlaybackStep' <<< "$js"
          grep -Fq 'followMeasuredPosition' <<< "$js"
          build="$(retry_curl "$base/BUILD.txt")"
          grep -Fq '202c212cd8dc1558b4b8788d01fa71001bc18fdc' <<< "$build"
          echo "Verified isolated repair preview at $base/; production root unchanged."
