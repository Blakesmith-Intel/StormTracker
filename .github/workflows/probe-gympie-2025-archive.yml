name: Probe Gympie 24 November 2025 archive
on:
  push:
    branches: [feature/severe-storm-radar-alerts-v1]
    paths:
      - .github/workflows/probe-gympie-2025-archive.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check NCI AURA volume archive accessibility and metadata
        shell: bash
        run: |
          set -u
          echo "Probing Australian Unified Radar Archive (AURA): Gympie/Mt Kanigan radar 08, 2025-11-24."
          for host in dapds00.nci.org.au thredds.nci.org.au; do
            for path in \
              "/thredds/fileServer/rq0/08/2025/vol/08_20251124.pvol.zip" \
              "/thredds/catalog/rq0/08/2025/vol/catalog.html"; do
              url="https://${host}${path}"
              echo "::group::HEAD ${url}"
              curl -IL --max-time 20 --connect-timeout 9 -sS \
                -o /tmp/gympie-headers.txt \
                -w 'HTTP_STATUS=%{http_code} IP=%{remote_ip} FINAL=%{url_effective}\n' "$url"
              code=$?
              if [ "$code" -eq 0 ]; then
                grep -Ei '^(HTTP/|content-type:|content-length:|last-modified:|location:|accept-ranges:)' /tmp/gympie-headers.txt | tail -18
              else
                echo "PROBE_ERROR=$code"
              fi
              echo "::endgroup::"
            done
          done
          echo "No files downloaded; access probe only. A successful HEAD is not proof of a complete radar archive."
