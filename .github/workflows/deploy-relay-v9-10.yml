name: Deploy StormTracker Relay V9.10

on:
  workflow_dispatch:
  push:
    branches:
      - feature/road-closures-v9.10.0
    paths:
      - "relay/**"
      - "frontend/src/context-layers/flood-road-closure-filter-v1.js"
      - "frontend/src/context-layers/flood-road-closures-v1.js"
      - "frontend/src/context-layers/flood-road-closures-operational-v1.js"
      - "frontend/tests/**"
      - ".github/workflows/deploy-relay-v9-10.yml"

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate StormTracker regression suite
        run: |
          npm test
          node --check relay/worker.js

      - name: Deploy stormtracker-bom-relay
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy
