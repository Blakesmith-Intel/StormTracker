          grep -Fq 'id="reflectivityLegend"' <<< "$html"
          script="$(retry_curl "$base/preview/volume-dbz/src/border-radar-sites-v1.js")"
          grep -Fq '"93"' <<< "$script"
          grep -Fq '"53"' <<< "$script"
          grep -Fq '"28"' <<< "$script"
